# The factory's settings (dev/README.md). A file `factory.local.toml` in the instance's folder (the model's folder,
# never tracked) overrides any of these, key by key; FACTORY_CONFIG names another file to read instead of this one
# (the tests' fixtures). THE DAILY DOLLAR CAP is not here: it is the goal `ai-budget` in dev/model/budget.yaml, which
# both the engine's gate and these programs read.

[paths]
checkout = "~/ergostat"              # where the queue merges and pushes from; never the instance's code
worktrees = "~/ergostat-wt"          # flake triage's worktree: <worktrees>/.triage
live = "~/ergostat-live"             # versions <live>/<sha>, current, instance/; drop.git and sessions/
queue_lock = "~/ergostat-live/queue.lock"   # set it to the coordinator's queue-fast.sh lock during the switch-over
run = "run"                          # briefs, logs, the cost ledger (from the model's folder)

[gates]
kill_after = 6                       # failed gates (reviews, queue conflicts, real failures) that park a gap
build_failures = 6                   # the implementor's failed fast suites that park a gap (main's own failures
                                     # are not counted: dev/bin/onmain.py)
build_hours = 12                     # the implementor's hours on a gap, over its rounds, that park it
flake_fixed_after = 5                # green queue runs in a row naming a seen flake PASSED that fix it (1-50;
                                     # dev/bin/flakes.py green)
mend_most = 5                        # main-broken tests main-mend runs again a run, oldest first (1-20; dev/bin/mend.py)
plan_budget_most = 600               # the plan lint's most size budget for one branch (net lines)
scratch_patterns = [".scratch*", "scratch*", "tmp*", "_probe*", "*_probe*.py", "*.orig", "*.rej", "test_zz*",
                    "*_tmp.py", "*.tail", ".bench*", ".mut*"]
                                     # globs on each path part of a file the branch adds that the definition does not
                                     # name: the implementor's program refuses the build before the suites
                                     # (dev/bin/implement.py strays; the last five from 2026-11-21's real strays)

[planning]                           # planning by a gap's size class (dev/bin/plan.py; dev/README.md, Planning by size)
min_size_confidence = 0.5            # a class is trusted at this confidence or above (low 0.25, medium 0.5, high
                                     # 0.75; 0-1); unset: none is, and every gap takes the full planner

[git]
base = "main"                        # what a gap's branch starts from, and what the queue merges into
remote = "origin"

[ai]
mode = "container"                   # container (each session in Docker, dev/bin/agents.py), or standin (free)
implementor_model = "opus"
reviewer_model = "opus"
implementor_session_usd = 15.0       # the most one implementor session may spend (claude --max-budget-usd)
reviewer_session_usd = 5.0
suite_fix_rounds = 2                 # sessions the implementor gets to make its failing fast suites pass
planner_model = "opus"               # the planner: a gap's definition of done, or its split (dev/bin/plan.py)
planner_session_usd = 5.0
planner_m_session_usd = 2.0          # an M gap's one planner session (above 0, at most planner_session_usd)
join_judge_model = "opus"            # the join judge (plan.py join): a split's coverage against main's code
join_judge_session_usd = 3.0
researcher_model = "opus"            # research questions (dev/bin/research.py)
researcher_session_usd = 5.0
librarian_model = "haiku"            # the librarian's one step: a review's findings against the lessons
librarian_session_usd = 0.25
groomer_model = "opus"               # the groomer: the backlog's links, value, size, risk, closes and splits (backlog.py)
groomer_session_usd = 3.0
pipeline_manager_model = "opus"      # the pipeline manager (dev/bin/manager.py): one session sees the whole pipeline
pipeline_manager_session_usd = 3.0
designer_model = "opus"              # the designer: starts a demo and walks it (agents.py; read-only, pictures in run/shots/)
designer_session_usd = 2.0

[milestones]                         # groups of gaps finished together (dev/bin/milestones.py)
active_max = 3                       # the most milestones active at once, an upkeep one not counted (1-20)
upkeep_days = 7                      # an upkeep milestone's cycle: then it completes, its unfinished gaps carried to the
                                     # next (1-90)
enforce = false                      # true: the pass places every unfinished gap with no milestone, or a completed one
                                     # (a split's or continued gap's parent's; the factory's own: upkeep; else the first
                                     # active). Off until the owner turns it on: on, the first pass moves every old label.
                                     # And the planner and the implementor take only the gaps of active milestones,
                                     # and pulled ones (waits_on_milestone); review and the queue are never held

[backlog]
every_hours = 12                     # the groomer grooms again this long after the last, with no new gap before

[knowledge]                          # what a brief may carry beyond the house rules and the review lessons (always)
chars = 24000                        # the whole knowledge section, in characters, unless the role has its own
pipeline_manager_chars = 12000
research_chars = 6000                # each answered research report a brief carries, cut at a line (within the above)
librarian = true                     # true runs the librarian after each review (an AI step on haiku); the owner wants
                                     # review findings learned (operator, 2026-11-20)

[agents]                             # the sessions' containers (dev/bin/agents.py, dev/agent/)
image = "ergostat-agent:latest"      # docker build -t ergostat-agent:latest dev/agent (after the dev image)
proxy_image = "ergostat-dev:latest"  # runs the egress proxy, dev/agent/egress.py
hosts = ["api.anthropic.com"]        # the only hosts a session can reach, on 443
research_hosts = ["*"]               # what else a researcher (alone, on ergostat-research through its own proxy,
                                     # ergostat-egress-research) reaches on 443 for WebFetch and the walker: "*" any
                                     # host whose addresses are all public (never loopback, private, link-local), or a
                                     # list of names, those alone; [] the API alone. Not a list of names: refused
token_file = "~/.config/ergostat/claude-token"   # the owner's, from `claude setup-token`; mode 600, or no session
                                     # Docker's VM has 24 CPUs, split three ways so none slows another (the owner,
                                     # 2026-11-21); an empty cpuset pins nothing (agents.limits)
session_cpus = 1.5                   # each AI session's (and its finish's) container's --cpus; the suite containers
                                     # keep their 4. Empty or absent: 4; above 4 or not a number refuses the session
designer_cpus = 3                    # a designer's --cpus, and a web-touching implementor's (its brief names
                                     # ergostat/web/): an engine and Chromium at once. Absent: 3; outside (0, 4] refused
session_cpuset = "0-7"               # the sessions' (implementor, reviewer, ...) and their finish's CPUs
suite_cpuset = "8-11"                # a gap's own suites' (the implementor's rounds, 4 CPUs each)
queue_cpuset = "12-23"               # the merge queue's and flake triage's suites ([suites] queue_container): unit (8)
                                     # and browser (4) at once

[pools]                              # the AI pools start at 1, sized by risk (dev/bin/pools.py; the owner's tolerance is
                                     # the parameter risk-tolerance in dev/model/pools.yaml)
implementor_max = 9                  # the most each may reach (the blocks' pool: in the model is this cap; at most 9)
reviewer_max = 6                     # operator: reviewers spend AI budget, not machine; suites are capped by the suite slots
probation = 3                        # gaps given a verdict after a raise before the next raise is asked for
cycle_hours = 2                      # the cycle time assumed before one is measured (short: more gaps a day, more risk)
hold = true                          # operator (2026-11-20): the role pools stay where `pools.py set` put them; the tuner
                                     # says what it would do (pool.measured, held). false: sized by risk
batch = 1                            # approved gaps the merge queue tests together, to start (1: one a run)
batch_max = 8                        # the most a batch may be (the tuner asks for more while the queue wait is off)
batch_minutes = 120                  # a queue run's time allowance from its start: past it, no more splitting (what is
                                     # proven lands, the rest back to approved uncounted); over 150 refused, so one suite
                                     # run after it stays inside the block's 3 h timeout

[manager]                            # the pipeline manager's sessions (dev/bin/watch.py, manager.py)
open = 1                             # the switch managing-open: 0 pauses it
every = "2h"                         # a scheduled session (the routine review), when something changed since the last
broken_minutes = 30                  # a session at once when the merge pipeline has been broken this long
most_actions = 8                     # manage.py calls a session may make (held to 1..12)
parked_within_hours = 48             # a park this recent is a trigger (older ones were the coordinator's)
park_wait_hours = 24                 # a waits_on / needs park not cleared this long is a trigger (dev/bin/parks.py)
intervention_hours = 12              # an open defect (not a decision: operator-decision, factory-tuning, factory: false)
                                     # unremedied this long is a trigger

[manager.stuck_hours]                # a gap this long in one state is stuck (states not named are never stuck)
ready = 6
fix = 6
leased = 3
building = 5
built = 2
in-review = 2
approved = 4
queued = 3
queue-failed = 1

[resources]                          # the machine (dev/model/resources.yaml holds the setpoints)
session_cpus = 0.5                   # one session's use until three are measured (run/resources/sessions.jsonl)
session_memory_gb = 1.0
suite_cpus = 4.0                     # one of its suites' (in a container of 4 CPUs and 12 GB); not charged with [suites] slot
suite_memory_gb = 4.0
session_keep_hours = 24              # session folders and installs younger than this are kept (but see the next)
finished_states = ["approved", "queued", "push-pending", "merged", "closed"]   # a gap's session folders are removed
                                     # sooner once every gap of its name is in one (its work is on its branch), unless
                                     # touched in the last 10 minutes or mounted by a running container; [] or unset: never

[code_health]                        # coverage (dev/README.md, Coverage) and the simplifier's pick (dev/bin/simplify.py;
                                     # its pool is 1, fixed in the code). The pick reads main's latest coverage report
                                     # under run/coverage/ as measure.py does (by seq, on main, not stale); none, no pick
coverage_floor = 0.6                 # a module whose share of statements run by the unit suite is under this is
                                     # named (measure.py coverage-below-floor; coverage_report.py --below), and one
                                     # under it (or not in the report) is never picked
size = 1.0                         # the weights of a module's score: net lines over the 75th percentile (as a share
churn = 0.25                         # of it), commits in the last 60 days, duplicate bodies, dead candidates
duplicates = 1.0
dead = 0.5

[instance]
port = 8798

[load]
threads = 1500                       # the hard rule (scripts/suite_watch.py kills past these)
memory_gb = 6.0
wait = true                          # wait before each suite while the machine is full (the tests turn it off)
most_suites = 4                      # full: this many suites running (the queue's slot and three shared ones)
wait_poll = 20                       # seconds between looks while another suite runs

[suites]                             # run in the checkout (queue) or the gap's worktree (implementor)
slot = ""                            # a command that holds a machine-wide suite slot around each suite but the
                                     # queue's (whose lock is its slot): set it in factory.local.toml, e.g. the
                                     # coordinator's suite-slot.sh
slots = 6                            # the slots it gives (1-32): the last one kept for the merge queue while approved
                                     # gaps wait (dev/bin/slots.py; dev/README.md, The kept slot)
ruff = ""                            # the lint step of the queue and the implementor's fast suites: "" is off, so no
                                     # batch or round is ever red for lint (was "uv run ruff check ergostat tests
                                     # scripts"; set it again to bring the gate back)
precommit = 'uv run ruff format -q "$@"; uv run ruff check -q --fix --exit-zero "$@"'
                                     # the build sessions' pre-commit hook (agents.precommit): run on the staged
                                     # Python files ("$@"), which are then staged again; it never refuses a commit
                                     # and skips merge commits.
                                     # "" or absent: no hook
unit = "uv run python scripts/suite_watch.py -- uv run python -m pytest -q -rpfEs -n 8 --dist worksteal"
                                     # (-rpfEs: each skip named, for the host step's check; f and E keep the FAILED
                                     # and ERROR lines fac.failed_tests reads, since -r replaces pytest's default fE;
                                     # p the PASSED lines a green run counts toward a seen flake's fix, flakes.green,
                                     # first: pytest prints them in this order, so the FAILED lines stay in the tail)
host = "uv run python scripts/suite_watch.py -- uv run python -m pytest -q -rfEs -n 4 --dist worksteal tests/test_repair2.py tests/test_sandbox_attacks.py tests/test_notify.py"
                                     # the queue's tests its container skips (bwrap, kqueue): on the Mac, never in a
                                     # container, after unit and browser, a required step; "" turns it off. A test it
                                     # skips that the unit run skipped too fails it (queue.nowhere)
build = "uv run python scripts/suite_watch.py -- uv run python scripts/affected_tests.py -- uv run python -m pytest -q -rpfEs -n 8 --dist worksteal"
                                     # the implementor's test step (onmain.py): the tests the branch changed and those
                                     # of the modules it changed (affected_tests.py). Comment it out or leave it ""
                                     # and the step runs the full unit suite, as before. The merge queue never reads
                                     # it: it always runs unit and demo in full, browser on browser_paths
browser = "uv run python scripts/suite_watch.py -- uv run --with playwright==1.63.0 python -m pytest -q -rpfEs -n 4 --dist worksteal tests/test_diagram_rendering.py tests/test_page_polling.py tests/test_items_page.py tests/test_page_refresh.py tests/test_keyboard_story.py"
                                     # (-rpfEs, as unit: the SKIPPED lines queue.suites counts, the FAILED and
                                     # ERROR lines fac.failed_tests reads, -rs alone printed neither, and PASSED)
browser_paths = ["ergostat/web/**", "examples/**", "tests/fixtures/layout_known.json", "tests/fixtures/diagram_sizes.json",
                 "tests/layout_*", "tests/test_diagram_rendering.py", "tests/test_page_polling.py",
                 "tests/test_items_page.py", "tests/test_page_refresh.py", "tests/test_keyboard_story.py"]
                                     # the queue runs browser in a batch only when `git diff --name-only` from main
                                     # names one of these (fnmatch: * crosses /); else `browser: {not_run: ...}`. [] or
                                     # absent: every batch, as before. The net: the daily run on main (browser-daily)
browser_ready = "uv run --with playwright==1.63.0 python -c 'from playwright.sync_api import sync_playwright as s; p = s().start(); p.chromium.launch().close(); p.stop()'"
                                     # before an implementor round with build_browser (agents.browser_ready): no
                                     # browser stops it
build_browser = false                # true: each implementor round also runs the four browser files (-n 4, minutes
                                     # of 4 CPUs) after a Chromium launch; false: only ruff and build (unit where no
                                     # build is set). The merge queue runs its suites either way (browser_paths)
demo = "uv run --with playwright==1.63.0 python scripts/demo_check.py ticket-factory image-squeeze the-job roadmap"
alone = "uv run python scripts/suite_watch.py -- uv run python -m pytest -q -p no:randomly {tests}"   # the
                                     # implementor's failing tests again, on its branch and on main (onmain.py)
rerun = "uv run python scripts/suite_watch.py -- uv run --with playwright==1.63.0 python -m pytest -q -rfEs -p no:randomly {tests}"
                                     # (-rfEs, as browser: the FAILED and ERROR lines fac.failed_tests reads)
measure = "uv run python scripts/suite_watch.py -- uv run python -m pytest -q -p no:randomly {tests}"  # one run of
                                     # a definition's named measurement (manage.py measure-runs, dev/bin/runs.py)
load = '''python3 scripts/suite_watch.py -- python3 -c '
import os, sys, time
k, beat, stale = int(sys.argv[1]), sys.argv[2], float(sys.argv[3])
any(os.fork() == 0 for _ in range(k - 1))
seen, at = None, time.monotonic()
while time.monotonic() - at < stale:
    t = time.monotonic()
    while time.monotonic() - t < 0.5: pass
    try: m = os.stat(beat).st_mtime_ns
    except OSError: break
    if m != seen: seen, at = m, time.monotonic()
' {procs} {beat} {stale}'''
                                     # its CPU load: {procs} (1-8) busy processes, under the watchdog, each ending
                                     # once {beat} is gone or unchanged for {stale} s (runs.loaded touches it)
load_stale_s = 30                    # 1-300
check = "uv run ergostat check --json --no-coherence"   # on the branch and on main (implement.py new_findings)
queue_container = true               # the queue's and triage's suites each in a container of the agent image, on
                                     # [agents] queue_cpuset, no network (agents.queued); false: on the Mac, as before
stall_minutes = 10                   # a queue or triage suite whose log has not grown this long is stopped (at most 60)
wall_minutes = 45                    # ... and one past this long in all (3 x the suites-in-time goal; at most 120)
queue_coverage = true                # the queue's unit run (main's alone, never an implementor's) under the
                                     # line tracer (ERGOSTAT_COVERAGE, tests/coverage_lines.py), its report kept under
                                     # run/coverage/ (dev/README.md, Coverage). On: its overhead on the full unit
                                     # suite measured within noise (code-health-coverage.md, Where it stopped)
