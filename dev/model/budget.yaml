# What the factory's AI sessions may spend. THE DAILY CAP IS HERE, AND ONLY HERE: the goal ai-budget's hold, in
# dollars over the last day. The engine's gates (implement-when, review-when) read it, and the implementor's and the
# reviewer's programs read the same line (dev/bin/fac.py, daily_cap) before each session, against their own ledger
# (run/costs.jsonl). Both fail closed: a spend not read (no reading yet, a stale one, a ledger that cannot be read)
# stops the sessions; the modelling loop (haiku) counts against it too.
defaults:
  system: spending

auxiliaries:
  ai-spend:
    unit: USD
    description: what the AI sessions cost over the last day, as Claude Code reported it
    driven-by: [+stock.gaps-building, +stock.gaps-in-review, +stock.situations-raised]
    sensor: {builtin: ergostat.cost.usd, every: 5m, description: AI sessions' cost over a day}
  ai-held:
    unit: switch
    description: 1 while the provider's usage limit holds the AI till its reset (run/ai_hold.json, dev/bin/aihold.py; a hold file that cannot be read holds), else 0
    sensor: {run: python3 dev/bin/aihold.py held, every: 30s, timeout: 25s, description: the AI hold}

goals:
  ai-not-held:
    auxiliary: ai-held
    hold: "<= 0"
    tolerance: 0
    on-stale: "off"                    # a hold not read is counted as standing: the gates close
    description: no AI-role lease is taken while a usage-limit stop holds the AI (implement-, review-, plan- and research-when read it); the merge queue and the suites never do
  ai-budget:
    auxiliary: ai-spend
    hold: "<= 3000"
    tolerance: 0
    on-stale: "off"                    # a spend not read is counted as over: the gates close
    description: the factory's AI sessions (the implementor, the reviewer, the planner, the pipeline manager...) spend at most $3000 a day (change it here)
