# Knowledge and planning (docs/roadmap/overnight/knowledge.md; the owner, 2026-11-20: "think of this ergostat instance
# as a resource for you"). Briefs carry the factory's knowledge (dev/knowledge/, dev/bin/knowledge.py); a planner
# writes each open gap's definition of done, or splits it; a program lints it and a lint-clean plan is the definition
# at once; an advisory plan review reads a sample against the code and the task graph, its findings appended as notes
# and recorded by class for the knowledge loop (never a gate); a researcher answers questions; the librarian turns review findings into proposed lessons, approved by the
# coordinator and applied by a program (lesson-apply) to the record the briefs read - a queue of their own, never gaps.
defaults:
  system: planning

stocks:
  gaps-planned:
    unit: gaps
    description: plans left in planned from when the plan review was a gate - the plan lint's sweep makes each the definition
    sensor: {items: gap, state: planned, every: 1m}
  gaps-replan:
    unit: gaps
    description: plans the lint sent back (or the old plan review, whose plans the lint's sweep defines), waiting for the planner again
    sensor: {items: gap, state: replan, every: 1m}
  gaps-split:
    system: split-and-join
    unit: gaps
    description: gaps split into sub-gaps, each waiting until every one of its sub-gaps is merged (a join)
    sensor: {items: gap, state: split, every: 1m}
  gaps-joined:
    system: joins
    unit: gaps
    description: split gaps whose sub-gaps all merged, waiting for the join judge - covered (merged) or short (split again)
    sensor: {items: gap, state: joined, every: 1m}
  research-asked:
    system: research
    unit: questions
    description: research questions asked by the coordinator or a planner, waiting for the researcher
    sensor: {items: research, state: asked, every: 1m}
  knowledge-entries:
    system: knowledge
    unit: entries
    description: the entries of dev/knowledge/ in the running version, each of a declared kind (component, rule, lesson, finding, question, source); the owner's decisions are ergostat.decision items, not entries
    sensor: {items: knowledge, state: active, every: 1m}
  plan-reviews:
    system: knowledge
    unit: reviews
    description: advisory plan reviews written (review/<branch>-plan), their findings by class - what the librarian and the coordinator learn from
    cumulative: true
    sensor: {items: review, state: written, where: {stage: plan}, every: 1m}
  lessons-proposed:
    system: knowledge
    unit: proposals
    description: lessons the librarian proposed, and findings the researcher proposed from checked answers, waiting for the coordinator (the gated action knowledge-change)
    sensor: {items: lesson, state: proposed, every: 1m}
  findings-active:
    system: knowledge
    unit: entries
    description: the active findings - checked research answers approved and applied, carried in briefs whose gap names one of their areas
    sensor: {items: knowledge, state: active, where: {kind: finding}, every: 1m}
  lessons-to-apply:
    system: knowledge
    unit: lessons
    description: lessons approved (knowledge-change, or the coordinator's lesson.py add / retire), waiting for lesson-apply
    sensor: {items: lesson, state: approved, every: 1m}

auxiliaries:
  lesson-apply-hours:
    system: knowledge
    unit: hours
    description: mean hours from proposed (or the coordinator's own, approved) to applied, of lessons applied in 14 days
    driven-by: [+stock.lessons-to-apply]
    sensor: {run: python3 dev/bin/lesson.py hours, every: 10m, timeout: 1m, description: the knowledge queue's measure}
  planning-open:
    unit: switch
    exogenous: true
    description: 1 while the coordinator lets the planner plan open gaps, 0 (or never read) while planning is paused
    sensor: {manual: true}
  lessons-per-brief:
    system: knowledge
    unit: entries
    description: review lessons carried per first implementor brief, over 14 days
    driven-by: [+stock.knowledge-entries]
    sensor: {run: python3 dev/bin/measure.py lessons-per-brief, every: 10m, timeout: 1m, description: the factory's measures}
  first-pass-with-lessons:
    system: knowledge
    unit: share
    description: the first-pass yield of gaps whose first brief carried review lessons (against first-pass-yield, every gap's)
    driven-by: [+auxiliary.lessons-per-brief]
    sensor: {run: python3 dev/bin/measure.py first-pass-with-lessons, every: 10m, timeout: 1m, description: the factory's measures}
  plan-risks-held:
    unit: share
    description: of planned gaps reviewed, the share whose first review found none of the lesson classes their plan named as risks (the plan's tests held them)
    driven-by: [+flow.plans-written]
    sensor: {run: python3 dev/bin/measure.py plan-risks-held, every: 10m, timeout: 1m, description: the factory's measures}
  plan-reviews-waiting:
    unit: gaps
    description: ready gaps marked for the advisory plan review ([plan] review), not yet read
    driven-by: [+flow.plans-written, -flow.plan-reviews-written]
    sensor: {run: python3 dev/bin/planreview.py waiting, every: 5m, timeout: 1m, description: the factory's measures}
  plan-review-agreement:
    unit: share
    description: of plan reviews in 14 days, the share that found nothing that would make the build go wrong (agreement with the planner, not a gate)
    driven-by: [+flow.plan-reviews-written]
    sensor: {run: python3 dev/bin/planreview.py agreement, every: 10m, timeout: 1m, description: the factory's measures}
  plan-flagged-fix-rounds:
    unit: rounds
    description: of gaps finished in 14 days whose plan review flagged it (blocking findings), their mean code-review fix rounds - against plan-clean-fix-rounds, what the plan review is worth
    driven-by: [+flow.plan-reviews-written]
    sensor: {run: python3 dev/bin/planreview.py value fix-rounds flagged, every: 10m, timeout: 1m, description: the factory's measures}
  plan-clean-fix-rounds:
    unit: rounds
    description: of gaps finished in 14 days whose plan review found nothing blocking, their mean code-review fix rounds - against plan-flagged-fix-rounds, what the plan review is worth
    driven-by: [+flow.plan-reviews-written]
    sensor: {run: python3 dev/bin/planreview.py value fix-rounds clean, every: 10m, timeout: 1m, description: the factory's measures}
  plan-flagged-parks:
    unit: share
    description: of gaps finished in 14 days whose plan review flagged it (blocking findings), the share parked - against plan-clean-parks, what the plan review is worth
    driven-by: [+flow.plan-reviews-written]
    sensor: {run: python3 dev/bin/planreview.py value parks flagged, every: 10m, timeout: 1m, description: the factory's measures}
  plan-clean-parks:
    unit: share
    description: of gaps finished in 14 days whose plan review found nothing blocking, the share parked - against plan-flagged-parks, what the plan review is worth
    driven-by: [+flow.plan-reviews-written]
    sensor: {run: python3 dev/bin/planreview.py value parks clean, every: 10m, timeout: 1m, description: the factory's measures}
  planning-cost-share:
    unit: share
    description: planning dollars (planner and plan review sessions) over all AI dollars, of gaps merged in 14 days that carry a planning cost - where the money went, not a claim that less planning is safe
    driven-by: [+flow.plans-written, -flow.small-gaps-defined, -flow.plans-unreviewed]
    sensor: {run: python3 dev/bin/measure.py planning-cost-share, every: 10m, timeout: 1m, description: the factory's measures}
  splits-clean:
    system: open-gaps
    unit: share
    description: of sub-gaps merged, the share approved on their first review
    driven-by: [+flow.gaps-split-off]
    sensor: {run: python3 dev/bin/measure.py splits-clean, every: 10m, timeout: 1m, description: the factory's measures}
  splits-covered:
    system: open-gaps
    unit: share
    description: of split parents whose first join verdict is in 14 days, the share whose first verdict (in record order) was covered; short then covered counts as not covered
    driven-by: [+flow.gaps-split-off]
    sensor: {run: python3 dev/bin/measure.py splits-covered, every: 10m, timeout: 1m, description: the factory's measures}
  split-budgets-held:
    system: open-gaps
    unit: share
    description: of sub-gaps merged in 14 days, the share whose net lines are at or under their own definition's size budget; a definition, budget or net lines it cannot read is not held
    driven-by: [+flow.gaps-split-off]
    sensor: {run: python3 dev/bin/measure.py split-budgets-held, every: 10m, timeout: 1m, description: the factory's measures}
  split-joins:
    system: open-gaps
    unit: parents
    description: split parents with at least one join verdict, over the whole record
    driven-by: [+flow.gaps-split-off]
    sensor: {run: python3 dev/bin/measure.py split-joins, every: 10m, timeout: 1m, description: the factory's measures}
  split-overhead:
    system: open-gaps
    unit: ratio
    description: of split parents judged covered in 14 days (judged_at), the median of the parent's own AI cost plus its children's (join sub-gaps and continuations too, a parked sub-gap's cost but not its lines) over the median cost of merged unsplit gaps of the children's summed size class; a parent that cannot be priced is left out
    driven-by: [+flow.gaps-split-off]
    sensor: {run: python3 dev/bin/measure.py split-overhead, every: 10m, timeout: 1m, description: the factory's measures}

flows:
  plans-written:
    from: gaps-open
    to: gaps-ready
    description: a first plan written for an open gap, lint-clean - its definition of done (run/defs/), the gap ready
    driven-by: [+stock.gaps-open]
    equation: stock.gaps-open / plan-time
    sensor: {items: gap, entering: ready, where: {defined_by: plan, replanned: false}, over: 1d}
  replans-written:
    from: gaps-replan
    to: gaps-ready
    description: a plan written again with the lint's findings, lint-clean - the gap ready
    driven-by: [+stock.gaps-replan]
    equation: stock.gaps-replan / plan-time
    sensor: {items: gap, entering: ready, where: {defined_by: plan, replanned: true}, over: 1d}
  small-gaps-defined:
    from: gaps-open
    to: gaps-ready
    description: an open gap sized S - its definition written from its own title and text with the house rules, no planner session, no review
    driven-by: [+stock.gaps-open]
    equation: small-share * stock.gaps-open / plan-time
    sensor: {items: gap, entering: ready, where: {defined_by: size-s}, over: 1d}
  plans-unreviewed:
    from: gaps-open
    to: gaps-ready
    description: an open gap sized M (one session under its own cap), or L not picked for the plan review - its plan lint-clean, the gap ready with no plan review
    driven-by: [+stock.gaps-open]
    equation: unreviewed-share * stock.gaps-open / plan-time
    sensor: {items: gap, entering: ready, where: {defined_by: plan-unreviewed}, over: 1d}
  sub-gaps-planned:
    to: gaps-ready
    description: sub-gaps of a split, each requested and defined by the planner (lint-clean)
    sensor: {items: gap, entering: ready, where: {defined_by: plan-split}, over: 1d}
  gaps-split-off:
    system: open-gaps
    from: gaps-open
    to: gaps-split
    description: a gap too large for one branch, split by the planner into sub-gaps with depends-on among them
    driven-by: [+stock.gaps-open]
    equation: split-share * stock.gaps-open / plan-time
    sensor: {items: gap, entering: split, where: {lease.back: open}, over: 1d}
  replans-split-off:
    system: split-and-join
    from: gaps-replan
    to: gaps-split
    description: a plan sent back that the planner then split into sub-gaps
    driven-by: [+stock.gaps-replan]
    equation: split-share * stock.gaps-replan / plan-time
    sensor: {items: gap, entering: split, where: {lease.back: replan}, over: 1d}
  splits-joined:
    system: split-and-join
    from: gaps-split
    to: gaps-joined
    description: a split gap moved to joined once every sub-gap was merged (a join), for the join judge
    driven-by: [+stock.gaps-split]
    equation: stock.gaps-split / split-time
    sensor: {items: gap, entering: joined, over: 1d}
  joins-covered:
    system: joins
    from: gaps-joined
    to: gaps-landed
    description: a joined gap the join judge found covered - merged (merged_by join-judge, so not gaps-merged's), with its verdict
    driven-by: [+stock.gaps-joined]
    equation: (1 - short-share) * stock.gaps-joined / judge-time
    sensor: {items: gap, entering: merged, where: {join_verdict: covered}, over: 1d}
  joins-short:
    system: joins
    from: gaps-joined
    to: gaps-split
    description: a joined gap the join judge found short - a sub-gap requested for what was not built, then split again
    driven-by: [+stock.gaps-joined]
    equation: short-share * stock.gaps-joined / judge-time
    sensor: {items: gap, entering: split, where: {lease.back: joined}, over: 1d}
  joins-parked:
    system: joins
    from: gaps-joined
    description: a joined gap found short past the most short rounds - parked with the points still not built
    sensor: {items: gap, entering: parked, where: {parked_in: joined}, over: 1d}
  splits-parked:
    system: split-and-join
    from: gaps-split
    description: a split gap parked because one of its sub-gaps parked (or died) - where it stopped names which
    driven-by: [+stock.gaps-split]
    equation: stuck-share * stock.gaps-split / split-time
    sensor: {items: gap, entering: parked, where: {parked_in: split}, over: 1d}
  plans-left-planned:
    from: gaps-replan
    to: gaps-planned
    description: none since the lint made a plan the definition - gaps entered planned only while the plan review was a gate
    equation: "0"
    sensor: {items: gap, entering: planned, over: 1d}
  planned-plans-defined:
    from: gaps-planned
    to: gaps-ready
    description: a plan left in planned, made the definition by the lint's sweep once lint-clean
    driven-by: [+stock.gaps-planned]
    equation: stock.gaps-planned / sweep-time
    sensor: {items: gap, entering: ready, where: {defined_by: plan-lint, released_from: planned}, over: 1d}
  replans-defined:
    from: gaps-replan
    to: gaps-ready
    description: a plan the old plan review sent back, made the definition by the lint's sweep once lint-clean (its findings appended as notes)
    driven-by: [+stock.gaps-replan]
    equation: stock.gaps-replan / sweep-time
    sensor: {items: gap, entering: ready, where: {defined_by: plan-lint, released_from: replan}, over: 1d}
  plans-failing-lint:
    from: gaps-open
    to: gaps-replan
    description: a plan the plan lint sent back to the planner (a section, a test name, the budget, a lesson, a dependency or a file missing)
    driven-by: [+stock.gaps-open]
    equation: lint-fail-share * stock.gaps-open / plan-time
    sensor: {items: gap, entering: replan, where: {plan_sent_back_by: lint}, over: 1d}
  parked-in-plan:
    from: gaps-replan
    description: a plan that failed the lint six times, or a gap the coordinator agreed should not be built (park-gap)
    sensor: {items: gap, entering: parked, where: {parked_in: plan}, over: 1d}
  plan-reviews-written:
    system: knowledge
    to: plan-reviews
    description: an advisory plan review - its findings appended to the definition and recorded by class (review/<branch>-plan) for the knowledge loop
    sensor: {items: review, entering: written, where: {stage: plan}, over: 1d}
  research-questions:
    system: research
    to: research-asked
    description: questions asked (dev/bin/ask.py, a research.asked event, or a planner that needs an answer first)
    sensor: {items: research, entering: asked, over: 1d}
  research-answered:
    system: research
    from: research-asked
    description: a question answered with at least one source checked (a file and line of the clone, a URL the session opened) - its report in run/research/, its summary on the item
    driven-by: [+stock.research-asked]
    equation: stock.research-asked / research-time
    sensor: {items: research, entering: answered, over: 1d}
  research-unsourced:
    system: research
    from: research-asked
    description: an answer with no source checked - given back and asked again (back in through research-questions), the why in its brief; a second is a dead letter
    sensor: {items: research, entering: unsourced, over: 1d}
  lessons-found:
    system: knowledge
    to: lessons-proposed
    description: a new shape of a known class, or a class found in a second review, proposed by the librarian; or a finding, from a research answer with a checked source
    sensor: {items: lesson, entering: proposed, over: 1d}
  lessons-approved:
    system: knowledge
    from: lessons-proposed
    to: lessons-to-apply
    description: a proposal the coordinator approved - recorded approved with its exact text, never a gap
    driven-by: [+stock.lessons-proposed]
    equation: stock.lessons-proposed / lesson-approve-time
    sensor: {items: lesson, entering: approved, over: 1d}
  lessons-denied:
    system: knowledge
    from: lessons-proposed
    description: a proposal the coordinator denied - settled denied, with who and why, and never proposed again
    sensor: {items: lesson, entering: denied, over: 1d}
  lessons-added:
    system: knowledge
    from: lessons-to-apply
    to: knowledge-entries
    description: an approved lesson applied by lesson-apply to the record the briefs read - a new entry or a "seen as" line, shown as knowledge/* by knowledge-sync
    driven-by: [+stock.lessons-to-apply]
    equation: stock.lessons-to-apply / lesson-apply-time
    sensor: {items: lesson, entering: applied, over: 1d}
  lessons-retired:
    system: knowledge
    from: knowledge-entries
    description: a lesson removed by the coordinator (dev/bin/lesson.py retire) - one briefs carried while first-pass yield did not move
    sensor: {items: lesson, entering: retired, over: 1d}
  findings-applied:
    system: knowledge
    to: findings-active
    description: an approved finding applied by lesson-apply - an entry finding-<slug> of kind finding, carried by area
    sensor: {items: lesson, entering: applied, where: {kind: finding}, over: 1d}
  findings-retired:
    system: knowledge
    from: findings-active
    description: a finding removed by the coordinator (dev/bin/lesson.py retire) - no longer carried in any brief
    sensor: {items: lesson, entering: retired, where: {kind: finding}, over: 1d}

parameters:
  plan-time:
    value: 30m
    estimate: true
    description: how long the planner takes on a gap
  lint-fail-share:
    value: 0.2
    unit: "1"
    range: [0, 1]
    estimate: true
    description: the share of plans the lint sends back to the planner
  sweep-time:
    value: 5m
    description: how often the plan lint's sweep runs
  split-share:
    value: 0.1
    unit: "1"
    range: [0, 1]
    estimate: true
    description: the share of open gaps the planner splits
  small-share:
    value: 0.2
    unit: "1"
    range: [0, 1]
    estimate: true
    description: the share of open gaps sized S with enough confidence, defined with no planner session
  unreviewed-share:
    value: 0.3
    unit: "1"
    range: [0, 1]
    estimate: true
    description: the share of open gaps planned with no plan review (sized M, or L not picked for the sample)
  split-time:
    value: 3d
    estimate: true
    description: how long a split gap waits for every one of its sub-gaps to merge
  judge-time:
    system: joins
    value: 30m
    estimate: true
    description: how long a joined gap waits for the join judge
  short-share:
    system: joins
    value: 0.2
    unit: "1"
    range: [0, 1]
    estimate: true
    description: the share of joined gaps the join judge finds short
  stuck-share:
    system: split-and-join
    value: 0.1
    unit: "1"
    range: [0, 1]
    estimate: true
    description: the share of split gaps one of whose sub-gaps parks
  research-time:
    system: research
    value: 1h
    estimate: true
    description: how long a research question takes
  lesson-approve-time:
    system: knowledge
    value: 12h
    estimate: true
    description: how long a proposed lesson waits for the coordinator
  lesson-apply-time:
    system: knowledge
    value: 1m
    description: how long an approved lesson waits for lesson-apply (a program, no AI)

goals:
  open-gaps-planned:
    system: open-gaps
    stock: gaps-open
    hold: "<= 0"
    tolerance: 0
    description: every open gap planned (while planning is open and money is left)
  plans-agreed:
    auxiliary: plan-review-agreement
    hold: ">= 0.5"
    tolerance: 0.1
    description: most plans the plan review reads have nothing that would make the build go wrong (a measure of the planner, never a gate)
  plans-reviewed:
    stock: gaps-planned
    hold: "<= 0"
    tolerance: 0
    description: no plan left in planned (the lint's sweep defines each)
  plan-reviews-done:
    auxiliary: plan-reviews-waiting
    hold: "<= 0"
    tolerance: 0
    description: every plan marked for the advisory plan review read
  replans-taken:
    stock: gaps-replan
    hold: "<= 0"
    tolerance: 0
    description: every plan sent back written again
  questions-answered:
    system: research
    stock: research-asked
    hold: "<= 0"
    tolerance: 0
    description: every research question answered
  lessons-decided:
    system: knowledge
    stock: lessons-proposed
    hold: "<= 0"
    tolerance: 0
    description: every proposed lesson approved or denied by the coordinator
  lessons-applied:
    system: knowledge
    stock: lessons-to-apply
    hold: "<= 0"
    tolerance: 0
    description: every approved lesson applied (lesson-apply's loop reads it)

actions:
  park-gap:
    run: python3 dev/bin/planreview.py park {gap} {why}
    in: .
    gate: approve
    class: park
    args: {gap: the gap (gap/...), why: why the plan review says it should not be built}
    timeout: 5m
    description: The plan review says a gap should not be built (done already, a duplicate, wrong for the system) - the coordinator approves, or it is built
  knowledge-change:
    run: python3 dev/bin/lesson.py request {lesson}
    in: .
    gate: approve
    class: knowledge
    args: {lesson: the proposed lesson or finding (lesson/...)}
    timeout: 2m
    description: A proposed change to the review lessons, or a finding, recorded approved with its exact text for lesson-apply (never a gap) - the coordinator approves

blocks:
  plan-when:
    type: expr
    description: plan while open gaps (or plans sent back) wait, planning is open, and the AI is not stopped (ai-stopped)
    in:
      open: goal.open-gaps-planned.off
      replan: goal.replans-taken.off
      planning: auxiliary.planning-open
      stop: block.ai-stopped
    expr: max(open, replan) * min(planning, 1) * (1 - stop)
    out: block.planner
  ai-stopped:
    type: expr
    description: planning's AI sessions stopped - the day's AI money spent, or the provider's usage limit holding the AI till its reset (one read of each for plan-when and plan-review-when)
    in:
      over: goal.ai-budget.off
      held: goal.ai-not-held.off
    expr: max(over, held)
    out: [block.plan-when, block.plan-review-when]
  planner:
    type: ai
    agent: opus
    description: a session per gap in a read-only clone of main - its definition of done (acceptance tests, budget, risks from the lessons, files), a split into sub-gaps, or research questions first
    run: python3 dev/bin/plan.py
    prompt: dev/prompts/planner.md
    takes: {kind: gap, at: [open, replan], to: [split, ready, replan, parked], unblocked: true, order: rank,
            where: {continues: null, waits_on_milestone: null}}
    # (a gap continuing a branch waits for the intake: its definition is on it; one whose milestone is not active
    # and that is not pulled waits for it, once [milestones] enforce: dev/bin/milestones.py)
    pool: 12                           # operator: planners spend AI budget, not machine
    lease: {ttl: 60m, attempts: 2}
    timeout: 2h
    in: block.plan-when
    out: [flow.plans-written, flow.small-gaps-defined, flow.plans-unreviewed, flow.replans-written, flow.gaps-split-off, flow.replans-split-off, flow.sub-gaps-planned,
          flow.plans-failing-lint, flow.parked-in-plan]

  plan-lint:
    type: program
    description: the plan lint's sweep, no AI - a plan left in planned, or sent back by the old plan review, made the definition once lint-clean (the planner lints each plan it writes itself)
    run: python3 dev/bin/plan.py lint
    goal: plans-reviewed
    every: 5m
    timeout: 5m
    out: [flow.planned-plans-defined, flow.replans-defined]

  plan-review-when:
    type: expr
    description: review a sample of plans while some wait and the AI is not stopped (ai-stopped) - advice, never a gate
    in:
      waiting: goal.plan-reviews-done.off
      stop: block.ai-stopped
    expr: waiting * (1 - stop)
    out: block.plan-review
  plan-review:
    type: program
    system: knowledge
    description: the advisory plan review, a side loop - a session in a read-only clone of main with the task graph; its findings appended to the ready gap's definition and recorded by class; "should not be built" only asked of the coordinator (park-gap)
    run: python3 dev/bin/planreview.py
    every: 10m
    timeout: 45m
    actions: [park-gap]
    in: block.plan-review-when
    out: flow.plan-reviews-written

  split-watch:
    type: program
    system: intake
    description: parks a split gap one of whose sub-gaps parked or died, naming it (the join only moves it on once all merged)
    run: python3 dev/bin/plan.py splits
    every: 5m
    timeout: 5m
    out: flow.splits-parked
  join-judge:
    type: ai
    system: intake
    agent: opus
    description: a session per joined gap in a read-only clone of main - its entry, its coverage, each sub-gap's definition and last review against the code (a sub-gap it cannot read is short, with no session); covered merges it (no merged_at), short requests a sub-gap for what is missing and splits it again (the second short parks it); it waits while the day's money is spent
    run: python3 dev/bin/plan.py join
    prompt: dev/prompts/join_judge.md
    takes: {kind: gap, at: [joined], to: [merged, split, parked]}
    pool: 1
    lease: {ttl: 60m, attempts: 2}
    timeout: 1h
    out: [flow.joins-covered, flow.joins-short, flow.joins-parked]

  research-when:
    type: expr
    system: research
    description: answer while questions wait and the day's AI money is not spent
    in:
      waiting: goal.questions-answered.off
      over: goal.ai-budget.off
      held: goal.ai-not-held.off
    expr: waiting * (1 - over) * (1 - held)
    out: block.researcher
  researcher:
    type: ai
    system: research
    agent: opus
    description: a session per question in a read-only clone of main - the code, the docs, the record and the web where allowed; a report with sources, each checked (a file and line at the clone's sha, a URL its session opened)
    run: python3 dev/bin/research.py
    prompt: dev/prompts/researcher.md
    takes: {kind: research, at: asked, to: [answered]}
    pool: 1
    lease: {ttl: 60m, attempts: 2}   # (an unsourced answer is a counted attempt: the second is the dead letter)
    timeout: 2h
    actions: [knowledge-change]      # a checked answer's finding, asked once
    in: block.research-when
    out: [flow.research-answered, flow.research-unsourced]

  librarian:
    type: program
    system: knowledge
    description: after each review, its findings against the review lessons (one small AI step on haiku) - new shapes and classes found twice proposed; off until [knowledge] librarian = true
    run: python3 dev/bin/librarian.py
    on: {event: review.written, emits: [review.measured, lesson.seen, lesson.measured, lesson.proposed, session.started,
                                       session.ended, session.errored]}
    actions: [knowledge-change]
    timeout: 15m
    out: flow.lessons-found
  knowledge-sync:
    type: program
    system: knowledge
    description: the collector - each entry of the running version's dev/knowledge/, with the record's applied lessons, an item (knowledge.found, .changed, .retired), with how many briefs carried it; each decision of decisions.md whose ergostat.decision is in no state proposed; a file or record it cannot read stops it with nothing recorded
    run: python3 dev/bin/knowledge.py sync
    every: 10m
    timeout: 2m
  lesson-settle:
    type: program
    system: knowledge
    description: each proposed lesson whose knowledge-change the coordinator denied, settled denied with who and why (lesson.py settle); a denial by the gate is no decision, and a record it cannot read stops it with nothing written. Then the migration, idempotent - a lesson requested as a gap/knowledge-* not merged applied, and that gap closed
    run: python3 dev/bin/lesson.py settle
    every: 10m
    timeout: 2m
    out: flow.lessons-denied
  lesson-apply:
    type: program
    system: knowledge
    description: the knowledge queue's worker, no AI - an approved lesson's exact text applied to the record (a new entry, numbered next, or a "seen as" line), or a lesson retired; no session, branch, review or merge
    run: python3 dev/bin/lesson.py apply
    takes: {kind: lesson, at: approved, to: [applied, retired]}
    pool: 1
    lease: {ttl: 5m, attempts: 3}
    timeout: 2m
    goal: lessons-applied
    out: [flow.lessons-added, flow.lessons-retired]
  approve-lesson:
    type: external
    system: knowledge
    agent: coordinator
    description: the coordinator approves or denies a proposed lesson - the gated action knowledge-change, asked in the inbox
    in: goal.lessons-decided
    out: flow.lessons-approved
