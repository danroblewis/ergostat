# The AI pools, ramped up on good results (the owner, 2026-11-20): one implementor and one reviewer to start. Each pool
# is a setting with memory (a stock), stepped by the pool tuner: after three good gaps in a row (approved within one
# fix round, not reverted after merging) it asks the coordinator to raise one by one (the gated action raise-pool);
# a park, a second fix round or a reverted merge lowers them by one at once. The implementor and reviewer blocks take
# their pools from these stocks (pool: {now: stock.implementor-pool, most: 9}): the engine reads each at every dispatch
# and holds the block to the pool now, never above its most; a lowered pool drains (nothing running is stopped). The
# gates (implement-when, review-when) and each run (dev/bin/pools.py) also hold them to the machine's headroom.
defaults:
  system: pools

stocks:
  implementor-pool:
    unit: sessions
    description: how many implementor sessions may run at once now (1 to start; at most the block's pool, 9)
    sensor: {run: python3 dev/bin/pools.py read implementor, every: 1m, timeout: 30s, description: the pools file}
  reviewer-pool:
    unit: sessions
    description: how many reviewer sessions may run at once now (1 to start; at most the block's pool, 6)
    sensor: {run: python3 dev/bin/pools.py read reviewer, every: 1m, timeout: 30s, description: the pools file}
  queue-batch:
    unit: gaps
    description: approved gaps the merge queue merges and tests together (1 to start; at most [pools] batch_max, 8)
    sensor: {run: python3 dev/bin/pools.py read batch, every: 1m, timeout: 30s, description: the pools file}

auxiliaries:
  good-streak:
    unit: gaps
    description: gaps approved within one fix round, and not reverted, in a row since the pools last changed
    driven-by: [+flow.gaps-approved, -flow.sent-back-by-review, -flow.parked-in-review]
    sensor: {run: python3 dev/bin/pools.py streak, every: 5m, timeout: 1m, description: the pools' evidence}

flows:
  implementor-pool-steps:
    to: implementor-pool
    two-way: true
    description: the implementor pool raised by one (the coordinator approved) or lowered by one (a bad result)
  reviewer-pool-steps:
    to: reviewer-pool
    two-way: true
    description: the reviewer pool raised by one (the coordinator approved) or lowered by one (a bad result)
  queue-batch-steps:
    to: queue-batch
    two-way: true
    description: the queue's batch raised by one while the queue wait is over its goal (the coordinator approved), or set by hand

goals:
  pools-earned:
    auxiliary: good-streak
    hold: "<= 2"
    tolerance: 0
    description: a pool is raised once three gaps in a row came out well (the streak starts again at each change)

actions:
  raise-pool:
    run: python3 dev/bin/pools.py set {role} {to} {why}
    in: .
    gate: approve
    class: pool
    args: {role: implementor or reviewer (or batch - the queue's), to: the pool asked for, why: the evidence}
    description: Raise an AI pool by one on a streak of good gaps, or the queue's batch while the queue wait is off - the coordinator approves

blocks:
  pool-tuner:
    type: program
    description: raises a pool (asked of the coordinator) after a streak of good gaps; lowers them at once on a park, a second fix round or a reverted merge
    run: python3 dev/bin/pools.py tune
    every: 7d                          # paused by the operator (2026-11-20): it lowered the owner's pools on parks caused by main; pool-control replaces it
    timeout: 2m
    actions: [raise-pool]
    in: [goal.pools-earned.error, goal.queue-wait-short.error, +auxiliary.first-pass-yield, -auxiliary.fix-rounds]
    out: [flow.implementor-pool-steps, flow.reviewer-pool-steps, flow.queue-batch-steps]
