# Flakes open and the hours to repair (dev/records/regression-flake-measures.md): flakes-open counts the flakes seen
# and not fixed, and flakes-few holds each of them by its hours in seen, so off names the oldest (`per: item`; check
# refuses `per: item` on a count, goal-per, so the age is a stock of its own, flakes-open-hours, over the same items).
# main-repair-hours and flake-fix-hours are dev/bin/flakes.py's readings, from the flakes' moves in the record's order:
# the median, over the stays ended fixed in the last 14 days, from the move into main-broken (or seen) to the move to
# fixed; a repeat break keeps the clock, a flake made again from fixed starts a new stay, and with no stay ended there
# is no value. Nothing here acts: the goals are unserved until regression-guarantees-wired.
defaults:
  system: guarantees

stocks:
  flakes-open:
    unit: tests
    description: flakes seen and not fixed (seen), each a test that failed in a suite and passed alone
    sensor: {items: flake, state: seen, every: 1m}
  flakes-open-hours:
    unit: hours
    description: hours the oldest seen flake has been seen; flakes-few holds each seen flake by its own
    sensor: {items: flake, state: seen, measure: oldest, every: 1m}

flows:
  flakes-seen:
    to: flakes-open
    description: flakes seen (flake.seen), each a test made seen, first or again after a fix
    sensor: {items: flake, entering: seen, over: 1d}
  flakes-fixed:
    from: flakes-open
    description: flakes leaving seen, each fixed (by green runs or by hand) or found failing on main too (main-broken)
    driven-by: [+stock.flakes-open]
    sensor: {items: flake, leaving: seen, over: 1d}   # every move out of seen, so the two flows add up to flakes-open

auxiliaries:
  main-repair-hours:
    unit: hours
    description: median hours main stayed broken by a test, from its first break of a stay to its fix (14 days)
    driven-by: [+stock.main-failing-tests]
    sensor: {run: python3 dev/bin/flakes.py main-repair-hours, every: 1h, timeout: 5m, description: the flakes' moves}
  flake-fix-hours:
    unit: hours
    description: median hours a flake stayed seen until fixed (14 days)
    driven-by: [+stock.flakes-open-hours]
    sensor: {run: python3 dev/bin/flakes.py flake-fix-hours, every: 1h, timeout: 5m, description: the flakes' moves}

parameters:
  flake-hours-most:
    value: 3
    description: the most hours a flake stays seen before flakes-few names it (the definition's 3, read in hours, the unit per item holds; the owner's to set)
  main-repair-hours-most:
    value: 24
    description: the most hours main stays broken a break, the median over 14 days, before main-repaired-fast is off

goals:
  flakes-few:
    stock: flakes-open-hours
    hold: "<= 3"                      # flake-hours-most
    per: item                         # off names the oldest seen flakes, oldest first
    on-stale: "off"
    description: no flake stays seen past flake-hours-most; off names the oldest
  main-repaired-fast:
    auxiliary: main-repair-hours
    hold: "<= 24"                     # main-repair-hours-most
    on-stale: "off"                   # no reading (none ended, or unreadable) is counted as off
    description: main is repaired within 24 hours a break, the median over 14 days
