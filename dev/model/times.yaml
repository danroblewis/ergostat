# Time in each state, the build-review loop and the gates, per gap, whatever its end (dev/README.md, *Time in each
# state*): the timer writes them on each gap (time_in, loop_rounds, loop_hours, gates), and each state and gate has a
# measure, its median and its p90 over the gaps that left it in the last 14 days (dev/bin/measure.py, times.py). The
# goals are setpoints the owner sets (hold:), each read by the pipeline watch (dev/bin/watch.py): a goal off past its
# tolerance is a trigger of the pipeline manager's next session; one with no gap in its window is None on the situation
# and raises nothing, and one that cannot be read is None and a trigger naming the error. The holds are first guesses:
# `python3 dev/bin/times.py setpoints`, run in the instance's folder, sets each to today's reading. Waiting states
# (open, replan, planned, split, ready, fix, built, approved, queue-failed, dead) are the cheapest time to remove;
# working ones are leased, building, in-review, queued.
# Plain measures, with no goal (state-times-in-the-loop, 2026-11-22): every -p90 (its median's goal drives the same
# action, and the watch's stuck trigger already takes each gap past its threshold; each p90 moves with its median);
# in-open-hours (a gap waits open by the backlog's ranking, not a fault of the pipeline); in-split-hours (its time is
# its sub-gaps', each held by its own goals); in-dead-hours (the watch raises each dead letter past half an hour
# already); in-fix-hours, in-built-hours, in-building-hours and in-in-review-hours (loop-short holds the build-review
# loop they add up to, and the manager's act on it is the same; each says which state the time is in);
# in-approved-hours (merge-pipeline-flowing already raises approved gaps waiting with no merge, and queued-short holds
# the queue after); loop-rounds (few-fix-rounds holds it, measures.yaml);
# gate-implementor-minutes and gate-review-minutes (loop-short holds the same runs);
# gate-fast-minutes, gate-unit-minutes, gate-browser-minutes and gate-demo-minutes (loop-short and queued-short
# hold the time they are part of, and suites-in-time the suites); gate-push-wait-minutes (a pending push is a broken
# merge pipeline to the watch already, and the push is the coordinator's).
# setpoints: first guesses, never derived from the record (times.py setpoints rewrites this line when it runs)
defaults:
  system: times

# Three subsystems (model-split-oversized-systems): the time in each state, the build-review loop and the gates it
# runs, and the queue's gates; the timer that writes them all stays in times.
systems:
  state-times:
    within: times
    description: how long each gap waits or works in each state, its median and p90, held by the short-state goals
    show: [auxiliary.in-ready-hours, auxiliary.in-queued-hours, auxiliary.in-leased-hours]
  loop-times:
    within: times
    description: the build-review loop's span and rounds, and the implementor's, fast suites' and reviewer's minutes it is made of, held by loop-short
    show: [auxiliary.loop-hours, auxiliary.loop-rounds]
  gate-times:
    within: times
    description: the merge queue's gates - its unit and browser suites, its demo check and the wait for the push - set by their own tests, never by the model
    show: [auxiliary.gate-unit-minutes, auxiliary.gate-browser-minutes]

auxiliaries:
  in-open-hours: {system: state-times, unit: hours, description: median hours a gap waited open for its definition (summed over its visits), driven-by: [+stock.gaps-open], sensor: {run: python3 dev/bin/measure.py in-open-hours, every: 30m, timeout: 1m, description: the gaps' time open}}
  in-open-hours-p90: {system: state-times, unit: hours, description: p90 hours a gap waited open, driven-by: [+auxiliary.in-open-hours], sensor: {run: python3 dev/bin/measure.py in-open-hours-p90, every: 30m, timeout: 1m, description: the gaps' time open}}
  in-ready-hours: {system: state-times, unit: hours, description: median hours a gap waited ready for the implementor, driven-by: [+stock.gaps-ready, -flow.situations-handled], sensor: {run: python3 dev/bin/measure.py in-ready-hours, every: 30m, timeout: 1m, description: the gaps' time ready}}
  in-ready-hours-p90: {system: state-times, unit: hours, description: p90 hours a gap waited ready, driven-by: [+auxiliary.in-ready-hours], sensor: {run: python3 dev/bin/measure.py in-ready-hours-p90, every: 30m, timeout: 1m, description: the gaps' time ready}}
  in-fix-hours: {system: state-times, unit: hours, description: median hours a gap waited at fix for the implementor, driven-by: [+stock.gaps-fix], sensor: {run: python3 dev/bin/measure.py in-fix-hours, every: 30m, timeout: 1m, description: the gaps' time at fix}}
  in-fix-hours-p90: {system: state-times, unit: hours, description: p90 hours a gap waited at fix, driven-by: [+auxiliary.in-fix-hours], sensor: {run: python3 dev/bin/measure.py in-fix-hours-p90, every: 30m, timeout: 1m, description: the gaps' time at fix}}
  in-built-hours: {system: state-times, unit: hours, description: median hours a gap waited built for the reviewer, driven-by: [+stock.gaps-built], sensor: {run: python3 dev/bin/measure.py in-built-hours, every: 30m, timeout: 1m, description: the gaps' time built}}
  in-built-hours-p90: {system: state-times, unit: hours, description: p90 hours a gap waited built, driven-by: [+auxiliary.in-built-hours], sensor: {run: python3 dev/bin/measure.py in-built-hours-p90, every: 30m, timeout: 1m, description: the gaps' time built}}
  in-approved-hours: {system: state-times, unit: hours, description: median hours a gap waited approved for the queue, driven-by: [+stock.gaps-approved], sensor: {run: python3 dev/bin/measure.py in-approved-hours, every: 30m, timeout: 1m, description: the gaps' time approved}}
  in-approved-hours-p90: {system: state-times, unit: hours, description: p90 hours a gap waited approved, driven-by: [+auxiliary.in-approved-hours], sensor: {run: python3 dev/bin/measure.py in-approved-hours-p90, every: 30m, timeout: 1m, description: the gaps' time approved}}
  in-queued-hours: {system: state-times, unit: hours, description: median hours a gap spent queued (the lock and a quiet machine and the merge and the suites), driven-by: [+stock.gaps-queued, +auxiliary.suites-running, -flow.situations-handled], sensor: {run: python3 dev/bin/measure.py in-queued-hours, every: 30m, timeout: 1m, description: the gaps' time queued}}
  in-queued-hours-p90: {system: state-times, unit: hours, description: p90 hours a gap spent queued, driven-by: [+auxiliary.in-queued-hours], sensor: {run: python3 dev/bin/measure.py in-queued-hours-p90, every: 30m, timeout: 1m, description: the gaps' time queued}}
  in-replan-hours: {system: state-times, unit: hours, description: median hours a gap spent sent back to the planner, driven-by: [+stock.gaps-replan, -flow.situations-handled], sensor: {run: python3 dev/bin/measure.py in-replan-hours, every: 30m, timeout: 1m, description: the gaps' time at replan}}
  in-replan-hours-p90: {system: state-times, unit: hours, description: p90 hours a gap spent at replan, driven-by: [+auxiliary.in-replan-hours], sensor: {run: python3 dev/bin/measure.py in-replan-hours-p90, every: 30m, timeout: 1m, description: the gaps' time at replan}}
  in-planned-hours: {system: state-times, unit: hours, description: median hours a gap spent planned (its plan in review), driven-by: [+stock.gaps-planned, -flow.situations-handled], sensor: {run: python3 dev/bin/measure.py in-planned-hours, every: 30m, timeout: 1m, description: the gaps' time planned}}
  in-planned-hours-p90: {system: state-times, unit: hours, description: p90 hours a gap spent planned, driven-by: [+auxiliary.in-planned-hours], sensor: {run: python3 dev/bin/measure.py in-planned-hours-p90, every: 30m, timeout: 1m, description: the gaps' time planned}}
  in-split-hours: {system: state-times, unit: hours, description: median hours a split gap spent until its sub-gaps were merged, driven-by: [+stock.gaps-split], sensor: {run: python3 dev/bin/measure.py in-split-hours, every: 30m, timeout: 1m, description: the gaps' time split}}
  in-split-hours-p90: {system: state-times, unit: hours, description: p90 hours a gap spent split, driven-by: [+auxiliary.in-split-hours], sensor: {run: python3 dev/bin/measure.py in-split-hours-p90, every: 30m, timeout: 1m, description: the gaps' time split}}
  in-leased-hours: {system: state-times, unit: hours, description: median hours a gap spent leased (taken by a run before it said it started), driven-by: [+auxiliary.suites-running, -flow.situations-handled], sensor: {run: python3 dev/bin/measure.py in-leased-hours, every: 30m, timeout: 1m, description: the gaps' time leased}}
  in-leased-hours-p90: {system: state-times, unit: hours, description: p90 hours a gap spent leased, driven-by: [+auxiliary.in-leased-hours], sensor: {run: python3 dev/bin/measure.py in-leased-hours-p90, every: 30m, timeout: 1m, description: the gaps' time leased}}
  in-building-hours: {system: state-times, unit: hours, description: median hours a gap spent building (summed over its rounds), driven-by: [+stock.gaps-building], sensor: {run: python3 dev/bin/measure.py in-building-hours, every: 30m, timeout: 1m, description: the gaps' time building}}
  in-building-hours-p90: {system: state-times, unit: hours, description: p90 hours a gap spent building, driven-by: [+auxiliary.in-building-hours], sensor: {run: python3 dev/bin/measure.py in-building-hours-p90, every: 30m, timeout: 1m, description: the gaps' time building}}
  in-in-review-hours: {system: state-times, unit: hours, description: median hours a gap spent in review (summed over its reviews), driven-by: [+stock.gaps-in-review], sensor: {run: python3 dev/bin/measure.py in-in-review-hours, every: 30m, timeout: 1m, description: the gaps' time in review}}
  in-in-review-hours-p90: {system: state-times, unit: hours, description: p90 hours a gap spent in review, driven-by: [+auxiliary.in-in-review-hours], sensor: {run: python3 dev/bin/measure.py in-in-review-hours-p90, every: 30m, timeout: 1m, description: the gaps' time in review}}
  in-queue-failed-hours: {system: state-times, unit: hours, description: median hours a gap spent queue-failed (waiting for triage), driven-by: [+stock.gaps-queue-failed, -flow.situations-handled], sensor: {run: python3 dev/bin/measure.py in-queue-failed-hours, every: 30m, timeout: 1m, description: the gaps' time queue-failed}}
  in-queue-failed-hours-p90: {system: state-times, unit: hours, description: p90 hours a gap spent queue-failed, driven-by: [+auxiliary.in-queue-failed-hours], sensor: {run: python3 dev/bin/measure.py in-queue-failed-hours-p90, every: 30m, timeout: 1m, description: the gaps' time queue-failed}}
  in-dead-hours: {system: state-times, unit: hours, description: median hours a gap spent a dead letter before it was parked, driven-by: [+stock.gaps-dead], sensor: {run: python3 dev/bin/measure.py in-dead-hours, every: 30m, timeout: 1m, description: the gaps' time dead}}
  in-dead-hours-p90: {system: state-times, unit: hours, description: p90 hours a gap spent a dead letter, driven-by: [+auxiliary.in-dead-hours], sensor: {run: python3 dev/bin/measure.py in-dead-hours-p90, every: 30m, timeout: 1m, description: the gaps' time dead}}
  loop-hours: {system: loop-times, unit: hours, description: median span of the build-review loop (first taken to build to approved or parked or dead), driven-by: [+auxiliary.loop-rounds, +auxiliary.in-fix-hours, +auxiliary.in-building-hours, +auxiliary.in-built-hours, +auxiliary.in-in-review-hours, -flow.situations-handled], sensor: {run: python3 dev/bin/measure.py loop-hours, every: 30m, timeout: 1m, description: the build-review loop's span}}
  loop-hours-p90: {system: loop-times, unit: hours, description: p90 span of the build-review loop, driven-by: [+auxiliary.loop-hours], sensor: {run: python3 dev/bin/measure.py loop-hours-p90, every: 30m, timeout: 1m, description: the build-review loop's span}}
  loop-rounds: {system: loop-times, unit: rounds, description: median rounds of the build-review loop (its builds), driven-by: [-auxiliary.first-pass-yield], sensor: {run: python3 dev/bin/measure.py loop-rounds, every: 30m, timeout: 1m, description: the build-review loop's rounds}}
  loop-rounds-p90: {system: loop-times, unit: rounds, description: p90 rounds of the build-review loop, driven-by: [+auxiliary.loop-rounds], sensor: {run: python3 dev/bin/measure.py loop-rounds-p90, every: 30m, timeout: 1m, description: the build-review loop's rounds}}
  gate-implementor-minutes: {system: loop-times, unit: minutes, description: median minutes of the implementor's runs per gap (every round), driven-by: [+auxiliary.loop-rounds], sensor: {run: python3 dev/bin/measure.py gate-implementor-minutes, every: 30m, timeout: 1m, description: the implementor gate's minutes}}
  gate-implementor-minutes-p90: {system: loop-times, unit: minutes, description: p90 minutes of the implementor's runs per gap, driven-by: [+auxiliary.gate-implementor-minutes], sensor: {run: python3 dev/bin/measure.py gate-implementor-minutes-p90, every: 30m, timeout: 1m, description: the implementor gate's minutes}}
  gate-fast-minutes: {system: loop-times, unit: minutes, description: median minutes of the implementor's fast suites (ruff and unit) per gap, driven-by: [+auxiliary.loop-rounds], sensor: {run: python3 dev/bin/measure.py gate-fast-minutes, every: 30m, timeout: 1m, description: the fast suites' minutes}}
  gate-fast-minutes-p90: {system: loop-times, unit: minutes, description: p90 minutes of the fast suites per gap, driven-by: [+auxiliary.gate-fast-minutes], sensor: {run: python3 dev/bin/measure.py gate-fast-minutes-p90, every: 30m, timeout: 1m, description: the fast suites' minutes}}
  gate-review-minutes: {system: loop-times, unit: minutes, description: median minutes of the reviews per gap, driven-by: [+auxiliary.loop-rounds], sensor: {run: python3 dev/bin/measure.py gate-review-minutes, every: 30m, timeout: 1m, description: the review gate's minutes}}
  gate-review-minutes-p90: {system: loop-times, unit: minutes, description: p90 minutes of the reviews per gap, driven-by: [+auxiliary.gate-review-minutes], sensor: {run: python3 dev/bin/measure.py gate-review-minutes-p90, every: 30m, timeout: 1m, description: the review gate's minutes}}
  gate-unit-minutes: {system: gate-times, unit: minutes, exogenous: true, description: median minutes of the queue's unit suite per gap (its length is its tests' and no part of the model sets it), sensor: {run: python3 dev/bin/measure.py gate-unit-minutes, every: 30m, timeout: 1m, description: the queue's unit suite minutes}}
  gate-unit-minutes-p90: {system: gate-times, unit: minutes, description: p90 minutes of the queue's unit suite per gap, driven-by: [+auxiliary.gate-unit-minutes], sensor: {run: python3 dev/bin/measure.py gate-unit-minutes-p90, every: 30m, timeout: 1m, description: the queue's unit suite minutes}}
  gate-browser-minutes: {system: gate-times, unit: minutes, exogenous: true, description: median minutes of the queue's browser suite per gap (its length is its tests' and no part of the model sets it), sensor: {run: python3 dev/bin/measure.py gate-browser-minutes, every: 30m, timeout: 1m, description: the queue's browser suite minutes}}
  gate-browser-minutes-p90: {system: gate-times, unit: minutes, description: p90 minutes of the queue's browser suite per gap, driven-by: [+auxiliary.gate-browser-minutes], sensor: {run: python3 dev/bin/measure.py gate-browser-minutes-p90, every: 30m, timeout: 1m, description: the queue's browser suite minutes}}
  gate-demo-minutes: {system: gate-times, unit: minutes, exogenous: true, description: median minutes of the queue's demo check per gap (its length is its examples' and no part of the model sets it), sensor: {run: python3 dev/bin/measure.py gate-demo-minutes, every: 30m, timeout: 1m, description: the queue's demo check minutes}}
  gate-demo-minutes-p90: {system: gate-times, unit: minutes, description: p90 minutes of the queue's demo check per gap, driven-by: [+auxiliary.gate-demo-minutes], sensor: {run: python3 dev/bin/measure.py gate-demo-minutes-p90, every: 30m, timeout: 1m, description: the queue's demo check minutes}}
  gate-push-wait-minutes: {system: gate-times, unit: minutes, exogenous: true, description: median minutes from a merge to its push (the coordinator's approval of the push), sensor: {run: python3 dev/bin/measure.py gate-push-wait-minutes, every: 30m, timeout: 1m, description: the push wait's minutes}}
  gate-push-wait-minutes-p90: {system: gate-times, unit: minutes, description: p90 minutes from a merge to its push, driven-by: [+auxiliary.gate-push-wait-minutes], sensor: {run: python3 dev/bin/measure.py gate-push-wait-minutes-p90, every: 30m, timeout: 1m, description: the push wait's minutes}}

goals:                              # (system: last: the pipeline watch and times.py read each line from its start)
  ready-short: {auxiliary: in-ready-hours, hold: "<= 2", tolerance: 0.5, description: a ready gap is taken within two hours (median), system: state-times}
  queued-short: {auxiliary: in-queued-hours, hold: "<= 0.5", tolerance: 0.1, description: a queue run within half an hour (median), system: state-times}
  replan-short: {auxiliary: in-replan-hours, hold: "<= 4", tolerance: 1, description: a plan sent back is replanned within four hours (median), system: state-times}
  planned-short: {auxiliary: in-planned-hours, hold: "<= 2", tolerance: 0.5, description: a plan is reviewed within two hours (median), system: state-times}
  leased-short: {auxiliary: in-leased-hours, hold: "<= 0.25", tolerance: 0.1, description: a run says it started within a quarter hour (median), system: state-times}
  queue-failed-short: {auxiliary: in-queue-failed-hours, hold: "<= 0.5", tolerance: 0.1, description: a queue failure is triaged within half an hour (median), system: state-times}
  loop-short: {auxiliary: loop-hours, hold: "<= 4", tolerance: 1, description: the build-review loop within four hours (median), system: loop-times}

blocks:
  timer:
    type: program
    description: writes on each gap whose record grew its time in each state, its build-review loop and its gates (gap.timed)
    run: python3 dev/bin/times.py
    every: 10m
    timeout: 5m
