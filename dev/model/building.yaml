# Building: a gap found or requested, defined, built by the implementor in its own worktree, and judged by the
# reviewer. One chain: open -> ready -> building -> built -> in-review -> approved (landing.yaml), with the rework
# loop back through fix, and the kill rule's exit to parked.
defaults:
  system: building

# intake's two subsystems (model-split-oversized-systems); their parts are here and in backlog.yaml, code-health.yaml
# and knowledge.yaml
systems:
  open-gaps:
    within: intake
    description: the gaps found in GAPS.md or asked for, their dependencies sound, groomed, then defined, planned or split off
    show: [stock.gaps-open, auxiliary.dependency-problems]
  split-and-join:
    within: intake
    description: a split gap waiting for its sub-gaps to merge, then joined and judged covered, short or parked
    show: [stock.gaps-split, stock.gaps-joined]
  joins:                            # the join judge's half hour, apart from a split's days (time-scales); split-watch
    within: split-and-join          # and join-judge are intake's own, as no goal is in split-and-join (purpose)
    description: a joined gap waiting for the join judge - covered (merged), short (split again) or parked
    show: [stock.gaps-joined]

stocks:
  gaps-open:
    system: open-gaps
    unit: gaps
    description: gaps found in GAPS.md or requested, with no definition of done yet (the backlog the coordinator defines from)
    sensor: {items: gap, state: open, every: 1m}
  gaps-ready:
    unit: gaps
    description: gaps with a definition of done, waiting for the implementor
    sensor: {items: gap, state: ready, every: 1m}
  gaps-fix:
    unit: gaps
    description: gaps sent back with findings (a fix verdict, a conflict, a real failure in the queue), waiting for the implementor (or for main to move, when their fast suites failed only on tests that fail on main too)
    sensor: {items: gap, state: fix, every: 1m}
  gaps-building:
    unit: gaps
    description: gaps the implementor is building in their worktrees (its session, then the fast suites)
    sensor: {items: gap, state: building, every: 1m}
  gaps-built:
    unit: gaps
    description: gaps built with their fast suites green, waiting for the reviewer
    sensor: {items: gap, state: built, every: 1m}
  gaps-in-review:
    unit: gaps
    description: gaps the reviewer is judging
    sensor: {items: gap, state: in-review, every: 1m}

  gaps-dead:
    unit: gaps
    description: gaps whose runs failed past their attempts in a way their block did not catch (killed, lost)
    sensor: {items: gap, state: dead, every: 1m}

auxiliaries:
  dependency-problems:
    system: open-gaps
    unit: gaps
    description: gaps naming a dependency that is no gap, or one refused because it would close a cycle
    driven-by: [+flow.gaps-found, +flow.gaps-requested]
    sensor: {items: gap, where: {dependency_problem: true}, every: 1m}
  intake-open:
    unit: switch
    exogenous: true
    description: 1 while the coordinator lets the implementor take gaps, 0 (or never read) while the intake is paused
    sensor: {manual: true}
  stale-stacks:
    unit: gaps
    description: stacked gaps (approved or built) whose base was approved again at a new reviewed head, or landed, and is not yet merged forward into them (a stacked_on that cannot be read counts)
    driven-by: [+stock.gaps-approved, -flow.sent-back-by-stack-forward]
    sensor: {run: python3 dev/bin/stack.py stale, every: 5m, timeout: 2m, description: the stacked gaps' record}
  gaps-stacked:
    unit: gaps
    description: gaps built stacked on approved dependencies not yet on main (stacked_on, or one that cannot be read), in any state until merged or closed; a view across the chain, its gaps counted in their own states' stocks too (so an auxiliary, not a stock with flows of its own)
    driven-by: [+stock.gaps-approved]
    sensor: {run: python3 dev/bin/deps.py stacked, every: 5m, timeout: 2m, description: the stacked gaps' record}

flows:
  gaps-found:
    system: open-gaps
    to: gaps-open
    description: entries of docs/GAPS.md taken in by the intake
    sensor: {items: gap, entering: open, where: {source: gaps}, over: 1d}
  gaps-requested:
    system: open-gaps
    to: gaps-open
    description: gaps asked for as events (gap.requested, with source request), the factory's own improvements among them
    sensor: {items: gap, entering: open, where: {source: request}, over: 1d}
  gaps-defined:
    system: open-gaps
    from: gaps-open
    to: gaps-ready
    description: a definition of done found for an open gap (the coordinator writes it; a planned one is plans-approved)
    driven-by: [+stock.gaps-open]
    equation: stock.gaps-open / define-time
    sensor: {items: gap, entering: ready, where: {defined_by: coordinator}, over: 1d}
  gaps-started:
    from: gaps-ready
    to: gaps-building
    description: a ready gap taken by the implementor, its definition committed first
    driven-by: [+stock.gaps-ready]
    equation: stock.gaps-ready / take-time
    sensor: {items: gap, entering: building, where: {rework: false}, over: 1d}
  fixes-started:
    from: gaps-fix
    to: gaps-building
    description: a gap sent back, taken again by the implementor with its findings
    driven-by: [+stock.gaps-fix]
    equation: stock.gaps-fix / take-time
    sensor: {items: gap, entering: building, where: {rework: true}, over: 1d}
  gaps-built:
    from: gaps-building
    to: gaps-built
    description: built, committed, and its fast suites green
    driven-by: [+stock.gaps-building]
    equation: stock.gaps-building / build-time
    sensor: {items: gap, entering: built, over: 1d}
  reviews-started:
    from: gaps-built
    to: gaps-in-review
    description: a built gap taken by the reviewer
    driven-by: [+stock.gaps-built]
    equation: stock.gaps-built / take-time
    sensor: {items: gap, entering: in-review, over: 1d}
  sent-back-by-review:
    from: gaps-in-review
    to: gaps-fix
    description: a fix verdict - back to the implementor with the blocking findings (the rework loop)
    driven-by: [+stock.gaps-in-review]
    equation: fix-share * stock.gaps-in-review / review-time
    sensor: {items: gap, entering: fix, where: {sent_back_by: review}, over: 1d}
  parked-in-review:
    from: gaps-in-review
    description: a park verdict, or the last failed gate ([gates] kill_after, the kill rule) - where it stopped written into its definition
    driven-by: [+stock.gaps-in-review]
    equation: park-share * stock.gaps-in-review / review-time
    sensor: {items: gap, entering: parked, where: {parked_in: review}, over: 1d}

  sent-back-by-stack-forward:
    from: gaps-approved
    to: gaps-fix
    description: a moved base's new head does not merge forward into a gap stacked on it - aborted, back to the implementor with the files (not a failed gate)
    driven-by: [+auxiliary.stale-stacks]
    equation: auxiliary.stale-stacks / take-time
    sensor: {items: gap, entering: fix, where: {sent_back_by: stack-forward}, over: 1d}

  dead-letters-parked:
    from: gaps-dead
    description: dead letters parked with where they stopped, so none is left stuck
    driven-by: [+stock.gaps-dead]
    equation: stock.gaps-dead / take-time
    sensor: {items: gap, entering: parked, where: {parked_in: dead-letter}, over: 1d}

parameters:
  define-time:
    system: open-gaps
    value: 24h
    estimate: true
    description: how long a gap waits open before the coordinator writes its definition
  take-time:
    value: 10m
    estimate: true
    description: how soon a waiting gap is taken, while its step has room and its gate is open
  build-time:
    value: 2h
    estimate: true
    description: how long the implementor takes on a gap - its session and its fast suites
  review-time:
    value: 30m
    estimate: true
    description: how long a review takes
  fix-share:
    value: 0.4
    unit: "1"
    range: [0, 1]
    estimate: true
    description: the share of reviews that send the gap back
  park-share:
    value: 0.05
    unit: "1"
    range: [0, 1]
    estimate: true
    description: the share of reviews that park the gap

goals:
  dependencies-sound:
    system: open-gaps
    auxiliary: dependency-problems
    hold: "<= 0"
    tolerance: 0
    description: every dependency names a gap, and none goes round
  no-dead-letters:
    stock: gaps-dead
    hold: "<= 0"
    tolerance: 0
    description: no gap left a dead letter
  ready-gaps-taken:
    stock: gaps-ready
    hold: "<= 0"
    tolerance: 0
    description: every ready gap taken by the implementor (while the intake is open and money is left)
  fixes-taken:
    stock: gaps-fix
    hold: "<= 0"
    tolerance: 0
    description: every gap sent back taken again by the implementor
  built-gaps-reviewed:
    stock: gaps-built
    hold: "<= 0"
    tolerance: 0
    description: every built gap reviewed

blocks:
  intake:
    system: open-gaps
    type: program
    description: the collector - GAPS.md entries on main (gap.found) and definitions of done for open gaps (gap.defined); with [areas] route on, each waiting or unmerged gap's touches for the implementor's areas (dev/bin/areas.py)
    run: python3 dev/bin/intake.py
    every: 5m
    timeout: 2m
    out: [flow.gaps-found, flow.gaps-defined]

  implement-when:
    type: expr
    description: build while gaps wait (ready, or sent back), the intake is open, the day's AI money is not spent, and the implementor pool has room - the pool the risk target held to what the machine fits, min(pool, busy + room)
    in:
      ready: goal.ready-gaps-taken.off
      fixes: goal.fixes-taken.off
      open: auxiliary.intake-open
      over: goal.ai-budget.off
      busy: stock.gaps-building
      pool: stock.implementor-pool
      room: auxiliary.session-headroom
      full: block.machine-full         # (no session fits, a resource past its goal, or the headroom stale)
      held: goal.ai-not-held.off       # (the provider's usage limit, till its reset: dev/bin/aihold.py)
    expr: max(ready, fixes) * min(open, 1) * (1 - over) * (busy < min(pool, busy + room)) * (1 - full) * (1 - held)
    out: block.implementor
  implementor:
    type: ai
    agent: opus
    description: a headless Claude Code session per gap in its own worktree (~/ergostat-wt/<branch>) - the definition committed first, the work, the fast suites
    run: python3 dev/bin/implement.py
    prompt: dev/prompts/implementor.md
    takes:
      kind: gap
      at: [fix, ready]
      to: [built]
      unblocked: true
      order: rank
      where: {waits_on_parked: null, waits_on_main: null, waits_on_milestone: null}
      # (its dependencies finished, none of them parked; not waiting for main to move past tests failing on it; its
      # milestone active, or it pulled, once [milestones] enforce: dev/bin/milestones.py; by the backlog's rank, the
      # critical first among equals)
      areas:
        # The code areas (SPEC §9.5, Areas): a gap is not started while another gap holds a file of the map that it
        # touches (its touches field: its branch's files and the paths its definition names), from its start to its
        # landing. The owner's data: change an owner to {field: milestone} (a milestone's gaps together) or add paths
        # (patterns: ergostat/web/static/*). The first map was drawn from main's conflicted merges (python3
        # dev/bin/areas.py draw): each file named in 3 or more, whose gaps' hours in flight summed are at most twice
        # the history's (a lane carries them in series); the 26 hot files past that (docs/SPEC.md, pages.js, ...) are
        # left out. Inert until [areas] route = true (dev/factory.toml): until then every gap's touches is said [] (in
        # the gap.defined that makes it ready, and the intake's pass). A gap with no touches said touches every area.
        touches: touches
        holding: [building, built, in-review, approved, queued, push-pending, queue-failed, fix]
        map:
          dev-bin-measure-py: {paths: [dev/bin/measure.py]}   # 16 conflicted merges, landed by 17, load 1.34
          dev-bin-queue-py: {paths: [dev/bin/queue.py]}   # 14 conflicted merges, landed by 28, load 1.86
          dev-bin-agents-py: {paths: [dev/bin/agents.py]}   # 13 conflicted merges, landed by 18, load 1.0
          dev-bin-fac-py: {paths: [dev/bin/fac.py]}   # 11 conflicted merges, landed by 22, load 1.76
          tests-test-agents-page-py: {paths: [tests/test_agents_page.py]}   # 11 conflicted merges, landed by 11, load 1.44
          ergostat-library-uses-py: {paths: [ergostat/library/uses.py]}   # 8 conflicted merges, landed by 10, load 1.67
          tests-test-style-tokens-py: {paths: [tests/test_style_tokens.py]}   # 8 conflicted merges, landed by 11, load 1.7
          dev-bin-implement-py: {paths: [dev/bin/implement.py]}   # 7 conflicted merges, landed by 16, load 1.02
          dev-model-knowledge-yaml: {paths: [dev/model/knowledge.yaml]}   # 6 conflicted merges, landed by 14, load 0.79
          ergostat-leases-dispatch-py: {paths: [ergostat/leases/dispatch.py]}   # 6 conflicted merges, landed by 17, load 1.87
          tests-test-inbox-page-py: {paths: [tests/test_inbox_page.py]}   # 6 conflicted merges, landed by 6, load 1.08
          dev-bin-status-py: {paths: [dev/bin/status.py]}   # 5 conflicted merges, landed by 4, load 0.49
          ergostat-datasources-init-py: {paths: [ergostat/datasources/__init__.py]}   # 5 conflicted merges, landed by 8, load 0.37
          ergostat-numbers-measures-py: {paths: [ergostat/numbers/measures.py]}   # 5 conflicted merges, landed by 6, load 0.89
          ergostat-query-engine-py: {paths: [ergostat/query/engine.py]}   # 5 conflicted merges, landed by 9, load 0.43
          ergostat-web-static-index-html: {paths: [ergostat/web/static/index.html]}   # 5 conflicted merges, landed by 18, load 1.45
          ergostat-web-static-relations-js: {paths: [ergostat/web/static/relations.js]}   # 5 conflicted merges, landed by 10, load 0.94
          tests-test-dynamics-view-py: {paths: [tests/test_dynamics_view.py]}   # 5 conflicted merges, landed by 11, load 1.71
          tests-test-factory-knowledge-py: {paths: [tests/test_factory_knowledge.py]}   # 5 conflicted merges, landed by 25, load 1.5
          dev-model-landing-yaml: {paths: [dev/model/landing.yaml]}   # 4 conflicted merges, landed by 14, load 0.97
          ergostat-compute-worker-keeper-py: {paths: [ergostat/compute/worker/keeper.py]}   # 4 conflicted merges, landed by 7, load 0.6
          ergostat-library-templates-py: {paths: [ergostat/library/templates.py]}   # 4 conflicted merges, landed by 8, load 1.64
          ergostat-projects-py: {paths: [ergostat/projects.py]}   # 4 conflicted merges, landed by 4, load 0.34
          dev-bin-plan-py: {paths: [dev/bin/plan.py]}   # 3 conflicted merges, landed by 11, load 0.66
          dev-bin-pools-py: {paths: [dev/bin/pools.py]}   # 3 conflicted merges, landed by 4, load 0.77
          dev-bin-watch-py: {paths: [dev/bin/watch.py]}   # 3 conflicted merges, landed by 13, load 0.71
          ergostat-dynamics-py: {paths: [ergostat/dynamics.py]}   # 3 conflicted merges, landed by 11, load 1.4
          ergostat-goodmodel-py: {paths: [ergostat/goodmodel.py]}   # 3 conflicted merges, landed by 10, load 1.04
          ergostat-remote-compose-py: {paths: [ergostat/remote/compose.py]}   # 3 conflicted merges, landed by 5, load 0.63
          ergostat-spec-itemindex-py: {paths: [ergostat/spec/itemindex.py]}   # 3 conflicted merges, landed by 13, load 0.99
          ergostat-spec-watchdog-py: {paths: [ergostat/spec/watchdog.py]}   # 3 conflicted merges, landed by 7, load 0.34
          ergostat-web-eta-api-py: {paths: [ergostat/web/eta_api.py]}   # 3 conflicted merges, landed by 5, load 0.43
          ergostat-web-static-export-js: {paths: [ergostat/web/static/export.js]}   # 3 conflicted merges, landed by 4, load 0.73
          ergostat-web-static-split-js: {paths: [ergostat/web/static/split.js]}   # 3 conflicted merges, landed by 4, load 0.54
    # the engine reads implementor-pool (dev/model/pools.yaml) at each dispatch and takes no more than it, never
    # more than 9; implement-when also holds it to the machine's headroom
    pool: {now: stock.implementor-pool, most: 9}
    lease: {ttl: 90m, attempts: 2}
    timeout: 6h
    in: block.implement-when
    out: [flow.gaps-started, flow.fixes-started, flow.gaps-built]

  review-when:
    type: expr
    description: review while built gaps wait, the day's AI money is not spent, and the reviewer pool has room - the pool held to what the machine fits, min(pool, busy + room)
    in:
      waiting: goal.built-gaps-reviewed.off
      over: goal.ai-budget.off
      busy: stock.gaps-in-review
      pool: stock.reviewer-pool
      room: auxiliary.session-headroom
      full: block.machine-full
      held: goal.ai-not-held.off
    expr: waiting * (1 - over) * (busy < min(pool, busy + room)) * (1 - full) * (1 - held)
    out: block.reviewer
  reviewer:
    type: ai
    agent: opus
    description: a fresh, deliberately disagreeable session per built gap - never the implementor's reasoning; records a review, approves, sends back or parks
    run: python3 dev/bin/review.py
    prompt: dev/prompts/reviewer.md
    takes: {kind: gap, at: built, to: [approved, fix, parked]}
    # the engine reads reviewer-pool at each dispatch, never more than 6; review-when holds it to the headroom
    pool: {now: stock.reviewer-pool, most: 6}
    lease: {ttl: 60m, attempts: 2}
    timeout: 2h
    in: block.review-when
    out: [flow.reviews-started, flow.gaps-approved, flow.sent-back-by-review, flow.parked-in-review]

  dead-letters:
    type: program
    description: parks each dead letter with where it stopped (its lease's history)
    run: python3 dev/bin/dead.py
    goal: no-dead-letters
    timeout: 5m
    out: flow.dead-letters-parked

  stack-forward-when:
    type: expr
    description: merge forward while a stacked gap's base has moved or landed (stale-stacks above 0)
    in:
      stale: auxiliary.stale-stacks
    expr: stale > 0
    out: block.stack-forward
  stack-forward:
    type: program
    description: merges each moved base's new reviewed head forward into the gaps stacked on it, bottom-up (--no-ff, never a rebase or a squash; leased, building and in-review gaps never touched); a conflict sends the gap back to fix, uncounted
    run: python3 dev/bin/stack.py
    every: 5m
    in: block.stack-forward-when
    timeout: 30m
    out: flow.sent-back-by-stack-forward
