# The load interlock: the test suites running on this machine (anyone's), their threads and memory, and goals that
# hold the suite-running blocks (the merge queue, flake triage) while the machine is busy. Inside their runs, the
# implementor and triage hold a machine-wide suite slot around each suite ([suites] slot) and wait while the machine
# is full ([load] most_suites; dev/bin/fac.py, wait_quiet); the queue's lock is its slot, the last one kept for it while
# approved gaps wait (dev/bin/slots.py). The hard rule is
# scripts/suite_watch.py's: a suite past 1,500 threads or 6 GB is killed.
defaults:
  system: load

auxiliaries:
  suites-running:
    unit: suites
    description: test suites (python -m pytest) running on this machine now, the factory's and everyone else's
    driven-by: [+stock.gaps-queued, +stock.gaps-building, +stock.gaps-queue-failed]
    sensor: {run: python3 dev/bin/load.py suites, every: 15s, timeout: 20s, description: the load sensor - running suites}
  suite-threads:
    unit: threads
    description: the threads of the running suites' process trees
    driven-by: [+auxiliary.suites-running]
    sensor: {run: python3 dev/bin/load.py threads, every: 15s, timeout: 20s, description: the load sensor - threads}
  suite-memory:
    unit: GB
    description: the resident memory of the running suites' process trees
    driven-by: [+auxiliary.suites-running]
    sensor: {run: python3 dev/bin/load.py memory, every: 15s, timeout: 20s, description: the load sensor - memory}

goals:
  machine-quiet:
    auxiliary: suites-running
    hold: "<= 6"                       # operator 2026-11-20: six suite slots now
    tolerance: 0
    on-stale: "off"                    # not knowing the load holds the suites
    description: the machine's suite slots not all taken when the queue or triage starts one
  suite-threads-within:
    auxiliary: suite-threads
    hold: "<= 3000"                    # operator: 28 CPUs; the panic was at ~14k threads
    tolerance: 0
    on-stale: "off"
    description: the running suites' threads, together, well below the ~14k that panicked the machine
  suite-memory-within:
    auxiliary: suite-memory
    hold: "<= 40"                      # operator: GB; 256 GB machine, each suite container capped at 12 GB
    tolerance: 0
    on-stale: "off"
    description: the running suites' memory, together, in GB, with room on the machine
