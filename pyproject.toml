[project]
name = "ergostat"
version = "0.1.0"
description = "Keep your work going: design, watch and run the control system around it."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
ergostat = "ergostat.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3.6", "ruff>=0.6", "jsonschema>=4.20", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ergostat"]

[tool.hatch.build.targets.wheel.force-include]
"docs/SPEC.md" = "ergostat/help/spec.md"
"docs/MODELLING.md" = "ergostat/help/modelling.md"
"docs/MODEL-TOOLS.md" = "ergostat/help/model-tools.md"
"docs/CLAIMS.md" = "ergostat/help/claims.md"
"docs/DECISIONS.md" = "ergostat/help/decisions.md"
"docs/MESSAGES.md" = "ergostat/help/messages.md"
"docs/ADDING.md" = "ergostat/help/adding.md"
"docs/AGENT-GUIDE.md" = "ergostat/help/agent-guide.md"
"docs/MODELLING-WELL.md" = "ergostat/help/modelling-well.md"
"docs/skills/ergostat-author/SKILL.md" = "ergostat/skills/ergostat-author/SKILL.md"
"docs/skills/ergostat-author/daemons.md" = "ergostat/skills/ergostat-author/daemons.md"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
