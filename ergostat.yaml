# ergostat on ergostat: the factory that develops ergostat itself (dev/README.md). What the coordinator did by hand
# through the overnight runs (docs/roadmap/overnight-2026-11-19.md) as a model: each gap defined first, built by an AI
# implementor in its own worktree, judged by a disagreeable AI reviewer, landed one at a time by a merge queue behind
# the four suites, and the new main installed and switched to, with a revert.
#
# Boundary.
#   Endogenous: the gaps' chain (open to merged), the reviews, the flakes, the upgrades of the instance itself, the
#   interventions the coordinator records, and the loops that move them.
#   Exogenous: which gaps the owner lists (docs/GAPS.md) or asks for (gap.requested), their definitions of done
#   (written by the coordinator), what the suites say, the machine's load from everything else, the push to origin
#   (held for the coordinator), the AI sessions' cost.
#   Left out: the session transcripts (kept by Claude Code, never in git), the owner's own merges by hand.
#
# Shipped off: the implementor takes nothing until the coordinator opens the intake
# (`ergostat sensor intake-open.main --read 1`). The cap on what the AI sessions cost a day is the goal ai-budget,
# in dev/model/budget.yaml.
name: ergostat-factory
include:
  - dev/model/*.yaml

systems:
  factory:
    description: ergostat's own development - gaps in, merged and running changes out
  intake:
    within: factory
    description: the gaps found in GAPS.md or asked for, waiting for a definition of done - the slow outer loop
    show: [stock.gaps-open]
  building:
    within: factory
    description: gaps defined, built by the implementor in their worktrees, and judged by the reviewer
    show: [stock.gaps-ready, stock.gaps-building, stock.gaps-in-review]
  landing:
    within: factory
    description: the merge queue behind the four suites, flake triage, and the instance upgraded to what landed
    show: [stock.gaps-approved, stock.gaps-queued, stock.upgrades-installed]
  pools:
    within: factory
    description: the AI pools - one implementor and one reviewer to start, sized by measured risk against the owner's risk tolerance
    show: [stock.implementor-pool, stock.reviewer-pool, auxiliary.pool-risk-bound, auxiliary.pool-target]
  oversight:
    within: factory
    description: what the factory may spend, the machine's load, how well it works, and the coordinator's interventions
  spending:
    within: oversight
    description: the AI sessions' cost over the last day, held under the daily cap
    show: [auxiliary.ai-spend]
  ai-hold:
    within: oversight
    description: the provider's usage limit - the AI sessions held till its reset, the queue and the suites running on
    show: [auxiliary.ai-held]
  load:
    within: oversight
    description: the load interlock - the suites running on the machine, their threads and memory
    show: [auxiliary.suites-running, auxiliary.suite-threads, auxiliary.suite-memory]
  resources:
    within: oversight
    description: the machine's CPU, memory, disk and threads, the Docker VM's, and how many more sessions fit
    show: [auxiliary.cpu-utilisation, auxiliary.memory-utilisation, auxiliary.disk-free, auxiliary.session-headroom]
  measures:
    within: oversight
    description: how well the factory works - cycle time, first-pass yield, fix rounds, the queue, flakes, cost
    show: [auxiliary.first-pass-yield, auxiliary.cycle-hours, auxiliary.cost-per-merged]
  times:
    within: oversight
    description: how long each gap spends in each state, in the build-review loop and at each gate, held by goals
    show: [auxiliary.loop-hours, auxiliary.in-ready-hours, auxiliary.gate-unit-minutes]
  interventions:
    within: oversight
    description: the coordinator's interventions, each evidence of a loop the factory lacks
    show: [stock.interventions-open, auxiliary.interventions-trend]
  planning:
    within: factory
    description: each open gap planned (its definition of done, or a split) and the plan reviewed before it is built
    show: [stock.gaps-planned, stock.gaps-replan]
  research:
    within: factory
    description: questions from the coordinator or a planner, answered with a report and its sources
    show: [stock.research-asked]
  managing:
    within: oversight
    description: the pipeline manager - one AI session over the whole pipeline, on a schedule and at once when the merge pipeline breaks, acting through manage.py and recording each act as an intervention
    show: [stock.situations-raised, auxiliary.stuck-gaps, auxiliary.pipeline-broken-minutes]
  knowledge:
    within: factory
    description: what the briefs carry (dev/knowledge/) - lessons proposed from reviews, approved, added and retired
    show: [stock.knowledge-entries, stock.lessons-proposed, stock.lessons-to-apply, auxiliary.first-pass-with-lessons]

items:
  gap:
    id: gap/*
    description: one piece of ergostat's work - a GAPS.md entry or a request - from open to merged, or parked
    states: [open, replan, planned, split, joined, ready, fix, building, built, in-review, approved, queued, push-pending,
             queue-failed, merged, parked, closed]
    on:
      gap.found: open                # intake: an entry of docs/GAPS.md
      gap.requested: open            # submitted: ergostat event --add gap.requested --item gap/NAME (or a planner's split)
      gap.planned: planned           # planner: its definition of done written (run/plans/)
      gap.plan-sent-back: replan             # plan review: sent back to the planner with its findings
      gap.split: split               # planner: split into sub-gaps, each naming it as parent; joined once all merged
                                     # (or the join judge: short, a new sub-gap requested first)
      gap.defined: ready             # intake, or the plan review: its definition of done exists
      gap.started: building          # implementor
      gap.built: built
      gap.review-started: in-review  # reviewer
      gap.approved: approved
      gap.sent-back: fix             # reviewer (fix), queue (a conflict) or triage (a real failure): its findings
      gap.queued: queued             # merge queue
      gap.push-pending: push-pending # merge queue: its run's gap did not land; its outcome waits for its batch's push
      gap.queue-failed: queue-failed
      gap.retried: approved          # triage: a flake, back to the queue
      gap.merged: merged
      gap.parked: parked             # the kill rule, or a park verdict: where it stopped
      gap.closed: closed             # out of the backlog: done on main already, or a duplicate (backlog.py; the pipeline
                                     # manager's close, once the coordinator approved it)
    show: [rank, title, value, size, branch, net_lines, budget, failed_gates, ai_cost_usd, push, blocked_reason,
           parked_for, loop_rounds, loop_hours]
    # gap.timed (no state): its time_in, loop_rounds, loop_hours, loop_ended and gates (dev/bin/times.py)
    relations:
      depends_on: gap                # precedence: ready to build once every gap it names is finished (dev/bin/deps.py);
                                     # one waiting on a parked gap is held by its field waits_on_parked (takes: where);
                                     # one whose fast suites failed only on main's own failures, by waits_on_main
      parent: gap                    # a sub-gap of a split (plan.py)
      duplicates: gap                # closed as a duplicate of another (backlog.py close --duplicate-of)
    fold:
      rounds: sum
      reviews_n: sum
      fix_rounds: sum
      failed_gates: sum
      retries: sum
      queue_attempts: sum
      stalls: sum                    # its suite runs stopped for a limit, it alone in the batch (queue, triage)
      sessions: sum
      ai_cost_usd: sum
      planning_cost_usd: sum         # the planner's and the plan review's share of it (plan.py; measure.py)
      build_hours: sum
      build_failures: sum            # one per failed build, over the gap's life: the kill rule (dev/README.md)
      review_hours: sum
      queue_wait_hours: sum
      queue_runs: append             # each queue run it was in: its id, whole minutes, end (merges-per-hour)
      reviews: append
      contexts: append
      flakes: union
      plan_failures: sum
      plan_reviews: append
      research: union
      research_waits: sum
      measured_runs: append          # each measure-runs of a named measurement: its head, counts, runs (dev/bin/runs.py)
      join_verdicts: append          # each judgment of the join judge: covered or short, the points not built
      resources: append              # each session's and suite's CPU and memory, peak and mean (dev/bin/resources.py)
      tool_denials: sum              # its sessions' tool calls refused (dev/bin/sessions.py), and which (denied); a
      tool_denials_unknown: sum      # session whose result said nothing of them counts in tool_denials_unknown
      denied: append
    join:
      - {children: parent, all: merged, to: joined}   # a split gap waits for the join judge once every sub-gap is
                                                       # merged (plan.py join: merged, split again, or parked)
    lease: {attempts: 2}
    # gap.reverted (no state): the coordinator says a merge was reverted on main - an escape, evidence against the
    # pools (dev/bin/risk.py); so is broke_main, or a later gap or intervention naming it as its caused_by
    # gap.groomed (no state): the backlog's rank, value, size, risk, why and links (dev/bin/backlog.py)
    # gap.need-met (no state): the coordinator or owner records a needs park's action done (need_met: what was done)
    # gap.resumed (no state): a park resumed (resumed_as, resumed_for, resumed_by, cleared: the condition; parks.py)

  review:
    id: review/*
    description: one review of a gap's branch - its verdict (merge, fix or park) and its findings
    states: [written, merge, fix, park]
    on:
      review.written: written
      review.approved: merge
      review.sent-back: fix
      review.parked: park
    show: [gap, round, verdict, ai_cost_usd]
    relations:
      gap: gap

  session:
    id: session/*
    description: one AI session of the factory's (implementor, reviewer, planner, researcher, librarian) - its conversation, live while it runs, and what it cost (dev/bin/sessions.py)
    states: [running, done, failed]
    on:
      session.started: running
      session.ended: done
      session.errored: failed        # no result, an error result, a timeout or a crash
    show: [role, round, gap, model, cost, turns, seconds, transcript]
    # resources (no fold: one container's): its CPU and memory, peak and mean (dev/bin/resources.py)
    relations:
      gap: gap                       # the gap it worked on: the gap's page lists its sessions
      research: research
      review: review                 # (the librarian's step on a review)
      situation: situation           # (the pipeline manager's)
    formats:
      transcript: claude-session     # Claude Code's own session file, the token scrubbed: shown as the conversation,
                                     # each line recorded as a claude.* event about the session (SPEC 5a)
    fold: {messages: append, tool_calls: append, tool_results: append, thinking: append, tokens_in: sum,
           tokens_out: sum}

  flake:
    id: flake/*
    description: a test that failed in a suite and passed alone (seen) - counted each time, until fixed; or one that fails on main too (main-broken, the implementor's triage, dev/bin/onmain.py)
    states: [seen, main-broken, fixed]
    on:
      flake.seen: seen
      flake.main-broken: main-broken   # failed on a branch and on clean main: main's, not the gap's
      flake.fixed: fixed
    show: [test, times, main]
    fold: {times: sum, gaps: union}

  intervention:
    id: intervention/*
    description: the coordinator stepping in by hand, with why - evidence of a loop the factory still lacks
    states: [open, remedied]
    on:
      intervention.recorded: open
      intervention.remedied: remedied
    show: [reason, class, by, remedy]
    fold: {tests: union, gaps: union}  # (class main-broken: one per main commit, every gap held by it)

  situation:
    id: situation/*
    description: one pipeline manager session - every standing trigger no earlier session handled (the queue blocked, gaps dead, parked or stuck, aging defects) and the merge pipeline's broken conditions, raised by pipeline-watch on its schedule or at once when the merge pipeline breaks (dev/bin/watch.py)
    states: [raised, handled, failed, superseded]
    on:
      situation.raised: raised       # reason: scheduled or broken; triggers, each with its fingerprint (prints)
      situation.handled: handled     # the session's calls run (manage.py), each with what it said; an answer per trigger
      situation.failed: failed
      situation.superseded: superseded   # one raised by the one-trigger watch (no prints): closed, never run
    show: [reason, triggers_n, actions_n, summary, ai_cost_usd]
    relations:
      gap: gap                       # the gaps its triggers are about: each gap's page lists it
    lease: {attempts: 2}

  pool:
    id: pool/*
    description: an AI pool (pool/implementor, pool/reviewer) - how many sessions at once, ramped up on good results
    states: [held]
    on:
      pool.measured: held
      pool.raise-asked: held
      pool.lowered: held
    show: [pool, most, decision, risk_bound, tolerance, target, why]

  upgrade:
    id: upgrade/*
    description: a version of main the instance may run - installed into its own folder, switched to, kept or reverted
    states: [available, installed, approved, draining, switched, healthy, reverted, superseded, withdrawn, failed]
    on:
      upgrade.opened: available        # merge queue: a new green main
      upgrade.installed: installed     # upgrader
      upgrade.superseded: superseded
      upgrade.failed: failed
      upgrade.switch-approved: approved    # the switcher (drain.py): its switch-instance approved
      upgrade.draining: draining       # a quiet moment or the daily window: the runs under way drain
      upgrade.drained: draining        # drained (or the bound reached): the switch begins
      upgrade.withdrawn: withdrawn     # a newer version waits, or runs: its switch request withdrawn
      upgrade.switched: switched       # the switch (live.py), once drained
      upgrade.kept: healthy
      upgrade.reverted: reverted
    show: [sha, check, switch, previous]

  research:
    id: research/*
    description: a question for the researcher (dev/bin/ask.py, or a planner's) - asked, then answered with a report
    states: [asked, answered]
    on:
      research.asked: asked
      research.answered: answered
    show: [question, gap, summary, report]

  lesson:
    id: lesson/*
    description: a change to the review lessons, its exact text on the item (entry) - a new class seen, proposed by the librarian (or added by the coordinator), approved, applied by lesson-apply to the record the briefs read, denied by the coordinator, or retired
    states: [seen, proposed, requested, approved, applied, denied, retired]
    on:
      lesson.seen: seen              # librarian: a class not listed, found in one review
      lesson.proposed: proposed      # librarian: a new shape of a known class, or a class found twice
      lesson.requested: requested    # before the knowledge queue: a gap with the exact edit (migrated by lesson.py settle)
      lesson.approved: approved      # knowledge-change approved, or lesson.py add / retire
      lesson.applied: applied        # lesson-apply: carried by the briefs from the record
      lesson.denied: denied          # knowledge-change denied: settled, never proposed again (lesson.py settle)
      lesson.retired: retired        # lesson-apply, for lesson.py retire: no longer carried
    show: [kind, lesson, name, entry, text, times, gap, denied_by, why]
    fold: {times: sum, reviews: union, findings: append}

  knowledge:
    id: knowledge/*
    description: one entry of dev/knowledge/ in the running version, of its file's declared kind (component, rule, lesson, finding, question, source; briefs carry the rules and lessons), kept by the collector knowledge-sync - the owner's decisions are ergostat.decision items instead
    states: [active, retired]
    on:
      knowledge.found: active        # knowledge-sync: an entry in the files (or back in them)
      knowledge.changed: active      # knowledge-sync: its title, text, areas or how many briefs carried it changed
      knowledge.retired: retired     # knowledge-sync: no longer in the files
    about: about                     # its *About:* line: the parts of this model it bears on (explain, check, status)
    show: [kind, title, file, areas, about, carried, text]

messages:
  done: {gap: [merged, closed], situation: [handled, failed, superseded], upgrade: [healthy, reverted, superseded, failed], research: [answered],
         lesson: [requested, applied, denied, retired], knowledge: [retired]}   # (finished, for the estimates)
  paused: {gap: [parked]}          # parked is paused, not done (the owner): continued by hand, never projected to move,
                                   # its dependents blocked by it. A dead letter stays its own status (dead.py parks it)

agents:
  opus:
    kind: ai
    model: claude-opus-5-5
    at-once: 24                         # operator, 2026-11-20: was 3, shared by every AI block, so planning got no slot while 3 implementors ran
    description: headless Claude Code sessions (claude -p) on Opus for the implementor and the reviewer; dev/factory.toml
  coordinator:
    kind: person
    description: the coordinator (a Claude session for the owner) - defines gaps, opens the intake, approves the push and the switch

leases:
  ai: {ttl: 60m}

uses:
  modelling:
    use: modelling
    with:
      run: ""                        # the improver as a claude -p session (on haiku)
      model: haiku
      ai: true                       # the improver, modeller and redesigner, so the model improves itself
      ai-model: haiku
      redesign: {when: auto, model: haiku, budget: 0.5, daily: 2}
  interventions:
    use: interventions               # the inbox's approvals (the push, the switch) as a stock that should fall
