# ergostat on ergostat: the factory that develops ergostat itself (dev/README.md). What the coordinator did by hand
# through the overnight runs (docs/roadmap/overnight-2026-11-19.md) as a model: each gap defined first, built by an AI
# implementor in its own worktree, judged by a disagreeable AI reviewer, landed one at a time by a merge queue behind
# the four suites, and the new main installed and switched to, with a revert.
#
# Boundary.
#   Endogenous: the gaps' chain (open to merged), the reviews, the flakes, the upgrades of the instance itself, the
#   interventions the coordinator records, and the loops that move them.
#   Exogenous: which gaps the owner lists (docs/GAPS.md) or asks for (gap.requested), their definitions of done
#   (written by the coordinator), what the suites say, the machine's load from everything else, the push to origin
#   (held for the coordinator), the AI sessions' cost.
#   Left out: the session transcripts (kept by Claude Code, never in git), the owner's own merges by hand.
#
# Shipped off: the implementor takes nothing until the coordinator opens the intake
# (`ergostat sensor intake-open.main --read 1`). The cap on what the AI sessions cost a day is the goal ai-budget,
# in dev/model/budget.yaml.
name: ergostat-factory
include:
  - dev/model/*.yaml
systems:
  factory:
    description: ergostat's own development - gaps in, merged and running changes out
  intake:
    within: factory
    description: the gaps found in GAPS.md or asked for, waiting for a definition of done - the slow outer loop
    show: [stock.gaps-open]
  building:
    within: factory
    description: gaps defined, built by the implementor in their worktrees, and judged by the reviewer
    show: [stock.gaps-ready, stock.gaps-building, stock.gaps-in-review]
  landing:
    within: factory
    description: the merge queue behind the four suites, flake triage, and the instance upgraded to what landed
    show: [stock.gaps-approved, stock.gaps-queued, stock.upgrades-installed]
  pools:
    within: factory
    description: the AI pools - one implementor and one reviewer to start, sized by measured risk against the owner's risk tolerance
    show: [stock.implementor-pool, stock.reviewer-pool, auxiliary.pool-risk-bound, auxiliary.pool-target]
  oversight:
    within: factory
    description: what the factory may spend, the machine's load, how well it works, and the coordinator's interventions
  spending:
    within: oversight
    description: the AI sessions' cost over the last day, held under the daily cap
    show: [auxiliary.ai-spend]
  ai-hold:
    within: oversight
    description: the provider's usage limit - the AI sessions held till its reset, the queue and the suites running on
    show: [auxiliary.ai-held]
  load:
    within: oversight
    description: the load interlock - the suites running on the machine, their threads and memory
    show: [auxiliary.suites-running, auxiliary.suite-threads, auxiliary.suite-memory]
  resources:
    within: oversight
    description: the machine's CPU, memory, disk and threads, the Docker VM's, and how many more sessions fit
    show: [auxiliary.cpu-utilisation, auxiliary.memory-utilisation, auxiliary.disk-free, auxiliary.session-headroom]
  measures:
    within: oversight
    description: how well the factory works - cycle time, first-pass yield, fix rounds, the queue, flakes, cost
    show: [auxiliary.first-pass-yield, auxiliary.cycle-hours, auxiliary.cost-per-merged]
  guarantees:
    within: oversight
    description: what the factory promises of main - its failing tests, held at zero by main-green
    show: [stock.main-failing-tests]
  times:
    within: oversight
    description: how long each gap spends in each state, in the build-review loop and at each gate, held by goals
    show: [auxiliary.loop-hours, auxiliary.in-ready-hours, auxiliary.gate-unit-minutes]
  interventions:
    within: oversight
    description: the coordinator's interventions, each evidence of a loop the factory lacks
    show: [stock.interventions-open, auxiliary.interventions-trend]
  planning:
    within: factory
    description: each open gap planned (its definition of done, or a split) and its plan linted before it is built
    show: [stock.gaps-planned, stock.gaps-replan]
  research:
    within: factory
    description: questions from the coordinator or a planner, answered with a report and its sources
    show: [stock.research-asked]
  managing:
    within: oversight
    description: the pipeline manager - one AI session over the whole pipeline, on a schedule and at once when the merge pipeline breaks, acting through manage.py and recording each act as an intervention
    show: [stock.situations-raised, auxiliary.stuck-gaps, auxiliary.pipeline-broken-minutes]
  knowledge:
    within: factory
    description: what the briefs carry (dev/knowledge/) - lessons proposed from reviews, approved, added and retired
    show: [stock.knowledge-entries, stock.lessons-proposed, stock.lessons-to-apply, stock.findings-active, auxiliary.first-pass-with-lessons]

projections:
  gap:
    query: key.startswith('gap/')
    description: one piece of ergostat's work - a GAPS.md entry or a request - from open to merged, or parked
    fields:
      state:
        values: [open, replan, planned, split, joined, ready, fix, building, built, in-review, approved, queued, push-pending, queue-failed, merged, parked, closed]
      rounds: {fold: add}
      reviews_n: {fold: add}
      fix_rounds: {fold: add}
      failed_gates: {fold: add}
      retries: {fold: add}
      queue_attempts: {fold: add}
      stalls: {fold: add}         # its suite runs stopped for a limit, it alone in the batch (queue, triage)
      sessions: {fold: add}
      ai_cost_usd: {fold: add}
      planning_cost_usd: {fold: add}                    # the planner's share of it (plan.py; measure.py)
      build_hours: {fold: add}
      build_failures: {fold: add}                 # one per failed build, over the gap's life: the kill rule (dev/README.md)
      review_hours: {fold: add}
      queue_wait_hours: {fold: add}
      queue_runs: {fold: append}             # each queue run it was in: its id, whole minutes, end (merges-per-hour)
      reviews: {fold: append}
      contexts: {fold: append}
      flakes: {fold: union}
      plan_failures: {fold: add}
      research: {fold: union}
      research_waits: {fold: add}
      measured_runs: {fold: append}                # each measure-runs of a named measurement: its head, counts, runs (dev/bin/runs.py)
      join_verdicts: {fold: append}                # each judgment of the join judge: covered or short, the points not built
      resources: {fold: append}            # each session's and suite's CPU and memory, peak and mean (dev/bin/resources.py)
      tool_denials: {fold: add}               # its sessions' tool calls refused (dev/bin/sessions.py), and which (denied); a
      tool_denials_unknown: {fold: add}                       # session whose result said nothing of them counts in tool_denials_unknown
      denied: {fold: append}
      conflicts: {fold: add}            # its merges refused in the queue for a conflict (queue.py refuse)
    events:
      gap-found:
        when: type == 'gap.found'
        '...': data
        milestone: "data.milestone if 'milestone' in data else current"
        state: set('open')  # intake: an entry of docs/GAPS.md
      gap-requested:
        when: type == 'gap.requested'
        '...': data
        milestone: "data.milestone if 'milestone' in data else current"
        state: set('open')  # submitted: ergostat event --add gap.requested --item gap/NAME (or a planner's split)
      gap-planned:
        when: type == 'gap.planned'
        '...': data
        milestone: "data.milestone if 'milestone' in data else current"
        state: set('planned')  # planner: its definition of done written (run/plans/)
      gap-plan-sent-back:
        when: type == 'gap.plan-sent-back'
        '...': data
        milestone: "data.milestone if 'milestone' in data else current"
        state: set('replan')  # plan lint: sent back to the planner with its findings
      gap-split:
        when: type == 'gap.split'
        '...': data
        milestone: "data.milestone if 'milestone' in data else current"
        state: set('split')  # planner: split into sub-gaps, each naming it as parent; joined once all merged
        # (or the join judge: short, a new sub-gap requested first)
      gap-defined:
        when: type == 'gap.defined'
        '...': data
        milestone: "data.milestone if 'milestone' in data else current"
        state: set('ready')  # intake, or the planner: its definition of done exists
      gap-started:
        when: type == 'gap.started'
        '...': data
        milestone: "data.milestone if 'milestone' in data else current"
        state: set('building')  # implementor
      gap-built:
        when: type == 'gap.built'
        '...': data
        milestone: "data.milestone if 'milestone' in data else current"
        state: set('built')
      gap-review-started:
        when: type == 'gap.review-started'
        '...': data
        milestone: "data.milestone if 'milestone' in data else current"
        state: set('in-review')  # reviewer
      gap-approved:
        when: type == 'gap.approved'
        '...': data
        milestone: "data.milestone if 'milestone' in data else current"
        state: set('approved')
      gap-sent-back:
        when: type == 'gap.sent-back'
        '...': data
        milestone: "data.milestone if 'milestone' in data else current"
        state: set('fix')  # reviewer (fix), queue (a conflict) or triage (a real failure): its findings
      gap-queued:
        when: type == 'gap.queued'
        '...': data
        milestone: "data.milestone if 'milestone' in data else current"
        state: set('queued')  # merge queue
      gap-push-pending:
        when: type == 'gap.push-pending'
        '...': data
        milestone: "data.milestone if 'milestone' in data else current"
        state: set('push-pending')  # merge queue: its run's gap did not land; its outcome waits for its batch's push
      gap-queue-failed:
        when: type == 'gap.queue-failed'
        '...': data
        milestone: "data.milestone if 'milestone' in data else current"
        state: set('queue-failed')
      gap-retried:
        when: type == 'gap.retried'
        '...': data
        milestone: "data.milestone if 'milestone' in data else current"
        state: set('approved')  # triage: a flake, back to the queue
      gap-merged:
        when: type == 'gap.merged'
        '...': data
        milestone: "data.milestone if 'milestone' in data else current"
        state: set('merged')
      gap-parked:
        when: type == 'gap.parked'
        '...': data
        milestone: "data.milestone if 'milestone' in data else current"
        state: set('parked')  # the kill rule, or a park verdict: where it stopped
      gap-closed:
        when: type == 'gap.closed'
        '...': data
        milestone: "data.milestone if 'milestone' in data else current"
        state: set('closed')  # out of the backlog: done on main already, or a duplicate (backlog.py; the pipeline
        # manager's close, once the coordinator approved it)
      other:
        when: true
        '...': data
        milestone: "data.milestone if 'milestone' in data else current"
    show: [rank, title, value, size, branch, net_lines, budget, failed_gates, ai_cost_usd, push, blocked_reason, parked_for, loop_rounds, loop_hours]
    # gap.timed (no state): its time_in, loop_rounds, loop_hours, loop_ended, gates, catches and catch_times
    # (dev/bin/times.py)
    relations:
      depends_on: {projection: gap, starts_at: [approved, queued, push-pending]}
                                     # precedence: ready to build once every gap it names is finished, or reviewed and
                                     # not yet on main (starts_at, fac.STACKABLE: built stacked on it; dev/bin/deps.py);
                                     # one waiting on a parked gap is held by its field waits_on_parked (takes: where);
                                     # one whose fast suites failed only on main's own failures, by waits_on_main
      parent: gap                    # a sub-gap of a split (plan.py)
      duplicates: gap                # closed as a duplicate of another (backlog.py close --duplicate-of)
      milestone: {projection: milestone, group: true, precedence: false, inverse: gaps, done_when: {closed: {end: done}}}
                                     # the milestone it is finished with (milestones.py assign); folded by replace, so a
                                     # gap is in one, and the old free-text labels (not ids) stay as they were written;
                                     # in its progress a closed gap is done work only when closed as done on main (end:
                                     # done), else (a duplicate, abandoned, no end said) it leaves the total;
                                     # with [milestones] enforce, one not active holds the gap by its field
                                     # waits_on_milestone (gap.milestone-held, no state), unless it is pulled
    risk-score:                      # each change's chance of failing once approved, learned from the gaps judged
      at: approved                   # before it (SPEC §5a, Risk score; ergostat item --projection gap --risk-score [--backtest])
      failed: [gap.queue-failed, gap.reverted]
      undone: [gap.retried]          # triage: a flake, only quarantined tests, or a stall: not the branch's failure
      passed: [merged]
      from: {paths: each, net_lines: size, source: value, built_by: value, conflicts: size, failed_gates: size}
    join:
      - {children: parent, all: merged, to: joined}   # a split gap waits for the join judge once every sub-gap is
                                                       # merged (plan.py join: merged, split again, or parked)
    lease: {attempts: 2}
    # gap.reverted (no state): a merge reverted on main (found by main-watch, dev/bin/escapes.py, or said by the
    # coordinator) - an escape, evidence against the
    # pools (dev/bin/risk.py); so is broke_main, or a later gap or intervention naming it as its caused_by
    # gap.groomed (no state): the backlog's rank, value, size, risk, why and links (dev/bin/backlog.py)
    # gap.need-met (no state): the coordinator or owner records a needs park's action done (need_met: what was done)
    # gap.resumed (no state): a park resumed (resumed_as, resumed_for, resumed_by, cleared: the condition; parks.py)

  milestone:
    query: key.startswith('milestone/')
    description: a group of gaps finished together (the owner, 2026-11-22) - waiting on the milestones it depends on, active (at most [milestones] active_max at once, in rank order; an upkeep one always), completed once it has gaps and every one is merged or closed, or an upkeep one at the end of its cycle (dev/bin/milestones.py)
    fields:
      state:
        values: [waiting, active, completed]
    final: [completed]               # no event moves a completed milestone out of it
    events:
      milestone-added:
        when: type == 'milestone.added'
        '...': data
        state: set('waiting')  # milestones.py add
      milestone-activated:
        when: type == 'milestone.activated'
        '...': data
        state: set('active')  # milestones.py pass: its dependencies completed, and room under the limit
      milestone-completed:
        when: type == 'milestone.completed'
        '...': data
        state: set('completed')
      other:
        when: true
        '...': data
    show: [title, rank, upkeep, upkeep_ends]
    # milestone.changed (no state): its dependencies (milestones.py depends)
    relations:
      depends_on: milestone          # precedence: active only once every milestone it names is completed

  review:
    query: key.startswith('review/')
    description: one review of a gap's branch - its verdict (merge, fix or park) and its findings
    fields:
      state:
        values: [written, merge, fix, park]
    events:
      review-written:
        when: type == 'review.written'
        '...': data
        state: set('written')
      review-approved:
        when: type == 'review.approved'
        '...': data
        state: set('merge')
      review-sent-back:
        when: type == 'review.sent-back'
        '...': data
        state: set('fix')
      review-parked:
        when: type == 'review.parked'
        '...': data
        state: set('park')
      other:
        when: true
        '...': data
    show: [gap, round, verdict, ai_cost_usd]
    relations:
      gap: gap

  session:
    query: key.startswith('session/')
    description: one AI session of the factory's (implementor, reviewer, planner, researcher, librarian) - its conversation, live while it runs, and what it cost (dev/bin/sessions.py)
    fields:
      state:
        values: [running, done, failed]
      messages: {fold: append}
      tool_calls: {fold: append}
      tool_results: {fold: append}
      thinking: {fold: append}
      tokens_in: {fold: add}
      tokens_out: {fold: add}
    events:
      session-started:
        when: type == 'session.started'
        '...': data
        state: set('running')
      session-ended:
        when: type == 'session.ended'
        '...': data
        state: set('done')
      session-errored:
        when: type == 'session.errored'
        '...': data
        state: set('failed')  # no result, an error result, a timeout or a crash
      other:
        when: true
        '...': data
    show: [role, round, gap, model, cost, turns, seconds, transcript]
    # resources (no fold: one container's): its CPU and memory, peak and mean (dev/bin/resources.py)
    relations:
      gap: gap                       # the gap it worked on: the gap's page lists its sessions
      research: research
      review: review                 # (the librarian's step on a review)
      situation: situation           # (the pipeline manager's)
    formats:
      transcript: claude-session     # Claude Code's own session file, the token scrubbed: shown as the conversation,
                                     # each line recorded as a claude.* event about the session (SPEC 5a)
  flake:
    query: key.startswith('flake/')
    description: a test that failed in a suite and passed alone (seen) - counted each time, until fixed; or one that fails on main too (main-broken, the implementor's triage, dev/bin/onmain.py), until it passes twice alone on the pushed main (main-mend, dev/bin/mend.py)
    fields:
      state:
        values: [seen, main-broken, fixed]
      times: {fold: add}
      gaps: {fold: union}
    # written only by dev/bin/flakes.py, on the item as it stands, under its lock: seen on a main-broken item is
    # flake.measured (counted, still main's); a second main-broken keeps main_broken_at; either on a fixed item makes
    # it again (times 1, main_fixed_at, fixed_by, green_passes and passed_on removed); flake.fixed by hand is
    # manage.py flake-fixed's (fixed_by: the person, why), read and written under the same lock
    # flake.released (no state): the quarantine's release, its test off main's list (quarantined: false,
    # released_at; fac.beside); quarantined folds from it and from flake.measured as before
    events:
      flake-seen:
        when: type == 'flake.seen'
        '...': data
        state: set('seen')
      flake-main-broken:
        when: type == 'flake.main-broken'
        '...': data
        state: set('main-broken')  # failed on a branch and on clean main: main's, not the gap's
      flake-fixed:
        when: type == 'flake.fixed'
        '...': data
        state: set('fixed')
      flake-main-fixed:
        when: type == 'flake.main-fixed'
        '...': data
        state: set('fixed')  # passed twice alone on the pushed main (dev/bin/mend.py, under flakes.py's
        # lock): a patch testing /main as read, so a newer break refuses it and its move
      other:
        when: true
        '...': data
    show: [test, times, main]
  intervention:
    query: key.startswith('intervention/')
    description: the coordinator stepping in by hand, with why - evidence of a loop the factory still lacks
    fields:
      state:
        values: [open, remedied]
      tests: {fold: union}
      gaps: {fold: union}
    events:
      intervention-recorded:
        when: type == 'intervention.recorded'
        '...': data
        state: set('open')
        # lock): a patch testing /main as read, so a newer break refuses it and its move
      intervention-remedied:
        when: type == 'intervention.remedied'
        '...': data
        state: set('remedied')
      other:
        when: true
        '...': data
    show: [reason, class, by, remedy]
  situation:
    query: key.startswith('situation/')
    description: one pipeline manager session - every standing trigger no earlier session handled (the queue blocked, gaps dead, parked or stuck, aging defects) and the merge pipeline's broken conditions, raised by pipeline-watch on its schedule or at once when the merge pipeline breaks (dev/bin/watch.py)
    fields:
      state:
        values: [raised, handled, failed, superseded]
    events:
      situation-raised:
        when: type == 'situation.raised'
        '...': data
        state: set('raised')  # reason: scheduled or broken; triggers, each with its fingerprint (prints)
      situation-handled:
        when: type == 'situation.handled'
        '...': data
        state: set('handled')  # the session's calls run (manage.py), each with what it said; an answer per trigger
        # lock): a patch testing /main as read, so a newer break refuses it and its move
      situation-failed:
        when: type == 'situation.failed'
        '...': data
        state: set('failed')
      situation-superseded:
        when: type == 'situation.superseded'
        '...': data
        state: set('superseded')  # one raised by the one-trigger watch (no prints): closed, never run
      other:
        when: true
        '...': data
    show: [reason, triggers_n, actions_n, summary, ai_cost_usd]
    attention: finding               # the latest session's finding, on the page's attention list (not only stored here)
    relations:
      gap: gap                       # the gaps its triggers are about: each gap's page lists it
    lease: {attempts: 2}

  pool:
    query: key.startswith('pool/')
    description: an AI pool (pool/implementor, pool/reviewer) - how many sessions at once, ramped up on good results
    fields:
      state:
        values: [held]
    events:
      pool-measured:
        when: type == 'pool.measured'
        '...': data
        state: set('held')
      pool-raise-asked:
        when: type == 'pool.raise-asked'
        '...': data
        state: set('held')
      pool-lowered:
        when: type == 'pool.lowered'
        '...': data
        state: set('held')
        # lock): a patch testing /main as read, so a newer break refuses it and its move
      other:
        when: true
        '...': data
    show: [pool, most, decision, risk_bound, tolerance, target, why]

  upgrade:
    query: key.startswith('upgrade/')
    description: a version of main the instance may run - installed into its own folder, switched to, kept or reverted
    fields:
      state:
        values: [available, installed, approved, draining, switched, healthy, reverted, superseded, withdrawn, failed]
    events:
      upgrade-opened:
        when: type == 'upgrade.opened'
        '...': data
        state: set('available')  # merge queue: a new green main
        # lock): a patch testing /main as read, so a newer break refuses it and its move
      upgrade-installed:
        when: type == 'upgrade.installed'
        '...': data
        state: set('installed')  # upgrader
      upgrade-superseded:
        when: type == 'upgrade.superseded'
        '...': data
        state: set('superseded')
      upgrade-failed:
        when: type == 'upgrade.failed'
        '...': data
        state: set('failed')
      upgrade-switch-approved:
        when: type == 'upgrade.switch-approved'
        '...': data
        state: set('approved')  # the switcher (drain.py): its switch-instance approved
      upgrade-switch-begun:
        when: type == 'upgrade.switch-begun'
        '...': data
        state: set('approved')  # the switch started (live.py, its own process): the runs under way carry on
      upgrade-draining:
        when: type == 'upgrade.draining'
        '...': data
        state: set('draining')  # (the record's before switch-without-draining: a switch waited for the runs
      upgrade-drained:
        when: type == 'upgrade.drained'
        '...': data
        state: set('draining')  # under way to drain; kept so the record of those still reads)
      upgrade-withdrawn:
        when: type == 'upgrade.withdrawn'
        '...': data
        state: set('withdrawn')  # a newer version waits, or runs: its switch request withdrawn
      upgrade-switched:
        when: type == 'upgrade.switched'
        '...': data
        state: set('switched')  # the switch (live.py): the new version's engine started
      upgrade-kept:
        when: type == 'upgrade.kept'
        '...': data
        state: set('healthy')
      upgrade-reverted:
        when: type == 'upgrade.reverted'
        '...': data
        state: set('reverted')
      other:
        when: true
        '...': data
    show: [sha, check, switch, previous]

  research:
    query: key.startswith('research/')
    description: a question for the researcher (dev/bin/ask.py, or a planner's) - asked, then answered with a report whose sources were checked (dev/bin/research.py); an answer with none checked is asked again once, then dead
    fields:
      state:
        values: [asked, unsourced, answered, dead]
      unsourced: {fold: add}
    events:
      research-asked:
        when: type == 'research.asked'
        '...': data
        state: set('asked')
      research-unsourced:
        when: type == 'research.unsourced'
        '...': data
        state: set('unsourced')  # no source checked: given back (counted), asked again with the why in its brief
        # lock): a patch testing /main as read, so a newer break refuses it and its move
      research-answered:
        when: type == 'research.answered'
        '...': data
        state: set('answered')  # at least one source checked (sources_checked; the rest in sources_unchecked)
      research-dead-lettered:
        when: type == 'research.dead-lettered'
        '...': data
        state: set('dead')  # unsourced a second time: its lease's last attempt, a dead letter
      other:
        when: true
        '...': data
    show: [question, gap, summary, report, sources_checked, sources_unchecked, unsourced_why]
  lesson:
    query: key.startswith('lesson/')
    description: a change to the review lessons, its exact text on the item (entry) - a new class seen, proposed by the librarian (or added by the coordinator), or a finding (kind finding) the researcher proposed from a checked answer, carried by its areas - approved, applied by lesson-apply to the record the briefs read, denied by the coordinator, or retired
    fields:
      state:
        values: [new, seen, proposed, requested, approved, applied, denied, retired]
      times: {fold: add}
      reviews: {fold: union}
      findings: {fold: append}
                                     # new: no event puts one there; it arrives seen, a working state the librarian
                                     # moves on (lesson.proposed) once a second review finds its class, so why names it;
                                     # lesson.seen is written last, so proposed names lesson.requested, not a move back
    events:
      lesson-proposed:
        when: type == 'lesson.proposed'
        '...': data
        state: set('proposed')  # librarian: a new shape of a known class, or a class found twice; researcher: a finding
      lesson-requested:
        when: type == 'lesson.requested'
        '...': data
        state: set('requested')  # before the knowledge queue: a gap with the exact edit (migrated by lesson.py settle)
      lesson-approved:
        when: type == 'lesson.approved'
        '...': data
        state: set('approved')  # knowledge-change approved, or lesson.py add / retire
        # lock): a patch testing /main as read, so a newer break refuses it and its move
      lesson-applied:
        when: type == 'lesson.applied'
        '...': data
        state: set('applied')  # lesson-apply: carried by the briefs from the record
      lesson-denied:
        when: type == 'lesson.denied'
        '...': data
        state: set('denied')  # knowledge-change denied: settled, never proposed again (lesson.py settle)
      lesson-retired:
        when: type == 'lesson.retired'
        '...': data
        state: set('retired')  # lesson-apply, for lesson.py retire: no longer carried
      lesson-seen:
        when: type == 'lesson.seen'
        '...': data
        state: set('seen')  # librarian: a class not listed, found in one review
      other:
        when: true
        '...': data
    show: [kind, lesson, name, entry, areas, research, text, times, gap, denied_by, why]
  knowledge:
    query: key.startswith('knowledge/')
    description: one entry of dev/knowledge/ in the running version, of its file's declared kind (component, rule, lesson, finding, question, source; briefs carry the rules and lessons), kept by the collector knowledge-sync - the owner's decisions are ergostat.decision items instead
    fields:
      state:
        values: [new, active, retired]
    events:
      knowledge-found:
        when: type == 'knowledge.found'
        '...': data
        state: set('active')  # knowledge-sync: an entry in the files (or back in them)
      knowledge-changed:
        when: type == 'knowledge.changed'
        '...': data
        state: set('active')  # knowledge-sync: its title, text, areas or how many briefs carried it changed
      knowledge-retired:
        when: type == 'knowledge.retired'
        '...': data
        state: set('retired')  # knowledge-sync: no longer in the files
      other:
        when: true
        '...': data
    about: about                     # its *About:* line: the parts of this model it bears on (explain, check, status)
    show: [kind, title, file, areas, about, carried, text]

messages:
  done: {gap: [merged, closed], milestone: [completed], batch: [landed, partial, failed, given-back], situation: [handled, failed, superseded], upgrade: [healthy, reverted, superseded, failed], research: [answered], lesson: [requested, applied, denied, retired], knowledge: [retired]} # (finished, for the estimates)
  paused: {gap: [parked]}          # parked is paused, not done (the owner): continued by hand, never projected to move,
                                   # its dependents blocked by it. A dead letter stays its own status (dead.py parks it)

agents:
  opus:
    kind: ai
    model: claude-opus-5-5
    at-once: 24                         # operator, 2026-11-20: was 3, shared by every AI block, so planning got no slot while 3 implementors ran
    description: headless Claude Code sessions (claude -p) on Opus for the implementor and the reviewer; dev/factory.toml
  coordinator:
    kind: person
    description: the coordinator (a Claude session for the owner) - defines gaps, opens the intake, approves the push and the switch

leases:
  ai: {ttl: 60m}

runs:
  outlive_engine: true                # each run kept by a keeper of its own: a version switch stops the engine, not
                                      # the runs under way; the new version's engine takes them up (dev/bin/drain.py)

uses:
  modelling:
    use: modelling
    with:
      run: ""                        # the improver as a claude -p session (on haiku)
      model: haiku
      ai: true                       # the improver, modeller and redesigner, so the model improves itself
      ai-model: haiku
      redesign: {when: auto, model: haiku, budget: 0.5, daily: 2}
  interventions:
    use: interventions               # the inbox's approvals (the push, the switch) as a stock that should fall
