# Relations between items (SPEC section 5a, Relations): epics of tickets that wait on one another.
projections:
  epic:
    query: key.startswith('epic/')
    fields:
      state:
        type: one of [planned, underway, shipped]
    events:
      epic-started:
        when: type == 'epic.started'
        '...': data
        state: set('underway')
      epic-shipped:
        when: type == 'epic.shipped'
        '...': data
        state: set('shipped')
      other:
        when: true
        '...': data
    relations:
      after: epic                                   # precedence: it follows the epic it names
  ticket:
    query: key.startswith('ticket/')
    fields:
      state:
        type: one of [todo, doing, review, done]
    events:
      ticket-started:
        when: type == 'ticket.started'
        '...': data
        state: set('doing')
      ticket-submitted:
        when: type == 'ticket.submitted'
        '...': data
        state: set('review')
      ticket-approved:
        when: type == 'ticket.approved'
        '...': data
        state: set('done')
      other:
        when: true
        '...': data
    relations:
      blocked_by: ticket                            # precedence: ready once each ticket it names is done
      parent: epic                                  # cross-projection; a group: the Graph hangs it off its epic
      duplicates: {projection: [ticket, epic], inverse: duplicated_by}
      relates_to: {projection: ticket, precedence: false}
    show: [title, blocked_by]
messages:
  done: {ticket: [done], epic: [shipped]}
stocks:
  todo:
    unit: tickets
    sensor: {projection: ticket, state: todo, every: 5s}
  reviewers:
    unit: people
    sensor: {manual: true}                          # how many reviewers are free: the reviewer's pool now
flows:
  started:
    from: todo
    sensor: {projection: ticket, entering: doing, over: 10m}
goals:
  nothing-waits:
    stock: todo
    hold: "<= 0"
blocks:
  developer:
    type: program
    goal: nothing-waits
    run: ./work.sh
    takes: {projection: ticket, at: todo, to: [review], unblocked: true}   # only unblocked tickets, the critical first
    pool: 2
    out: flow.started
  reviewer:
    type: program
    run: ./review.sh
    takes: {projection: ticket, at: review, to: [done, todo]}
    pool: {now: stock.reviewers, most: 3}          # (SPEC section 9.5) the stock read at each dispatch, never above 3
