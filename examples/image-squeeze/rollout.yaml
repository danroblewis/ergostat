# The experiment: the candidate build, run on the same images as production, compared image by
# image at equal quality, and given traffic as long as it earns it.
defaults:
  system: rollout

variables:
  bytes-saved:
    unit: "%"
    description: how many fewer bytes the candidate needs at equal quality, a 90% confidence interval
    sensors:
      low:
        run: bin/py world/read.py bytes-saved-low
        every: 8s
      high:
        run: bin/py world/read.py bytes-saved-high
        every: 8s
    driven-by: [variable.candidate-offset, flow.started]
  quality-change:
    unit: ssim
    description: how much better the candidate looks than production on the same images
    sensor:
      run: bin/py world/read.py quality-change
      every: 8s
    driven-by: [variable.candidate-offset, flow.started]
  candidate-failures:
    unit: images
    sensor:
      run: bin/py world/read.py candidate-failures
      every: 8s
    driven-by: flow.started
  candidate-time:
    unit: ms
    sensor:
      run: bin/py world/read.py candidate-time
      every: 8s
    driven-by: flow.started
  paired:
    unit: images
    description: images both builds have compressed
    sensor:
      run: bin/py world/read.py paired
      every: 8s
  candidate-offset:
    unit: q
    description: how much lower (or higher) the candidate's quality setting runs than production's
  rollout-share:
    unit: share
    description: the share of images the candidate's answer is served for (0, 5%, 25%, 50%, 100%)

goals:
  matched:
    variable: quality-change
    hold: "== 0"
    tolerance: 0.008
    description: bytes are only compared when the two look the same

blocks:
  matcher:                                 # a tracking loop: the candidate's quality follows production's
    type: program
    run: bin/py bin/lab.py match
    in: goal.matched.error
    every: 16s
    out: variable.candidate-offset
  rollout:                                 # progressive delivery: more traffic while it earns it, else back
    type: program
    run: bin/py bin/lab.py rollout
    in:
      saved-low: variable.bytes-saved.low
      saved-high: variable.bytes-saved.high
      quality: variable.quality-change
      failures: variable.candidate-failures
      time: variable.candidate-time
      paired: variable.paired
      served-failures: variable.failures
      served-time: variable.time
    every: 16s
    out:
      share: variable.rollout-share
      kept: flow.kept
      dropped: flow.dropped
