# The experiment: the candidate build, run on the same images as production, compared image by
# image at equal quality, and given traffic as long as it earns it.
#
# What keeps its value until a process moves it is a stock: the candidate's quality offset and its
# share of traffic (until the matcher and the rollout step them), the images compared and the
# candidate's failures so far (counts, cleared for each new candidate), its time (the 95th
# percentile over the images compared: a window, moved as images enter and leave it). The two
# comparisons, bytes saved and quality change, are each a difference between two builds on the same
# images, a function of what both did and of the offset, with nothing of their own to keep: auxiliaries.
defaults:
  system: rollout

auxiliaries:
  bytes-saved:
    unit: "%"
    description: how many fewer bytes the candidate needs at equal quality, a 90% confidence interval
    sensors:
      low:
        run: bin/py world/read.py bytes-saved-low
        every: 8s
      high:
        run: bin/py world/read.py bytes-saved-high
        every: 8s
    driven-by: [-stock.candidate-offset, flow.submitted]      # a higher quality for the candidate costs it bytes
  quality-change:
    unit: ssim
    description: how much better the candidate looks than production on the same images
    sensor:
      run: bin/py world/read.py quality-change
      every: 8s
    driven-by: [+stock.candidate-offset, flow.submitted]

stocks:
  candidate-failures:
    unit: images
    description: images the candidate failed on, since it started
    sensor:
      run: bin/py world/read.py candidate-failures
      every: 8s
  candidate-time:
    unit: ms
    description: the candidate's time to compress one image, 95th percentile over the images compared
    sensor:
      run: bin/py world/read.py candidate-time
      every: 8s
  paired:
    unit: images
    description: images both builds have compressed, counted from the candidate's start
    sensor:
      run: bin/py world/read.py paired
      every: 8s
  candidate-offset:
    unit: q
    description: how much higher the candidate's quality setting runs than production's; kept until the matcher steps it
    sensor:
      run: bin/py world/read.py candidate-offset
      every: 8s
  rollout-share:
    unit: share
    description: the share of images the candidate's answer is served for (0, 5%, 25%, 50%, 100%); kept until the rollout steps it
    sensor:
      run: bin/py world/read.py rollout-share
      every: 8s

flows:
  compared:
    to: paired
    driven-by: +stock.experiments            # while a candidate runs, every image is compressed by both
    description: images compressed by both builds
    sensor:
      changes: rises
      over: 2m
      every: 8s
  cleared:
    from: paired
    driven-by: [+flow.kept, +flow.dropped]   # a new candidate is compared from 0
    sensor:
      changes: falls
      over: 2m
      every: 8s
  candidate-failing:
    to: candidate-failures
    driven-by: flow.submitted                # what the build is: not known which way
    sensor:
      changes: rises
      over: 2m
      every: 8s
  failures-cleared:
    from: candidate-failures
    driven-by: [+flow.kept, +flow.dropped]
    sensor:
      changes: falls
      over: 2m
      every: 8s
  candidate-time-turnover:
    to: candidate-time
    two-way: true
    driven-by: flow.submitted
    sensor:
      changes: net
      over: 2m
      every: 8s
  offset-steps:
    to: candidate-offset
    two-way: true
    description: the matcher's steps, up while the candidate looks worse, back down while it looks better
  adopted:
    from: candidate-offset
    to: quality-setting
    description: a kept candidate's offset, carried over into production's quality setting
  offset-cleared:
    from: candidate-offset
    description: a dropped candidate's offset, forgotten
  share-steps:
    to: rollout-share
    two-way: true
    description: the rollout's steps, up a stage while the candidate earns it, back to 0 when it is kept or dropped

goals:
  matched:
    auxiliary: quality-change
    hold: "== 0"
    tolerance: 0.008
    description: bytes are only compared when the two look the same

blocks:
  matcher:                                 # a tracking loop: the candidate's quality offset is stepped by the error
    type: program
    run: bin/py bin/lab.py match
    in: goal.matched.error
    every: 16s
    out: flow.offset-steps
  rollout:                                 # progressive delivery: more traffic while it earns it, else back
    type: program
    run: bin/py bin/lab.py rollout
    in:
      saved-low: auxiliary.bytes-saved.low
      saved-high: auxiliary.bytes-saved.high
      quality: auxiliary.quality-change
      failures: stock.candidate-failures
      time: stock.candidate-time
      paired: stock.paired
      served-failures: stock.failures
      served-time: stock.time
    every: 16s
    out:
      share: flow.share-steps
      kept: flow.kept
      dropped: flow.dropped
      adopted: flow.adopted
      offset-cleared: flow.offset-cleared
