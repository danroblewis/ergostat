# The experiment: the candidate build, run on the same images as production, compared image by
# image at equal quality, and given traffic as long as it earns it.
#
# What keeps its value until a process moves it is a stock: the candidate's quality offset and its
# share of traffic (until the matcher and the rollout step them), the images compared and the
# candidate's failures so far (counts, cleared for each new candidate), its time (the 95th
# percentile over the images compared: a window, moved as images enter and leave it). The two
# comparisons, bytes saved and quality change, are each a difference between two builds on the same
# images, a function of what both did and of the offset, with nothing of their own to keep: auxiliaries.
#
# Two blocks decide, each pushing one way, so each reading has one sign: the rollout gives the
# candidate traffic stage by stage and keeps it, holding back while the service's goals are off; the
# rollback drops it when it fails one of its own guards. Both weigh the evidence (the images compared,
# the bytes saved); ergostat cannot yet be told which way a program block takes a reading, so the
# loops through those readings are of unknown polarity (the rollout's rise with both; the
# rollback's with the images compared, and fall with the bytes saved). The quality change they also
# read (from run/world/state.json) is the matcher's to hold at 0, and is left out.

defaults:
  system: rollout

auxiliaries:
  bytes-saved:
    unit: "%"
    description: how many fewer bytes the candidate needs at equal quality, a 90% confidence interval
    sensors:
      low:
        run: bin/py world/read.py bytes-saved-low
        every: 8s
      high:
        run: bin/py world/read.py bytes-saved-high
        every: 8s
    driven-by: -stock.candidate-offset      # a higher quality for the candidate costs it bytes (what the build itself does is its own)
  quality-change:
    unit: ssim
    description: how much better the candidate looks than production on the same images
    sensor:
      run: bin/py world/read.py quality-change
      every: 8s
    driven-by: +stock.candidate-offset

stocks:
  candidate-failures:
    unit: images
    description: images the candidate failed on, since it started
    sensor:
      run: bin/py world/read.py candidate-failures
      every: 8s
  candidate-time:
    unit: ms
    description: the candidate's time to compress one image, 95th percentile over the images compared
    sensor:
      run: bin/py world/read.py candidate-time
      every: 8s
  paired:
    unit: images
    description: images both builds have compressed, counted from the candidate's start
    sensor:
      run: bin/py world/read.py paired
      every: 8s
  candidate-offset:
    unit: q
    description: how much higher the candidate's quality setting runs than production's; kept until the matcher steps it
    sensor:
      run: bin/py world/read.py candidate-offset
      every: 8s
  rollout-share:
    unit: share
    description: the share of images the candidate's answer is served for (0, 5%, 25%, 50%, 100%); kept until the rollout steps it
    sensor:
      run: bin/py world/read.py rollout-share
      every: 8s

flows:
  # what an experiment accumulates while a candidate runs, and clears when it is decided
  compared:
    to: paired
    driven-by: +stock.experiments            # while a candidate runs, every image is compressed by both
    description: images compressed by both builds
    sensor:
      changes: rises
      over: 2m
      every: 8s
  cleared:
    from: paired
    driven-by: [+flow.kept, +flow.dropped]   # a new candidate is compared from 0
    sensor:
      changes: falls
      over: 2m
      every: 8s
  candidate-failing:                         # the build's own defects: nothing in the model drives them
    to: candidate-failures
    sensor:
      changes: rises
      over: 2m
      every: 8s
  failures-cleared:
    from: candidate-failures
    driven-by: +flow.dropped                 # a kept candidate failed on nothing: only a dropped one has failures to clear
    sensor:
      changes: falls
      over: 2m
      every: 8s
  candidate-time-turnover:
    to: candidate-time
    two-way: true
    driven-by: +stock.experiments            # the window fills while a candidate runs and empties when it is decided (how slow it is, is the build's own)
    sensor:
      changes: net
      over: 2m
      every: 8s
  # the settings the matcher and the rollout step
  offset-steps:
    to: candidate-offset
    two-way: true
    description: the matcher's steps, up while the candidate looks worse, back down while it looks better, and back to 0 for a new candidate
  adopted:
    from: candidate-offset
    to: quality-setting
    description: a kept candidate's offset, carried over into production's quality setting
  share-steps:
    to: rollout-share
    two-way: true
    description: the rollout's steps, up a stage each 30 images compared while the candidate saves bytes, back to 0 once it is kept or dropped

goals:
  matched:
    auxiliary: quality-change
    hold: "== 0"
    tolerance: 0.008
    description: bytes are only compared when the two look the same
  candidate-sound:
    stock: candidate-failures
    hold: "<= 0"
    critical: true
    description: the candidate fails on no image, before and while it is served (else it is rolled back)
  candidate-fast:
    stock: candidate-time
    hold: "<= 120"
    description: the candidate is within the time budget, 95th percentile (else it is rolled back); the rollback reads the budget here

blocks:
  matcher:                                 # a tracking loop: the candidate's quality offset is stepped by the error
    type: program
    run: bin/py bin/lab.py match
    in: goal.matched.error
    every: 16s
    out: flow.offset-steps
  rollout:                                 # progressive delivery: more traffic while it earns it, then kept
    type: program
    run: bin/py bin/lab.py rollout
    in:                                    # a stage per 30 images compared while it saves bytes; none while the service is off
      paired: +stock.paired                # more images compared: more stages
      saved: +auxiliary.bytes-saved        # more bytes saved: more traffic, sooner kept
      served-failures: goal.no-failures.error
      served-time: goal.fast-enough.error
    every: 16s
    out:
      share: flow.share-steps
      kept: flow.kept
      adopted: flow.adopted
  rollback:                                # the guards: any failure, too slow, more bytes, no clear difference: dropped
    type: program
    run: bin/py bin/lab.py rollback
    in:
      failures: goal.candidate-sound.off
      time: goal.candidate-fast.off
      saved: -auxiliary.bytes-saved        # fewer bytes saved: dropped the sooner
      paired: +stock.paired                # more images compared: the sooner a verdict
    every: 16s
    out: flow.dropped
