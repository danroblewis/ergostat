# Finished work held to what the owner meant (ergostat's SPEC §12i). A hypothesis that passes its tests and is
# submitted (testing) is judged by ergostat's intent judge against the owner's confirmed decisions about squeeze
# (scope: formats), the corrections for this kind of work, and the owner's messages about it, reading its branch's
# diff in squeeze's own repository. Its verdict, with evidence (the decision it goes against, the line that does it),
# is an ergostat.verdict item and the hypothesis's field `intent`; the rollback reads it, and drops a candidate that is
# not done as meant, and the rollout keeps none before it has a verdict.
#
# The owner's decisions here are made up for the demo (bin/owner.py proposes and confirms them once): squeeze writes
# JPEG and PNG only, an image keeps its size, metadata stays. The stand-in researcher's notebook has three ideas that
# pass their tests and go against them (WebP, downscaling, stripping metadata): the planted cases.
#
# The judge is free (a stand-in that matches what the owner ruled out against what the work brings in). With a model
# it reads the work as a reviewer: `ergostat intent judge ITEM --model haiku --again`, or `model: haiku` below.
defaults:
  system: intent

systems:
  intent:
    description: finished work held to what the owner meant, before it counts as done
    show: [stock.decisions, stock.work-held, auxiliary.false-done]

stocks:
  decisions:
    unit: decisions
    description: the owner's confirmed decisions (made up for the demo, bin/owner.py), what the work is held to
    sensor:
      items: ergostat.decision
      state: confirmed
      every: 10s
  work-held:
    unit: hypotheses
    description: work that passed its tests and was found not done as the owner meant (contradicted or unmet, not
      overruled), over the last week; each with its evidence (Items → ergostat.verdict)
    sensor:
      builtin: ergostat.intent.held
      every: 10s

auxiliaries:
  false-done:
    unit: share
    description: of the hypotheses kept over the last week, the share the owner later reopened, followed up or
      corrected (what got past the judge; 0 while none is kept)
    sensor:
      builtin: ergostat.intent.false-done@hypothesis
      every: 30s
    driven-by: -stock.work-held          # what the judge holds back does not get kept, and so is not found later
  false-done-tests:
    unit: share
    description: the same, had the tests alone decided (what the judge caught, plus what got past it)
    sensor:
      builtin: ergostat.intent.false-done-tests@hypothesis
      every: 30s
    driven-by: +stock.work-held          # what the judge caught counts here: the tests passed it

flows:
  decided:
    to: decisions
    description: decisions the owner confirmed
  superseded:
    from: decisions
    description: decisions the owner replaced by later ones (none in the demo)
  holding:
    to: work-held
    description: verdicts that work is not done as meant, as the judge gives them
    sensor:
      changes: rises
      over: 30m
      every: 10s
  released:
    from: work-held
    description: verdicts the owner overruled (a false alarm), or older than the week the measure counts
    sensor:
      changes: falls
      over: 30m
      every: 10s

goals:
  done-as-meant:
    auxiliary: false-done
    hold: "<= 0.1"
    description: "what is kept is what the owner meant: at most one kept hypothesis in ten reopened or corrected by
      the owner afterwards. Nothing here acts on it; a verdict that holds work back needs attention, and the owner
      overrules a false alarm (ergostat intent overrule ID --reason)"

blocks:
  owner:                                  # the owner, for the demo: decides once (synthetic decisions)
    type: program
    run: bin/py bin/owner.py
    every: 1h
    out: flow.decided
  intent-judge:
    type: judge
    judge: intent
    every: 10s
    kinds:
      hypothesis:
        at: testing                       # submitted: its tests passed
        accepted: kept                    # kept: part of production
        scope: [formats, squeeze]         # the decisions about squeeze's output
        work: [code]                      # the corrections for code
        reopen-to: proposed
    out:
      held: flow.holding
