# The benchmark: how good squeeze is, whatever images happen to arrive. Thirty fixed cases, five of
# each kind of image, each with a target (world/benchmark.py): the kilobytes per megapixel it should
# need while still looking good enough. Measured on every release (the score's sensor runs it, and
# records each case it saw as an item); every candidate is measured too, when it is submitted, and
# rolled back if it loses a case production meets.
defaults:
  system: benchmark

projections:
  case:
    id: case/*
    states: [unmet, met]
    on:
      case.met: met
      case.unmet: unmet
    show: [original, output, image, kb_per_mp, target, best, format]

stocks:
  capabilities:
    unit: cases
    description: benchmark cases squeeze meets, what the product can do
    sensor:
      projection: case
      state: met
      every: 10s
  # How good squeeze is on the cases, as points: the percentage fewer kilobytes per megapixel it needs
  # than squeeze as handed over (the first release measured), so higher is better and the seed is 0.
  # A score keeps its value until a release changes the code: a stock, changed by what releases gain
  # and lose.
  benchmark-points:
    unit: points
    description: "% fewer KB/MP than squeeze as handed over, on all thirty cases (the KB/MP itself: the geometric mean, 300 for a case it cannot do; bench.py prints both); higher is better"
    sensor:                                # runs the benchmark on a new release (else reads the last result),
      run: bin/py world/bench.py           # and records each case it measured: case.met, case.unmet
      every: 20s
      timeout: 10m
  photo-points:
    unit: points
    description: the same, on the fifteen photos (photos, big photos, grayscale photos)
    sensor:
      run: bin/py world/bench.py --read photo_points
      every: 20s
  flat-points:
    unit: points
    description: the same, on the fifteen flat images (screenshots, line art, logos)
    sensor:
      run: bin/py world/bench.py --read flat_points
      every: 20s

auxiliaries:
  cases-per-release:
    unit: cases/hypothesis
    exogenous: true
    description: the cases a kept release newly meets, each release's own (the benchmark finds them once it is out); not measured
                 apart, so the gain per release is not known before it
flows:
  gained:
    to: capabilities
    driven-by:                            # a release that does something it could not (measured as it is released)
      - {cause: +flow.kept, instant: true}
      - +auxiliary.cases-per-release
    sensor:
      projection: case
      entering: met
      over: 30m
  lost:
    from: capabilities                     # a release that breaks something it could: the rollback refuses a candidate that
                                           # loses a case production meets, so nothing in the model drives this (a disturbance)
    sensor:
      projection: case
      leaving: met
      over: 30m
  benchmark-points-gained:
    to: benchmark-points
    driven-by: {cause: +flow.kept, instant: true}   # what a release does better (measured as it is released)
    sensor:                               # the points releases gained: the score's rises, per hour over 30 minutes
      changes: rises
      over: 30m
      every: 20s
  benchmark-points-lost:
    from: benchmark-points                         # to outside: what a release does worse (its causes not yet modelled)
    sensor:
      changes: falls
      over: 30m
      every: 20s
  photo-points-gained:
    to: photo-points
    driven-by: {cause: +flow.kept, instant: true}   # what a release does better (measured as it is released)
    sensor:                               # the points releases gained: the score's rises, per hour over 30 minutes
      changes: rises
      over: 30m
      every: 20s
  photo-points-lost:
    from: photo-points                         # to outside: what a release does worse (its causes not yet modelled)
    sensor:
      changes: falls
      over: 30m
      every: 20s
  flat-points-gained:
    to: flat-points
    driven-by: {cause: +flow.kept, instant: true}   # what a release does better (measured as it is released)
    sensor:                               # the points releases gained: the score's rises, per hour over 30 minutes
      changes: rises
      over: 30m
      every: 20s
  flat-points-lost:
    from: flat-points                         # to outside: what a release does worse (its causes not yet modelled)
    sensor:
      changes: falls
      over: 30m
      every: 20s

goals:
  every-case:
    stock: capabilities
    hold: ">= 30"
    description: the lab's other target, what squeeze can do (some noisy photos may stay out of reach)

