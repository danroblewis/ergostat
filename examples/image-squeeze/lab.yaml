# The lab: hypotheses about what would make images smaller, proposed and built one at a time.
# The researcher and the developer are AI agents (FACTORY_AI=claude: Claude Code sessions) or
# stand-ins that work from a fixed notebook of ideas (bin/ideas.py).
defaults:
  system: lab

items:
  hypothesis:
    id: hypothesis/*
    states: [proposed, building, testing, kept, dropped]
    on:
      hypothesis.started: building
      hypothesis.testing: testing
      hypothesis.kept: kept
      hypothesis.dropped: dropped
    show: [title, by]
  release:
    id: release/*
    show: [hypothesis, commit]
  session:                                 # each Claude Code session the researcher or developer ran
    id: session/*
    show: [role, model, cost_usd, turns, seconds, error]

variables:
  ai-spend:
    unit: USD
    description: what the Claude Code sessions have cost so far (FACTORY_AI=claude)
    sensor:
      run: bin/py world/read.py ai-spend
      every: 30s

stocks:
  ideas:
    unit: hypotheses
    description: proposed, waiting to be built
    sensor:
      items: hypothesis
      state: proposed
      every: 5s
  building:
    unit: hypotheses
    description: claimed by the developer, not yet submitted (one left here by a session that stopped is picked up again)
    sensor:
      items: hypothesis
      state: building
      every: 5s
  experiments:
    unit: hypotheses
    description: running against production (one at a time, for there is one candidate)
    sensor:
      items: hypothesis
      state: testing
      every: 5s
  improvements:
    unit: hypotheses
    description: kept, and now part of production
    sensor:
      items: hypothesis
      state: kept
      every: 5s

flows:
  proposed:
    to: ideas
  started:
    from: ideas
    to: building
  submitted:
    from: building
    to: experiments
  abandoned:
    from: building
  kept:
    from: experiments
    to: improvements
  dropped:
    from: experiments

goals:
  ideas-ready:
    stock: ideas
    hold: ">= 2"
    description: there is always something to try next
  one-running:
    stock: experiments
    hold: ">= 1"
    description: an experiment is always running; while none is, the developer builds (or finishes) one

blocks:
  researcher:
    type: ai
    goal: ideas-ready
    prompt: prompts/researcher.md
    run: bin/ai.sh researcher               # FACTORY_AI=claude: a Claude Code session; otherwise a stand-in
    in: [variable.bytes-per-mp, stock.capabilities, variable.benchmark-score]   # what it is trying to improve
    max: 1
    timeout: 15m
    out: flow.proposed
  developer:
    type: ai
    goal: one-running
    prompt: prompts/developer.md
    run: bin/ai.sh developer
    in: stock.ideas
    max: 1
    timeout: 20m
    out:
      started: flow.started
      submitted: flow.submitted
      abandoned: flow.abandoned
