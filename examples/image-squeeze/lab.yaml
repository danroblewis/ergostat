# The lab: hypotheses about what would make images smaller, proposed and built one at a time.
# The researcher and the developer are AI agents (FACTORY_AI=claude: Claude Code sessions) or
# stand-ins that work from a fixed notebook of ideas (bin/ideas.py).
defaults:
  system: lab

items:
  hypothesis:
    id: hypothesis/*
    states: [proposed, building, testing, kept, dropped]
    on:
      hypothesis.started: building
      hypothesis.testing: testing
      hypothesis.kept: kept
      hypothesis.dropped: dropped
    show: [title, idea, by]
  release:
    id: release/*
    show: [hypothesis, commit]
  session:                                 # each Claude Code session the researcher or developer runs
    id: session/*
    states: [open, done, failed, lost]     # lost: killed or crashed before it could say how it ended
    on:
      session.ran: done
      session.failed: failed
      session.lost: lost
    show: [role, model, cost_usd, turns, seconds, transcript]
    formats:
      transcript: claude-session           # its page shows the conversation, live while it runs; ergostat records
                                           # each line as an event about it (claude.message, claude.tool-use, ...)
    fold:                                  # ... which fold it into its conversation: what was said, the tools it called
      messages: append                     # and what came back, appended in order; the tokens summed. cost_usd, turns
      tool_calls: append                   # and seconds stay as session.ran states them: once, for the whole run
      tool_results: append
      thinking: append
      tokens_in: sum
      tokens_out: sum

stocks:
  ai-spend:
    unit: USD
    description: what the Claude Code sessions have cost so far (FACTORY_AI=claude); it only grows, by what each session costs
    cumulative: true                    # a running total: nothing spent comes back
    sensor:
      run: bin/py world/read.py ai-spend
      every: 30s
  sessions:
    unit: sessions
    description: Claude Code sessions running now (FACTORY_AI=claude; at most one each for the researcher and the developer)
    sensor:
      items: session
      state: open
      every: 5s
  ideas:
    unit: hypotheses
    description: proposed, waiting to be built
    sensor:
      items: hypothesis
      state: proposed
      every: 5s
  building:
    unit: hypotheses
    description: claimed by the developer, not yet submitted (one left here by a session that stopped is picked up again)
    sensor:
      items: hypothesis
      state: building
      every: 5s
  experiments:
    unit: hypotheses
    description: running against production (one at a time, for there is one candidate)
    sensor:
      items: hypothesis
      state: testing
      every: 5s
  improvements:
    unit: hypotheses
    description: kept, and now part of production
    cumulative: true                    # every hypothesis kept so far: a kept one stays kept
    sensor:
      items: hypothesis
      state: kept
      every: 5s

flows:
  spending:
    to: ai-spend
    driven-by: +stock.sessions              # what the sessions running cost
    description: each session's cost, added when it ends
    sensor:
      changes: rises
      over: 30m
      every: 30s
  sessions-started:
    to: sessions
    sensor:
      items: session
      entering: open
      over: 30m
  sessions-ended:
    from: sessions
    sensor:
      items: session
      leaving: open
      over: 30m
  # The pipeline of hypotheses, an aging chain: each stage can only take what the one before holds
  # (the developer claims the oldest idea, and submits what it has built).
  proposed:
    to: ideas
  started:
    from: ideas
    to: building
    driven-by: +stock.ideas
  submitted:
    from: building
    to: experiments
    driven-by: +stock.building
  abandoned:
    from: building
  kept:                                    # set by the rollout (rollout.yaml)
    from: experiments
    to: improvements
    driven-by: +stock.experiments          # what is kept comes out of what is tested (the rollout decides when)
  dropped:                                 # set by the rollback, on its guards
    from: experiments

goals:
  ideas-ready:
    stock: ideas
    hold: ">= 2"
    description: there is always something to try next
  one-running:
    stock: experiments
    hold: ">= 1"
    description: an experiment is always running; while none is, the developer builds (or finishes) one

blocks:
  researcher:
    type: ai
    goal: ideas-ready
    prompt: prompts/researcher.md
    run: bin/ai.sh researcher               # FACTORY_AI=claude: a Claude Code session; otherwise a stand-in
    in:                                     # what it is trying to improve: it proposes only while one of them is off
      bytes: goal.small-images.off
      cases: goal.every-case.off
    max: 1
    timeout: 15m
    out: flow.proposed
  developer:
    type: ai
    goal: one-running
    prompt: prompts/developer.md
    run: bin/ai.sh developer                # takes the oldest idea (started follows the ideas waiting)
    max: 1
    timeout: 20m
    out:
      started: flow.started
      submitted: flow.submitted
      abandoned: flow.abandoned
