# The service: what customers get, measured on every image served (world/customers.py).
#
# Sorted by memory. What persists when nothing happens, and changes only through some process, is a
# stock. The encoder's quality setting stays where the tuner last stepped it. What was served is
# measured over the last 48 images, a window that keeps its value until new images enter it and old
# ones leave: so quality, bytes, failures and time are stocks too, each moved by one two-way flow,
# the window's turnover (system dynamics' smoothing is a stock for the same reason), measured from
# its own successive readings. The mix of images is a function of the clock, with no state of its
# own: an auxiliary, from outside the model.
defaults:
  system: service

auxiliaries:
  flat-share:
    unit: share
    exogenous: true
    description: how much of the mix is flat images (screenshots, line art, logos), which shifts every four minutes; an input from outside (the customers' clock), which the customers block reports

stocks:
  quality-setting:
    unit: q
    description: the encoder's quality, 5 to 95. It keeps its value until the tuner steps it (or a kept candidate's offset is adopted)
    sensor:
      run: bin/py world/read.py quality-setting
      every: 8s
  quality:
    unit: ssim
    description: how close what was served looks to its originals (1 is identical), the 10th percentile over the last 48 images, so nine images in ten look at least this good
    sensor:
      run: bin/py world/read.py quality
      every: 8s
  bytes-per-mp:
    unit: KB/MP
    description: kilobytes served per megapixel over the last 48 images, what the lab makes smaller
    sensor:
      run: bin/py world/read.py bytes-per-mp
      every: 8s
  failures:
    unit: "%"
    description: of the last 48 images, those the service could not compress
    sensor:
      run: bin/py world/read.py failures
      every: 8s
  time:
    unit: ms
    description: time to compress one image, 95th percentile over the last 48
    sensor:
      run: bin/py world/read.py time
      every: 8s

flows:
  quality-steps:
    to: quality-setting
    two-way: true
    description: the tuner's steps, up or down by the quality error
  quality-turnover:
    to: quality
    two-way: true
    description: images entering the window and leaving it, as they move its 10th percentile
    driven-by: [+stock.quality-setting, auxiliary.flat-share, stock.rollout-share, stock.improvements]
    sensor:
      changes: net
      over: 2m
      every: 8s
  bytes-turnover:
    to: bytes-per-mp
    two-way: true
    driven-by: [+stock.quality-setting, auxiliary.flat-share, stock.rollout-share, -stock.improvements]
    sensor:
      changes: net
      over: 2m
      every: 8s
  failures-turnover:
    to: failures
    two-way: true
    driven-by: +stock.rollout-share            # the candidate is the untried build: more of its traffic, more of its failures
    sensor:
      changes: net
      over: 2m
      every: 8s
  time-turnover:
    to: time
    two-way: true
    driven-by: [stock.rollout-share, auxiliary.flat-share]
    sensor:
      changes: net
      over: 2m
      every: 8s

goals:
  quality-held:
    stock: quality
    hold: "== 0.93"
    tolerance: 0.01
    description: images look as good as they should, and no better (better costs bytes)
  small-images:
    stock: bytes-per-mp
    hold: "<= 20"
    description: the lab's target, far below where squeeze starts
  no-failures:
    stock: failures
    hold: "<= 0"
    critical: true
  fast-enough:
    stock: time
    hold: "<= 120"

blocks:
  customers:                               # the world: images arrive, are served, are judged; the mix shifts
    type: program
    run: bin/py world/customers.py
    every: 8s
    out: auxiliary.flat-share
  tuner:                                   # integral control: the quality setting (a stock) is stepped by the quality error
    type: program
    run: bin/py bin/lab.py tune
    in: goal.quality-held.error
    every: 16s                             # two batches of fresh images between moves
    out: flow.quality-steps
