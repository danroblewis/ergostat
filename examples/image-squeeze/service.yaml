# The service: what customers get, measured on every image served (world/customers.py).
defaults:
  system: service

variables:
  quality:
    unit: ssim
    description: how close what was served looks to its originals (1 is identical), the 10th percentile, so nine images in ten look at least this good
    sensor:
      run: bin/py world/read.py quality
      every: 8s
    driven-by: [variable.quality-setting, variable.flat-share, variable.rollout-share, stock.improvements]
  bytes-per-mp:
    unit: KB/MP
    description: kilobytes served per megapixel, what the lab makes smaller
    sensor:
      run: bin/py world/read.py bytes-per-mp
      every: 8s
    driven-by: [variable.quality-setting, variable.flat-share, variable.rollout-share, stock.improvements]
  failures:
    unit: "%"
    description: images the service could not compress
    sensor:
      run: bin/py world/read.py failures
      every: 8s
    driven-by: variable.rollout-share
  time:
    unit: ms
    description: time to compress one image, 95th percentile
    sensor:
      run: bin/py world/read.py time
      every: 8s
    driven-by: [variable.rollout-share, variable.flat-share]
  quality-setting:
    unit: q
    description: the encoder's quality, 5 to 95, which the tuner turns
  flat-share:
    unit: share
    description: how much of the mix is flat images (screenshots, line art, logos), which shifts every four minutes

goals:
  quality-held:
    variable: quality
    hold: "== 0.93"
    tolerance: 0.01
    description: images look as good as they should, and no better (better costs bytes)
  small-images:
    variable: bytes-per-mp
    hold: "<= 20"
    description: the lab's target, far below where squeeze starts
  no-failures:
    variable: failures
    hold: "<= 0"
    critical: true
  fast-enough:
    variable: time
    hold: "<= 120"

blocks:
  customers:                               # the world: images arrive, are served, are judged; the mix shifts
    type: program
    run: bin/py world/customers.py
    every: 8s
    out: variable.flat-share
  tuner:                                   # integral control: the quality setting moves by the quality error
    type: program
    run: bin/py bin/lab.py tune
    in: goal.quality-held.error
    every: 16s                             # two batches of fresh images between moves
    out: variable.quality-setting
