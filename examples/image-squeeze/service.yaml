# The service: what customers get, measured on every image served (world/customers.py).
#
# Sorted by memory. What persists when nothing happens, and changes only through some process, is a
# stock. The encoder's quality setting stays where the tuner last stepped it. What was served is
# measured over the last 48 images, a window that keeps its value until new images enter it and old
# ones leave: so quality, bytes, failures and time are stocks too, system dynamics' first-order
# smoothing. Each is moved by one two-way flow, its turnover, which closes the gap between what the
# batch just served has (an auxiliary: the ten images of one tick, a momentary quantity) and what the
# window holds, over the window's length (about five batches, 40 seconds). What changes what is
# served drives the batch, never the window directly. The mix of images is a function of the clock,
# with no state of its own: an auxiliary, from outside the model.
defaults:
  system: service

auxiliaries:
  flat-share:
    unit: share
    exogenous: true
    description: how much of the mix is flat images (screenshots, line art, logos), which shifts every four minutes; an input from outside (the customers' clock), which the customers block reports
  # What the batch just served has: what the setting, the code kept so far (as the benchmark measures
  # it: + on quality and - on bytes, for a release is kept only for fewer bytes at equal quality or for
  # looking better) and the candidate's share make of the images arriving now. The candidate is given
  # traffic only while it looks as good and saves bytes, and it is the untried build: its failures and
  # its time (what saves bytes mostly spends time) are what it adds. The mix's effect has no one sign
  # (flat images look perfect once logos are fixed and terrible before; big photos, the slow ones,
  # come and go in every phase): unsigned, and from outside, so in no loop.
  batch-quality:
    unit: ssim
    description: the 10th percentile SSIM of the batch just served (ten images)
    sensor:
      run: bin/py world/read.py batch-quality
      every: 8s
    driven-by: [+stock.quality-setting, +stock.benchmark-points, +stock.rollout-share, auxiliary.flat-share]
  batch-bytes:
    unit: KB/MP
    description: kilobytes per megapixel of the batch just served
    sensor:
      run: bin/py world/read.py batch-bytes
      every: 8s
    driven-by: [+stock.quality-setting, -stock.benchmark-points, -stock.rollout-share, auxiliary.flat-share]
  batch-failures:
    unit: "%"
    description: of the batch just served, the images the service could not compress
    sensor:
      run: bin/py world/read.py batch-failures
      every: 8s
    driven-by: +stock.rollout-share
  batch-time:
    unit: ms
    description: the slowest image of the batch just served
    sensor:
      run: bin/py world/read.py batch-time
      every: 8s
    driven-by: [+stock.rollout-share, auxiliary.flat-share]

stocks:
  quality-setting:
    unit: q
    description: the encoder's quality, 5 to 95. It keeps its value until the tuner steps it (or a kept candidate's offset is adopted)
    sensor:
      run: bin/py world/read.py quality-setting
      every: 8s
  quality:
    unit: ssim
    description: how close what was served looks to its originals (1 is identical), the 10th percentile over the last 48 images, so nine images in ten look at least this good
    sensor:
      run: bin/py world/read.py quality
      every: 8s
  bytes-per-mp:
    unit: KB/MP
    description: kilobytes served per megapixel over the last 48 images, what the lab makes smaller
    sensor:
      run: bin/py world/read.py bytes-per-mp
      every: 8s
  failures:
    unit: "%"
    description: of the last 48 images, those the service could not compress
    sensor:
      run: bin/py world/read.py failures
      every: 8s
  time:
    unit: ms
    description: time to compress one image, 95th percentile over the last 48
    sensor:
      run: bin/py world/read.py time
      every: 8s

# The windows' lag, from the code (world/customers.py): the last 48 images, ten served a batch, a batch every
# 8 seconds, so the window is 4.8 batches long, 38.4 s. A moving average over the last L lags what it
# averages by L/2 on average, half its length (Sterman ch. 11.5); a first-order smoothing lags by its time
# constant. So the smoothing that has the window's lag has a time of L/2, 19.2 s: not the 38.4 s an image
# stays in the window. Quality and time are percentiles over the window, not means, so first-order smoothing
# is only near: estimated from the record.
parameters:
  window-time:
    value: 19.2s
    estimate: true
    range: [9.6s, 38.4s]                       # a percentile lags less, or more, than a mean: a quarter of the window to all of it
    description: the window's average lag, half its 38.4 s (the last 48 images served)

flows:
  quality-steps:
    to: quality-setting
    two-way: true
    description: the tuner's steps, up or down by the quality error
  # Each window's turnover: (the batch − the window) / the window's length, first-order smoothing
  quality-turnover:
    to: quality
    two-way: true
    description: images entering the window and leaving it, as they move its 10th percentile
    driven-by: [+auxiliary.batch-quality, -stock.quality]
    equation: (auxiliary.batch-quality - stock.quality) / window-time
    sensor:
      changes: net
      over: 2m
      every: 8s
  bytes-turnover:
    to: bytes-per-mp
    two-way: true
    driven-by: [+auxiliary.batch-bytes, -stock.bytes-per-mp]
    equation: (auxiliary.batch-bytes - stock.bytes-per-mp) / window-time
    sensor:
      changes: net
      over: 2m
      every: 8s
  failures-turnover:
    to: failures
    two-way: true
    driven-by: [+auxiliary.batch-failures, -stock.failures]
    equation: (auxiliary.batch-failures - stock.failures) / window-time
    sensor:
      changes: net
      over: 2m
      every: 8s
  time-turnover:
    to: time
    two-way: true
    driven-by: [+auxiliary.batch-time, -stock.time]
    equation: (auxiliary.batch-time - stock.time) / window-time
    sensor:
      changes: net
      over: 2m
      every: 8s

goals:
  quality-held:
    stock: quality
    hold: "== 0.93"
    tolerance: 0.01
    description: images look as good as they should, and no better (better costs bytes)
  small-images:
    stock: bytes-per-mp
    hold: "<= 20"
    description: the lab's target, far below where squeeze starts
  no-failures:
    stock: failures
    hold: "<= 0"
    critical: true
  fast-enough:
    stock: time
    hold: "<= 120"

blocks:
  customers:                               # the world: images arrive, are served, are judged; the mix shifts
    type: program
    run: bin/py world/customers.py
    every: 8s
    out: auxiliary.flat-share
  tuner:                                   # integral control: the quality setting (a stock) is stepped by the quality error
    type: program
    run: bin/py bin/lab.py tune
    in: goal.quality-held.error
    every: 16s                             # two batches of fresh images between moves
    gain: 350                              # q per unit of error, each step: u ← u + 350 e (its program reads it)
    deadband: 0.004                        # no step while |e| is within it
    resolution: 0.1                        # q is rounded to this
    limits: [5, 95]                        # the encoder's quality range
    out: flow.quality-steps
