# squeeze, and the lab that improves it: a service that compresses the images customers send, and
# AI agents (or stand-ins) who try ideas to make them smaller, kept only when live traffic shows
# they are. Three systems, three loops, fastest first:
#
#   service   the quality loop: a tuner turns the encoder's quality so what is served looks as good
#             as it should (0.95 SSIM), whatever the mix of images (service.yaml)
#   rollout   the experiment: a candidate build runs on the same images as production; a matcher
#             turns its quality until it looks just as good, and the rollout gives it more traffic
#             while it saves bytes, keeps it, or rolls it back (rollout.yaml)
#   lab       the research: hypotheses proposed, built and tested one at a time (lab.yaml)
#   modelling the model of all this, improved by a loop of its own (model.yaml)
#             (and the owner's notes to it while it works, routed and delivered: messages.yaml)
#   (lab)     finished work held to what the owner decided, before the rollout may keep it (intent.yaml)
#
# and the benchmark (benchmark.yaml): thirty fixed cases measured on every release, the count of
# those squeeze meets a stock (capabilities), and how good it is on them a stock too (benchmark-points:
# it keeps its value until a release changes the code).
#
# README.md walks the loops.
name: image-squeeze
include:
  - service.yaml
  - rollout.yaml
  - lab.yaml
  - benchmark.yaml
  - model.yaml
  - messages.yaml
  - intent.yaml
systems:
  service:
    description: squeeze, serving the images customers send
    show: [stock.quality, stock.bytes-per-mp, stock.failures, stock.time]
  rollout:
    description: one candidate build against production, on the same images
    show: [stock.rollout-share, auxiliary.bytes-saved, auxiliary.quality-change, stock.paired]
  lab:
    description: hypotheses proposed, built and tested
    show: [stock.sessions, stock.ideas, stock.experiments, stock.improvements, stock.ai-spend]
  benchmark:
    description: thirty fixed cases, measured on every release (what squeeze can do)
    show: [stock.capabilities, stock.benchmark-points, stock.photo-points, stock.flat-points]
  modelling:
    description: the model of all this, improved as a loop of its own (model.yaml)
    show: [stock.model-error, stock.pending-changes, stock.changes-testing, stock.accepted-changes]
  regressions:
    description: the guarantees that squeeze's tests pass and the model's changes hold (lab.yaml, use regressions)

