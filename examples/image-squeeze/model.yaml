# The model of squeeze, improved as a loop of its own (ergostat's SPEC §12e), from ergostat's template `modelling`.
# The model's fit to the record is measured like anything else (model-error: the scaled error of its replay,
# ergostat's built-in measure ergostat.model.fit); a goal holds it (model-fits); while it is off the improver reviews
# the model, as a senior modeller would, and proposes changes with their evidence (propose lines). Every change to
# the model, the improver's and ergostat's own (calibration, structure, simplification) alike, is an item of
# ergostat's built-in kind ergostat.model-change (made → checked → testing → passed → accepted; or refused, failed,
# dismissed, superseded): Items → ergostat.model-change, and the review queue on the Fit page. The judge (a built-in
# block) replays each on the record that comes after it, beside the model as it is, all of it pooled, and passes it
# only when it is better beyond the record's noise. A passed change to a parameter's value is written at once; a change to the
# structure waits for the owner. What it makes: docs/ADDING.md (modelling).
#
# The improver is an ordinary ai block: a Claude Code session with ergostat's tools (FACTORY_AI=claude,
# prompts/improver.md), or a free stand-in that proposes what ergostat declined (bin/standin_improver.py).
uses:
  modelling:
    use: modelling
    with:
      fit: 0.02                               # the replay's scaled error at most 0.02
      prompt: prompts/improver.md
      run: bin/ai.sh improver                 # FACTORY_AI=claude: a Claude Code session with ergostat's tools; otherwise a stand-in
      hold-out: 4m                            # each change judged on four minutes of record after it was made ...
      windows: [1, 2, 4]                      # ... shown whole, in halves and in quarters
      threshold: 2%                           # passed when better by 2%, beyond the record's noise
      accept:
        parameter: auto                       # a value passed is written at once; the structure waits for the owner
