# The model of squeeze, improved as a loop of its own (ergostat's SPEC §12e). The model's fit to the record is
# measured like anything else (model-error: the scaled error of its replay, ergostat's built-in measure
# ergostat.model.fit); a goal holds it; while it is off the improver reviews the model, as a senior modeller
# would, and proposes changes with their evidence (propose lines). Every change to the model, the improver's and
# ergostat's own (calibration, structure, simplification) alike, is an item of ergostat's built-in kind
# ergostat.model-change (made → checked → testing → passed → accepted; or refused, failed, dismissed,
# superseded): Items → ergostat.model-change, and the review queue on the Fit page. The judge (a built-in block)
# replays each on the record that comes after it, beside the model as it is, in several windows, and passes it
# only when it is better in every one. A passed change to a parameter's value is written at once; a change to the
# structure waits for the owner.
#
# The improver is an ordinary ai block: a Claude Code session with ergostat's tools (FACTORY_AI=claude,
# prompts/improver.md), or a free stand-in that proposes what ergostat declined (bin/standin_improver.py).
defaults:
  system: modelling

stocks:
  model-error:
    unit: "1"
    description: the scaled error of the model's replay on the record (the Fit page's total; lower is better)
    sensor:
      builtin: ergostat.model.fit
      every: 1m
  pending-changes:
    unit: changes
    description: changes to the model made and checked, waiting for the judge
    sensor:
      items: ergostat.model-change
      state: checked
      every: 10s
  changes-testing:
    unit: changes
    description: changes being replayed on the record that comes after them
    sensor:
      items: ergostat.model-change
      state: testing
      every: 10s
  passed-changes:
    unit: changes
    description: passed by the judge, waiting to be written (by the owner, for a change to the structure)
    sensor:
      items: ergostat.model-change
      state: passed
      every: 10s
  accepted-changes:
    unit: changes
    description: changes accepted and written into the model
    cumulative: true                          # every change written so far
    sensor:
      items: ergostat.model-change
      state: accepted
      every: 10s

flows:
  model-drift:                                # the record moving on, and squeeze changing under the model: nothing in the model drives it
    to: model-error
    sensor:
      changes: rises
      over: 10m
      every: 1m
  model-mended:
    from: model-error
    driven-by:                                # a change written lowers the error at once; the more error, the more there is to mend
      - +stock.model-error
      - {cause: +flow.changes-accepted, instant: true}
    sensor:
      changes: falls
      over: 10m
      every: 1m
  changes-made:
    to: pending-changes
    sensor:
      items: ergostat.model-change
      entering: checked
      over: 10m
  changes-superseded:                         # made against a version of the model since changed
    from: pending-changes
    driven-by: +stock.pending-changes
    sensor:
      items: ergostat.model-change
      entering: superseded
      over: 10m
  tests-started:
    from: pending-changes
    to: changes-testing
    driven-by: +stock.pending-changes
    sensor:
      items: ergostat.model-change
      entering: testing
      over: 10m
  changes-passed:
    from: changes-testing
    to: passed-changes
    driven-by: +stock.changes-testing
    sensor:
      items: ergostat.model-change
      entering: passed
      over: 10m
  changes-failed:
    from: changes-testing
    driven-by: +stock.changes-testing
    sensor:
      items: ergostat.model-change
      entering: failed
      over: 10m
  changes-accepted:
    from: passed-changes
    to: accepted-changes
    driven-by: +stock.passed-changes
    sensor:
      items: ergostat.model-change
      entering: accepted
      over: 10m

goals:
  model-fits:
    stock: model-error
    hold: "<= 0.02"
    description: the model follows the record (its replay's scaled error at most 0.02)

blocks:
  improver:
    type: ai
    goal: model-fits
    prompt: prompts/improver.md
    run: bin/ai.sh improver                   # FACTORY_AI=claude: a Claude Code session with ergostat's tools; otherwise a stand-in
    every: 3m
    timeout: 15m
    out: flow.changes-made
  judge:
    type: judge                               # ergostat's judge (SPEC §12e): each change replayed on the record after it
    every: 30s
    hold-out: 4m                              # judged on four minutes of record after it was made ...
    windows: [1, 2, 4]                        # ... whole, in halves and in quarters
    threshold: 2%                             # passed when better by 2% in every one
    accept:
      parameter: auto                         # a value passed is written at once; the structure waits for the owner
    in:
      waiting: +stock.pending-changes
      testing: +stock.changes-testing
    out:
      testing: flow.tests-started
      passed: flow.changes-passed
      failed: flow.changes-failed
      accepted: flow.changes-accepted
