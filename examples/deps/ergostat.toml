# Dependencies kept current: a program opens update pull requests; a person reviews them.
# The person has fallen behind, so the review loop is off.
name = "deps"

[[system]]
name = "deps"
description = "third-party packages"

[[stock]]
name = "outdated-deps"
unit = "packages"
systems = ["deps"]

[[disturbance]]
name = "new-releases"
into = "outdated-deps"
description = "upstream projects release new versions"

[[flow]]
name = "update-opened"
from = "outdated-deps"
to = "update-prs-open"

[[stock]]
name = "update-prs-open"
unit = "PRs"
systems = ["deps"]
description = "update pull requests waiting for review"

[[flow]]
name = "update-merged"
from = "update-prs-open"

[[sensor]]
name = "dep-audit"
measures = "outdated-deps"
agent = "updater"

[[controller]]
name = "deps-current"
holds = "outdated-deps"
setpoint = "<= 5"
reads = ["dep-audit"]
drives = ["open-update-pr"]
agent = "updater"

[[valve]]
name = "open-update-pr"
flow = "update-opened"
agent = "updater"
max = 2                   # the updater opens at most two update PRs a run

[[sensor]]
name = "pr-counter"
measures = "update-prs-open"
agent = "updater"

[[controller]]
name = "reviews-flowing"
holds = "update-prs-open"
setpoint = "<= 4"
reads = ["pr-counter"]
drives = ["merge-update"]
agent = "maintainer"
description = "a person reviews and merges when they can"

[[valve]]
name = "merge-update"
flow = "update-merged"
mode = "manual"
agent = "maintainer"

[[agent]]
name = "updater"
kind = "program"
command = "python3 updater.py"
every = "3s"
description = "audits packages and opens one update PR at a time"

[[agent]]
name = "maintainer"
kind = "person"
description = "reviews update PRs between other work"
