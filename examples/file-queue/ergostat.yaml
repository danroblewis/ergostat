# A folder used as a queue: files land in inbox/, a processor moves them to outbox/, and an
# archiver keeps outbox/ small. Plain shell scripts on real files; no simulation.
name: file-queue

projections:
  file:                          # each file, from the inbox to the archive: file/note-1767000000-123-0.txt
    id: file/*
    states: [inbox, outbox, archived]
    on:
      file.processed: outbox
      file.archived: archived
    show: [file]                 # where it is now: the Items page shows the file itself

stocks:
  inbox:
    unit: files
    description: files waiting in inbox/
    sensor:
      run: mkdir -p inbox; ls inbox | wc -l
      every: 3s
  outbox:
    unit: files
    description: processed files, kept for a while
    sensor:
      run: mkdir -p outbox; ls outbox | wc -l
      every: 5s

flows:
  drops:                         # people put files in; nothing controls when
    to: inbox
  processed:
    from: inbox
    to: outbox
  archived:
    from: outbox

goals:
  inbox-empty:
    stock: inbox
    hold: "<= 5"
    tolerance: 2                 # off only past 7
  outbox-small:
    stock: outbox
    hold: "<= 20"

blocks:
  process-files:                 # runs while inbox-empty is off, once per fresh reading
    type: program
    goal: inbox-empty
    run: bin/process.sh
    out: flow.processed
    description: uppercases up to three files and moves them to outbox/

  archive-oldest:                # runs while outbox-small is off, until outbox/ is down to 10
    type: program
    goal: outbox-small
    until: "<= 10"
    run: bin/archive.sh
    out: flow.archived
    description: moves the five oldest files in outbox/ to archive/

  dropper:                       # the load: stands in for the people who drop files
    type: program
    run: bin/drop.sh
    every: 2s
    out: flow.drops

uses:
  modelling:
    use: modelling                    # the model improved as a loop of its own: what check finds is its work (SPEC §12e)
