# A folder used as a queue: files land in inbox/, a processor moves them to outbox/, and an
# archiver keeps outbox/ small. Plain shell scripts on real files; no simulation.
name = "file-queue"

[[system]]
name = "intake"
description = "files people drop in, and what is done with them"

[[stock]]
name = "inbox"
unit = "files"
systems = ["intake"]
description = "files waiting in inbox/"

[[disturbance]]
name = "drops"
into = "inbox"
agent = "dropper"
description = "people (here: the dropper) put files in; nothing controls when"

[[flow]]
name = "processed"
from = "inbox"
to = "outbox"

[[stock]]
name = "outbox"
unit = "files"
systems = ["intake"]
description = "processed files, kept for a while"

[[flow]]
name = "archived"
from = "outbox"

[[sensor]]
name = "inbox-count"
measures = "inbox"
agent = "processor"

[[controller]]
name = "inbox-empty"
holds = "inbox"
setpoint = "<= 5"
tolerance = 2
reads = ["inbox-count"]
drives = ["process-files"]
agent = "processor"

[[valve]]
name = "process-files"
flow = "processed"
agent = "processor"
description = "uppercases each file's contents and moves it to outbox/, three at a time"

[[sensor]]
name = "outbox-count"
measures = "outbox"
agent = "counter"

[[controller]]
name = "outbox-small"
holds = "outbox"
setpoint = "<= 20"
reads = ["outbox-count"]
drives = ["archive-oldest"]
agent = "archiver"

[[valve]]
name = "archive-oldest"
flow = "archived"
agent = "archiver"

[[agent]]
name = "processor"
kind = "program"
command = "bin/process.sh"
every = "3s"

[[agent]]
name = "counter"
kind = "program"
command = "bin/count.sh"
every = "5s"

[[agent]]
name = "archiver"
kind = "rule"
command = "bin/archive.sh"
cron = "* * * * *"
description = "once a minute: over 20 in outbox/, archive the oldest down to 10"

[[agent]]
name = "dropper"
kind = "program"
command = "bin/drop.sh"
every = "2s"
description = "stands in for the people who drop files: an agent that is a disturbance, filling no role"
