# support: work arrives at support-q0 and passes down a chain of four queues; each queue has
# a goal, and a worker that drains it while the goal is off.
defaults:
  system: support

stocks:
  support-q0:
    sensor:
      run: python3 tick.py count support-q0
      every: 4s
  support-q1:
    sensor:
      run: python3 tick.py count support-q1
      every: 4s
  support-q2:
    sensor:
      run: python3 tick.py count support-q2
      every: 4s
  support-q3:
    sensor:
      run: python3 tick.py count support-q3
      every: 4s

flows:
  support-q0-in:
    to: support-q0
  support-q0-out:
    from: support-q0
    to: support-q1
  support-q1-out:
    from: support-q1
    to: support-q2
  support-q2-out:
    from: support-q2
    to: support-q3
  support-q3-out:
    from: support-q3

goals:
  support-q0-low:
    stock: support-q0
    hold: "<= 5"
  support-q1-low:
    stock: support-q1
    hold: "<= 5"
  support-q2-low:
    stock: support-q2
    hold: "<= 5"
  support-q3-low:
    stock: support-q3
    hold: "<= 10"

blocks:
  support-arrivals:                # the load: acts on its own, nothing commands it
    type: program
    run: python3 tick.py arrive support-q0
    every: 4s
    out: flow.support-q0-in
  support-q0-drain:
    type: program
    goal: support-q0-low
    run: python3 tick.py drain support-q0 support-q1
    out: flow.support-q0-out
  support-q1-drain:
    type: program
    goal: support-q1-low
    run: python3 tick.py drain support-q1 support-q2
    out: flow.support-q1-out
  support-q2-drain:
    type: program
    goal: support-q2-low
    run: python3 tick.py drain support-q2 support-q3
    out: flow.support-q2-out
  support-q3-drain:
    type: program
    goal: support-q3-low
    run: python3 tick.py drain support-q3
    out: flow.support-q3-out
