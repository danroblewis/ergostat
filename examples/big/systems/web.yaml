# web: work arrives at web-q0 and passes down a chain of four queues; each queue has
# a goal, and a worker that drains it while the goal is off.
defaults:
  system: web

stocks:
  web-q0:
    sensor:
      run: python3 tick.py count web-q0
      every: 4s
  web-q1:
    sensor:
      run: python3 tick.py count web-q1
      every: 4s
  web-q2:
    sensor:
      run: python3 tick.py count web-q2
      every: 4s
  web-q3:
    sensor:
      run: python3 tick.py count web-q3
      every: 4s

flows:
  web-q0-in:
    to: web-q0
  web-q0-out:
    from: web-q0
    to: web-q1
  web-q1-out:
    from: web-q1
    to: web-q2
  web-q2-out:
    from: web-q2
    to: web-q3
  web-q3-out:
    from: web-q3

goals:
  web-q0-low:
    stock: web-q0
    hold: "<= 5"
  web-q1-low:
    stock: web-q1
    hold: "<= 20"
  web-q2-low:
    stock: web-q2
    hold: "<= 5"
  web-q3-low:
    stock: web-q3
    hold: "<= 5"

blocks:
  web-arrivals:                # the load: acts on its own, nothing commands it
    type: program
    run: python3 tick.py arrive web-q0
    every: 4s
    out: flow.web-q0-in
  web-q0-drain:
    type: program
    goal: web-q0-low
    run: python3 tick.py drain web-q0 web-q1
    out: flow.web-q0-out
  web-q1-drain:
    type: program
    goal: web-q1-low
    run: python3 tick.py drain web-q1 web-q2
    out: flow.web-q1-out
  web-q2-drain:
    type: program
    goal: web-q2-low
    run: python3 tick.py drain web-q2 web-q3
    out: flow.web-q2-out
  web-q3-drain:
    type: program
    goal: web-q3-low
    run: python3 tick.py drain web-q3
    out: flow.web-q3-out
