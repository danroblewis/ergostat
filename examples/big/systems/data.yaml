# data: work arrives at data-q0 and passes down a chain of four queues; each queue has
# a goal, and a worker that drains it while the goal is off.
defaults:
  system: data

stocks:
  data-q0:
    sensor:
      run: python3 tick.py count data-q0
      every: 4s
  data-q1:
    sensor:
      run: python3 tick.py count data-q1
      every: 4s
  data-q2:
    sensor:
      run: python3 tick.py count data-q2
      every: 4s
  data-q3:
    sensor:
      run: python3 tick.py count data-q3
      every: 4s

flows:
  data-q0-in:
    to: data-q0
  data-q0-out:
    from: data-q0
    to: data-q1
  data-q1-out:
    from: data-q1
    to: data-q2
  data-q2-out:
    from: data-q2
    to: data-q3
  data-q3-out:
    from: data-q3

goals:
  data-q0-low:
    stock: data-q0
    hold: "<= 5"
  data-q1-low:
    stock: data-q1
    hold: "<= 5"
  data-q2-low:
    stock: data-q2
    hold: "<= 10"
  data-q3-low:
    stock: data-q3
    hold: "<= 20"

blocks:
  data-arrivals:                # the load: acts on its own, nothing commands it
    type: program
    run: python3 tick.py arrive data-q0
    every: 4s
    out: flow.data-q0-in
  data-q0-drain:
    type: program
    goal: data-q0-low
    run: python3 tick.py drain data-q0 data-q1
    out: flow.data-q0-out
  data-q1-drain:
    type: program
    goal: data-q1-low
    run: python3 tick.py drain data-q1 data-q2
    out: flow.data-q1-out
  data-q2-drain:
    type: program
    goal: data-q2-low
    run: python3 tick.py drain data-q2 data-q3
    out: flow.data-q2-out
  data-q3-drain:
    type: program
    goal: data-q3-low
    run: python3 tick.py drain data-q3
    out: flow.data-q3-out
