# Small requests, each one template (docs/ADDING.md): an engineer's standing requests, written as uses. Every one
# runs offline on its free stand-ins (a made-up feed, a pretend answer, a level that creeps up) until it is given
# the real thing under with:.
name: small-requests
systems:
  work:
    description: the small things I want kept going
uses:
  help-queue:                       # "draft an answer for each question in the help queue; none waits four hours"
    use: respond-to
    within: work
    with:
      within: 4h
      poll: 30s
  review-reminders:                 # "remind reviewers daily until they answer, three times, then hand it to me"
    use: re-ping
    within: work
    with:
      every: 1d
      limit: 3
  morning:                          # "every weekday at 8:30, a report of what is open"
    use: daily-report
    within: work
    with:
      cron: "30 8 * * 1-5"
  build-cache:                      # "keep the build cache under 20 GB; prune back to 15"
    use: keep-under
    within: work
    with:
      unit: GB
      limit: 20
      until: "<= 15"
  regressions:                      # "work each regression ticket through: label, find the culprit, draft a revert"
    use: steps
    within: work
    with:
      steps: [label, find-culprit, draft-revert]
