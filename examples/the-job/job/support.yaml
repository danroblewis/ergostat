# Customer support in the regulated environment (charter §3 G). Watched: the customer tickets assigned
# to me in the tracker. Prepared: for each, what the command it asks for does, checked against the
# ticket, and a recommendation. Mine: whether a command runs. Nothing here runs one against
# production or a customer's system; I decide, and I run it.
defaults:
  system: support

items:
  ticket:
    id: ticket/*
    description: a customer ticket assigned to me
    states: [new, explained, answered]
    on:
      ticket.explained: explained
      ticket.answered: answered
    show: [customer, title, asks, explanation]

stocks:
  tickets-to-explain:
    unit: tickets
    sensor:
      items: ticket
      state: new
      every: 5s
  tickets-explained:
    unit: tickets
    description: the command explained and checked, waiting for my decision
    sensor:
      items: ticket
      state: explained
      every: 5s

auxiliaries:
  tickets-late:
    unit: tickets
    description: tickets near their SLA (three quarters of a working day) with no response
    driven-by: [+stock.tickets-to-explain, +stock.tickets-explained]
    sensor:
      items: ticket
      state: [new, explained]
      where:
        late: "yes"
      every: 5s

flows:
  tickets-assigned:
    to: tickets-to-explain
    sensor:
      run: python3 bin/watch.py ticket
      every: 10s
  explaining:
    from: tickets-to-explain
    to: tickets-explained
    sensor:
      items: ticket
      entering: explained
      over: 10m
  tickets-answered:
    from: tickets-explained
    sensor:
      items: ticket
      entering: answered
      over: 10m

goals:
  every-ticket-explained:
    stock: tickets-to-explain
    hold: "<= 0"
    description: every customer ticket assigned to me has its command explained
  tickets-within-sla:
    auxiliary: tickets-late
    hold: "<= 0"
    critical: true
    owner: me
    description: every customer ticket assigned to me has a response within its SLA

blocks:
  command-explainer:
    type: ai
    goal: every-ticket-explained
    prompt: prompts/command-explainer.md
    run: python3 bin/prepare.py ticket-explain
    takes: {kind: ticket, at: new}
    pool: 2
    max: 1
    out: flow.explaining
  run-commands:
    type: person
    agent: me
    goal: tickets-within-sla
    ask: >-
      A customer ticket is near its SLA. What its command does, checked against the ticket, is in
      outbox/ticket-*.md. Decide whether it runs; if it does, run it yourself, then answer the customer.
    out: flow.tickets-answered
