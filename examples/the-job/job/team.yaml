# Team and leadership (charter §3 H). Watched: teammates' PRs, reported only once stale 3 working days;
# the calendar, for the weekly update due on Thursday. Prepared: a nudge for each stale PR (a program),
# the update drafted from the ledger. Mine: coaching, presenting, and the relationships.
defaults:
  system: team

items:
  team-pr:
    id: team-pr/*
    description: a teammate's PR, stale over 3 working days
    states: [stale, nudged, moving]
    on:
      team-pr.nudge-drafted: nudged
      team-pr.moving: moving
    show: [author, title, nudge]
  update:
    id: update/*
    description: the weekly update for my manager
    states: [due, drafted, sent]
    on:
      update.drafted: drafted
      update.sent: sent
    show: [week_of, due, draft]

stocks:
  team-prs-stale:
    unit: prs
    description: teammates' PRs stale over 3 days, no nudge drafted
    sensor:
      items: team-pr
      state: stale
      every: 5s
  updates-due:
    unit: updates
    description: this week's update, due and not drafted
    sensor:
      items: update
      state: due
      every: 5s

flows:
  team-prs-going-stale:
    to: team-prs-stale
    sensor:
      run: python3 bin/watch.py team-pr
      every: 10s
  team-nudges:
    from: team-prs-stale
    sensor:
      items: team-pr
      entering: nudged
      over: 10m
  updates-falling-due:
    to: updates-due
    sensor:
      run: python3 bin/watch.py update
      every: 10s
  update-drafting:
    from: updates-due
    sensor:
      items: update
      entering: drafted
      over: 10m

goals:
  team-prs-nudged:
    stock: team-prs-stale
    hold: "<= 0"
    description: no teammate PR is stale over 3 days without a nudge drafted
  update-drafted:
    stock: updates-due
    hold: "<= 0"
    description: this week's manager update is drafted by Thursday

blocks:
  team-nudge-drafter:
    type: program
    goal: team-prs-nudged
    run: python3 bin/prepare.py team-nudge
    max: 1
    every: 5s
    out: flow.team-nudges
  update-drafter:
    type: ai
    goal: update-drafted
    prompt: prompts/update-drafter.md
    run: python3 bin/prepare.py update
    max: 1
    every: 10s
    out: flow.update-drafting
