# The operating rhythm (charter §5): each working day starts with the morning brief and ends in the
# ledger, both files in the outbox, both programs. The brief ranks the false conditions (the goals that
# are off), what came overnight, the channels' digests, what waits on me and today's meetings with
# their prep; the ledger records what I did, with links, and tomorrow's top three.
defaults:
  system: rhythm

projections:
  day:
    id: day/*
    description: a working day, its morning brief and its ledger
    states: [started, briefed, ended, recorded]
    on:
      day.briefed: briefed
      day.ended: ended
      day.recorded: recorded
    show: [meetings, brief, ledger]
    formats:
      brief: markdown
      ledger: markdown

stocks:
  days-to-brief:
    unit: days
    description: started, and no morning brief yet
    sensor:
      projection: day
      state: started
      every: 5s
  days-under-way:
    unit: days
    description: briefed, and not over yet (the working day itself)
    sensor:
      projection: day
      state: briefed
      every: 5s
  days-to-record:
    unit: days
    description: ended, and not in the ledger yet
    sensor:
      projection: day
      state: ended
      every: 5s
  drafting-capacity:
    unit: runs
    description: how many alert companions may draft at once (their pool), stepped by the capacity law; 2 to start
    sensor:
      run: python3 bin/capacity.py read 2          # 2: the start value, read until the law first steps it
      every: 5s

flows:
  days-starting:
    to: days-to-brief
    sensor:
      run: python3 bin/watch.py day
      every: 10s
  briefs-written:
    from: days-to-brief
    to: days-under-way
    sensor:
      projection: day
      entering: briefed
      over: 10m
  days-ending:
    from: days-under-way
    to: days-to-record
    sensor:
      projection: day
      entering: ended
      over: 10m
  ledgers-written:
    from: days-to-record
    sensor:
      projection: day
      entering: recorded
      over: 10m
  capacity-steps:
    to: drafting-capacity
    two-way: true
    description: the drafting capacity stepped up or down by the capacity law

goals:
  morning-brief-ready:
    stock: days-to-brief
    hold: "<= 0"
    description: today's morning brief is written before standup
  day-recorded:
    stock: days-to-record
    hold: "<= 0"
    description: every working day is in the ledger
  alert-drafting-paced:
    stock: alerts-to-draft
    hold: "== 1"
    tolerance: 2                                    # off at four waiting; holding again at two or fewer
    description: about one alert waits for its draft - more, and the preparers fall behind; none, and capacity idles

blocks:
  brief-builder:
    type: program
    goal: morning-brief-ready
    run: python3 bin/rhythm.py brief
    max: 1
    every: 5s
    out: flow.briefs-written
  ledger-keeper:
    type: program
    goal: day-recorded
    run: python3 bin/rhythm.py ledger
    max: 1
    every: 5s
    out: flow.ledgers-written
  capacity-law:
    type: program
    description: integral action on the alert backlog - u_k = u_(k-1) + gain x e_k, a run more for each alert over one waiting, a run less while none waits; no step inside the deadband or on a missing reading, kept within limits
    run: python3 bin/capacity.py step 2             # 2: the start value, as the sensor's
    in: [goal.alert-drafting-paced.error]
    every: 30s
    gain: -1                                        # e = 1 - backlog: a backlog over one raises the capacity
    deadband: 0.5
    resolution: 1
    limits: [1, 3]                                  # at least 1 (a pool of 0 stops the preparers), at most the pool's most
    out: flow.capacity-steps
