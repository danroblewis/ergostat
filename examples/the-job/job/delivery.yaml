# Delivery (charter §3 A): my own code. Watched: my PRs on the code host. Prepared: a nudge for each one
# that has waited a working day for a first review. Mine: the relationships with reviewers, so I send
# the nudges myself.
defaults:
  system: delivery

items:
  pr:
    id: pr/*
    description: a pull request of mine
    states: [waiting, stale, nudged, reviewed, merged, closed]
    on:
      pr.stale: stale
      pr.nudge-drafted: nudged
      pr.reviewed: reviewed
      pr.merged: merged
      pr.closed: closed
    show: [title, repo, reviewers, nudge]

stocks:
  my-prs-waiting:
    unit: prs
    description: my PRs waiting for a first review, less than a working day so far
    sensor:
      items: pr
      state: waiting
      every: 5s
  my-prs-stale:
    unit: prs
    description: waited over a working day for a first review, and no nudge drafted yet
    sensor:
      items: pr
      state: stale
      every: 5s
  my-prs-nudged:
    unit: prs
    description: a nudge drafted, still waiting for a first review
    sensor:
      items: pr
      state: nudged
      every: 5s

auxiliaries:
  my-prs-late:
    unit: prs
    description: my PRs waiting over 2 working days for a first review
    driven-by: [+stock.my-prs-stale, +stock.my-prs-nudged]
    sensor:
      items: pr
      state: [waiting, stale, nudged]
      where:
        late: "yes"
      every: 5s

flows:
  prs-opened:
    to: my-prs-waiting
    description: my PRs opened, as the code host's watcher sees them
    sensor:
      run: python3 bin/watch.py pr
      every: 10s
  going-stale:
    from: my-prs-waiting
    to: my-prs-stale
    sensor:
      items: pr
      entering: stale
      over: 10m
  nudges-drafted:
    from: my-prs-stale
    to: my-prs-nudged
    sensor:
      items: pr
      entering: nudged
      over: 10m
  reviewed-promptly:
    from: my-prs-waiting
    sensor:
      items: pr
      entering: reviewed
      where:
        nudged: "no"
      over: 10m
  reviewed-after-nudge:
    from: my-prs-nudged
    sensor:
      items: pr
      entering: reviewed
      where:
        nudged: "yes"
      over: 10m

goals:
  stale-prs-nudged:
    stock: my-prs-stale
    hold: "<= 0"
    description: no PR of mine has waited over a working day for a first review without a nudge drafted
  my-prs-reviewed:
    auxiliary: my-prs-late
    hold: "<= 0"
    description: no PR of mine waits over 2 working days for a first review

blocks:
  nudge-drafter:
    type: ai
    goal: stale-prs-nudged
    prompt: prompts/nudge-drafter.md
    run: python3 bin/prepare.py pr-nudge
    takes: {kind: pr, at: stale}
    pool: 2
    max: 1
    out: flow.nudges-drafted
  chase-reviewers:
    type: person
    agent: me
    goal: my-prs-reviewed
    ask: >-
      A PR of yours has waited over 2 working days for a first review. Its nudge is drafted in
      outbox/pr-*.md: send it yourself, or ask someone in person. Nothing was sent for you.
    out: flow.reviewed-after-nudge
