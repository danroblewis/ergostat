# Production safety governance (charter §3 F). Watched: the feature flag system, for ramps awaiting my
# approval; the CI server's releases. Prepared: a research brief for each ramp (its implementation, its
# schedule, what changed on its service), an upgrade plan for the CI server. Mine: the approvals and
# the safety judgements; my name is on them. A ramp I do not decide within a working day and a half
# goes ahead without me, and stays live unreviewed until it breaks its service (an outage, hours later:
# incidents.yaml) or proves fine.
defaults:
  system: safety

items:
  ramp:
    id: ramp/*
    description: a team's request to ramp a feature flag in production
    states: [pending, briefed, approved, rejected, went-ahead, broke, proved-fine]
    on:
      ramp.briefed: briefed
      ramp.approved: approved
      ramp.rejected: rejected
      ramp.went-ahead: went-ahead          # live in production, unreviewed
      ramp.broke: broke                    # it broke its service: an outage began
      ramp.proved-fine: proved-fine        # half a working day live and nothing broke
    show: [flag, team, schedule, brief]
  ci:
    id: ci/*
    description: a release of the CI server we are behind on
    states: [released, planned, upgraded]
    on:
      ci.planned: planned
      ci.upgraded: upgraded
    show: [version, installed, notes, plan]

stocks:
  ramps-to-research:
    unit: ramps
    sensor:
      items: ramp
      state: pending
      every: 5s
  ramps-briefed:
    unit: ramps
    description: briefed, waiting for my decision
    sensor:
      items: ramp
      state: briefed
      every: 5s
  unreviewed-ramps-live:
    unit: ramps
    description: ramped without my review, live in production, not yet broken or proved fine
    sensor:
      items: ramp
      state: went-ahead
      every: 5s
  ci-releases-unplanned:
    unit: releases
    description: releases of the CI server we run behind, with no upgrade plan
    sensor:
      items: ci
      state: released
      every: 5s

# The numbers the world's code makes known (world/traffic.py): of the ramps that go ahead unreviewed, 45% break
# their service a tenth to half a working day later (uniform: 0.3 on average), and the rest are called fine after
# exactly half a day live. Two delays from the one inflow, then, not one first-order drain: each is the ramps
# waiting for their fate (Sterman ch. 11), and together they are the stock of ramps live unreviewed.
parameters:
  workdays-per-hour:
    value: 60
    unit: workdays/h
    description: the world's clock, a working day every 60 seconds (JOB_DAY, world/world.py)
  break-share:
    value: 0.45
    unit: share
    description: of the ramps that go ahead unreviewed, the share that break their service
  time-to-break:
    value: 0.3
    unit: workdays
    estimate: true
    range: [0.1, 0.5]                          # what it might be: no shorter or longer than any one ramp takes
    description: how long a ramp that breaks stays live first, on average (a tenth to half a working day)
  time-to-prove-fine:
    value: 0.5
    unit: workdays
    description: how long a ramp that does not break stays live before it is called fine, half a working day exactly

auxiliaries:
  ramps-late:
    unit: ramps
    description: ramps waiting over a working day for my decision
    driven-by: [+stock.ramps-to-research, +stock.ramps-briefed]
    sensor:
      items: ramp
      state: [pending, briefed]
      where:
        late: "yes"
      every: 5s

flows:
  ramp-requests:
    to: ramps-to-research
    sensor:
      run: python3 bin/watch.py ramp
      every: 10s
  researching:
    from: ramps-to-research
    to: ramps-briefed
    sensor:
      items: ramp
      entering: briefed
      over: 10m
  ramps-approved:
    from: ramps-briefed
    sensor:
      items: ramp
      entering: approved
      over: 10m
  ramps-rejected:
    from: ramps-briefed
    sensor:
      items: ramp
      entering: rejected
      over: 10m
  ramps-went-ahead:
    from: ramps-briefed
    to: unreviewed-ramps-live
    description: the team ramps without my decision
    driven-by: +auxiliary.ramps-late
    sensor:
      items: ramp
      entering: went-ahead
      over: 10m
  ramps-broke:
    from: unreviewed-ramps-live
    description: an unreviewed ramp breaks its service, hours after it went ahead (an outage begins)
    driven-by: +flow.ramps-went-ahead            # its share of those that went ahead, after the time they take to break
    # a third-order material delay (Sterman ch. 11): what goes in comes out, spread around its delay time
    equation: DELAY3(break-share * flow.ramps-went-ahead, time-to-break / workdays-per-hour)
    sensor:
      items: ramp
      entering: broke
      over: 10m
  ramps-proved-fine:
    from: unreviewed-ramps-live
    description: an unreviewed ramp that has been live half a working day without breaking anything
    driven-by: +flow.ramps-went-ahead
    # a fixed half day (a pipeline): a third-order delay is the nearest the model writes
    equation: DELAY3((1 - break-share) * flow.ramps-went-ahead, time-to-prove-fine / workdays-per-hour)
    sensor:
      items: ramp
      entering: proved-fine
      over: 10m
  ci-releases:
    to: ci-releases-unplanned
    sensor:
      run: python3 bin/watch.py ci
      every: 10s
  upgrade-planning:
    from: ci-releases-unplanned
    sensor:
      items: ci
      entering: planned
      over: 10m

goals:
  every-ramp-briefed:
    stock: ramps-to-research
    hold: "<= 0"
    description: every pending flag ramp awaiting my approval has a research brief
  ramps-decided:
    auxiliary: ramps-late
    hold: "<= 0"
    description: no flag ramp waits over a working day for my decision
  ci-upgrade-planned:
    stock: ci-releases-unplanned
    hold: "<= 1"
    description: the CI server is within one version of current, or an upgrade plan exists

blocks:
  ramp-researcher:
    type: ai
    goal: every-ramp-briefed
    prompt: prompts/ramp-researcher.md
    run: python3 bin/prepare.py ramp-brief
    takes: {kind: ramp, at: pending}
    pool: 2
    max: 1
    out: flow.researching
  approve-ramps:
    type: person
    agent: me
    goal: ramps-decided
    ask: >-
      A flag ramp has waited over a working day for your decision. Its research brief is in
      outbox/ramp-*.md: approve or reject it in the flag system yourself. Your name is on it.
    out:
      approved: flow.ramps-approved
      rejected: flow.ramps-rejected
  upgrade-planner:
    type: program
    goal: ci-upgrade-planned
    run: python3 bin/prepare.py ci-plan
    takes: {kind: ci, at: released}
    pool: 2
    max: 1
    out: flow.upgrade-planning
