# Operational awareness (charter §3 D). Watched: the tracked chat channels, filtered to what mentions
# me (and digested for the morning brief); the secrets store, for secrets within 30 days of expiry.
# Prepared: a triage and a reply for each mention (a program: no model), a rotation ticket for each
# secret. Mine: saying the right thing at the right time, as myself.
defaults:
  system: awareness

items:
  mention:
    id: mention/*
    description: a chat message that mentions me
    states: [new, triaged, answered]
    on:
      mention.triaged: triaged
      mention.answered: answered
    show: [channel, author, text, reply]
  secret:
    id: secret/*
    description: a secret I own, from when it is within 30 days of expiry
    states: [expiring, drafted, rotated]
    on:
      secret.expiring: expiring
      secret.ticket-drafted: drafted
      secret.rotated: rotated
    show: [service, expires, days_left, ticket]

stocks:
  mentions-to-triage:
    unit: mentions
    sensor:
      items: mention
      state: new
      every: 5s
  mentions-triaged:
    unit: mentions
    description: triaged, a reply drafted, waiting for me to answer
    sensor:
      items: mention
      state: triaged
      every: 5s
  secrets-expiring:
    unit: secrets
    description: within 30 days of expiry, no rotation ticket drafted
    sensor:
      items: secret
      state: expiring
      every: 5s
  secrets-ticketed:
    unit: secrets
    description: a rotation ticket drafted, not yet rotated
    sensor:
      items: secret
      state: drafted
      every: 5s

auxiliaries:
  mentions-late:
    unit: mentions
    description: mentions unanswered after 4 working hours
    driven-by: [+stock.mentions-to-triage, +stock.mentions-triaged]
    sensor:
      items: mention
      state: [new, triaged]
      where:
        late: "yes"
      every: 5s

flows:
  mentions:
    to: mentions-to-triage
    description: messages mentioning me, filtered from the tracked channels
    sensor:
      run: python3 bin/watch.py mention
      every: 10s
  triaging:
    from: mentions-to-triage
    to: mentions-triaged
    sensor:
      items: mention
      entering: triaged
      over: 10m
  mentions-answered:
    from: mentions-triaged
    description: a mention answered in its channel, by me (mine)
    sensor:
      items: mention
      entering: answered
      over: 10m
  nearing-expiry:
    to: secrets-expiring
    sensor:
      run: python3 bin/watch.py secret
      every: 10s
  rotation-tickets:
    from: secrets-expiring
    to: secrets-ticketed
    sensor:
      items: secret
      entering: drafted
      over: 10m
  rotations:
    from: secrets-ticketed
    description: the team rotates what has a ticket
    sensor:
      items: secret
      entering: rotated
      over: 10m

goals:
  every-mention-triaged:
    stock: mentions-to-triage
    hold: "<= 0"
    description: every message mentioning me is triaged
  mentions-answered:
    auxiliary: mentions-late
    hold: "<= 0"
    description: every message mentioning me is answered within 4 hours
  secrets-ticketed:
    stock: secrets-expiring
    hold: "<= 0"
    critical: true
    owner: me
    description: no secret I own expires within 30 days without a ticket

blocks:
  mention-triager:
    type: program
    goal: every-mention-triaged
    run: python3 bin/prepare.py mention-triage
    takes: {kind: mention, at: new}
    pool: 2
    max: 1
    out: flow.triaging
  answer-mentions:
    type: person
    agent: me
    goal: mentions-answered
    ask: >-
      A mention has waited over 4 hours. Its triage and a suggested reply are in outbox/mention-*.md:
      answer it yourself, in the channel. Nothing was posted for you.
    out: flow.mentions-answered
  rotation-ticket-drafter:
    type: program
    goal: secrets-ticketed
    run: python3 bin/prepare.py secret-ticket
    takes: {kind: secret, at: expiring}
    pool: 2
    max: 1
    out: flow.rotation-tickets
