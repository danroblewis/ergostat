# What I say about the work while it is under way (ergostat's SPEC §12h). I say it in my own words ("that review can
# wait", "check the flag ramp first"); the note watcher relays it as my message, and ergostat routes it to the work it
# concerns: the item it names, or the open items whose words it shares. The preparer's run on that item (it holds a
# lease on it) gets it: it puts a review off (gives it back for half a day), or writes the note into the draft, and
# answers. A note about work already finished
# becomes a follow-up (note/...), which the next morning brief puts in front of me. A note that reaches no work
# ("hold that one") needs attention, and the morning brief lists it, until I route it by hand.
defaults:
  system: messages

messages:
  finished: follow-up
  follow-up: note                          # a note on finished work becomes a note/<id>, linked to it
  done:
    review: [answered]
    ramp: [approved, rejected, broke, proved-fine]

items:
  note:
    id: note/*
    description: "a follow-up: a note of mine about work already finished, linked to it"
    states: [open, briefed]
    on:
      note.briefed: briefed
    show: [follows, note]

stocks:
  messages-unrouted:
    unit: messages
    description: my notes that reached no work (each needs attention until I route it)
    sensor:
      builtin: ergostat.messages.unrouted
      every: 5s
  messages-awaiting:
    unit: messages
    description: routed to work and not yet delivered (waiting for the preparer's next run)
    sensor:
      items: ergostat.message
      state: routed
      every: 5s
  messages-missed:
    unit: messages
    description: notes whose work finished before they reached it, over the last week (the work followed up)
    cumulative: true                     # (over the week the measure counts)
    sensor:
      builtin: ergostat.messages.missed
      every: 10s
  follow-ups-open:
    unit: notes
    description: notes on finished work, not yet in a morning brief
    sensor:
      items: note
      state: open
      every: 5s

flows:
  notes-said:                              # I say things when I do: a disturbance, measured
    to: messages-awaiting
    description: what I say about the work under way, relayed by the note watcher (per hour); ergostat routes each
    sensor:
      run: python3 bin/watch.py note
      every: 10s
  messages-delivered:
    from: messages-awaiting
    description: my notes delivered to the work (a preparer's run, a follow-up)
    sensor:
      items: ergostat.message
      entering: delivered
      over: 10m
  messages-unrouting:
    from: messages-awaiting
    to: messages-unrouted
    description: notes that reached no work
    sensor:
      items: ergostat.message
      entering: unrouted
      over: 10m
  messages-routed-by-hand:
    from: messages-unrouted
    to: messages-awaiting
    description: notes I routed by hand (mine)
    sensor:
      items: ergostat.message
      leaving: unrouted
      over: 10m
  messages-missing:
    to: messages-missed
    description: work redone because a note did not reach it in time (it was being prepared, or waited for me, and
      finished first)
    sensor:
      changes: rises
      over: 10m
      every: 10s
  follow-ups:
    to: follow-ups-open
    description: notes on finished work, made follow-ups
    sensor:
      items: note
      entering: open
      over: 10m
  follow-ups-briefed:
    from: follow-ups-open
    description: follow-ups the morning brief put in front of me
    sensor:
      items: note
      entering: briefed
      over: 10m

goals:
  notes-reach-work:
    stock: messages-unrouted
    hold: "<= 0"
    description: everything I say about the work reaches the work it is about. Only I can say what I meant; the
      morning brief lists what reached nothing, and I route it

blocks:
  route-notes:
    type: person
    agent: me
    goal: notes-reach-work
    ask: >-
      Something you said reached no work (the morning brief lists it). Say what it was about:
      ergostat messages ID --about KIND/ID.
    out: flow.messages-routed-by-hand
