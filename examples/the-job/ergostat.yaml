# The job: a senior engineer's and SRE's work, as one system (docs: README.md).
#
# Each domain of the job (delivery, stewardship, documents, awareness, incidents, safety, support,
# team) is a system within it, and the operating rhythm (the morning brief and the ledger) is one
# more. In every one the same five verbs: programs WATCH the work systems (bin/watch.py, the
# sensors on the arrival flows), preparers PREPARE a draft for each thing that arrives (bin/
# prepare.py, into outbox/), and I DECIDE and PERFORM (the person blocks: they ask me, and never
# act), while the ledger RECORDs what was done.
#
# It is read-only toward the outside: nothing here posts, comments, approves or runs anything.
# The world is simulated (world/), so it runs anywhere with no accounts; JOB_GH=1 reads my own
# PRs and review requests from GitHub instead, with read-only gh commands.
name: the-job
include:
  - job/*.yaml
systems:
  job:
    description: what I am expected to do, and what I am judged on
  delivery:
    within: job
    description: my own code, reviewed and merged
  stewardship:
    within: job
    description: reviewing others' code
  documents:
    within: job
    description: problem statement, proposal, design, change advisory board
  awareness:
    within: job
    description: chat that mentions me, secrets nearing expiry
  incidents:
    within: job
    description: alerts, outages and postmortem actions
  safety:
    within: job
    description: feature flag ramps and the CI server
  support:
    within: job
    description: customer tickets in the regulated environment
  team:
    within: job
    description: teammates' stale PRs and the weekly update
  rhythm:
    within: job
    description: the morning brief and the ledger

agents:
  me:
    kind: person
    description: the owner; the only one who approves, declares, runs anything or speaks as me (charter §7)
