# This Mac, measured for real and changed by nobody: the sensors only read. The loops are held by
# a person (the owner): ergostat measures, asks them when a goal is off, and never acts here.
name: this-mac

stocks:
  disk-used:
    unit: "%"
    description: the startup disk, as df reports it
    sensor:
      run: bin/meter.sh disk
      every: 30s
  downloads:
    unit: files
    description: files in ~/Downloads
    sensor:
      run: bin/meter.sh downloads
      every: 30s
  load:
    unit: runnable
    description: the one-minute load average
    sensor:
      run: bin/meter.sh load
      every: 30s

flows:
  files-written:                 # everything that writes to the disk
    to: disk-used
  space-freed:
    from: disk-used
  downloaded:
    to: downloads
  tidied:
    from: downloads

goals:
  disk-has-room:
    stock: disk-used
    hold: "<= 90"
  downloads-tidy:
    stock: downloads
    hold: "<= 500"

blocks:
  free-space:                    # a request to the owner while disk-has-room is off
    type: person
    agent: owner
    goal: disk-has-room
    ask: the disk is nearly full; free some space, then say how many % you freed
    out: flow.space-freed

  tidy-downloads:
    type: person
    agent: owner
    goal: downloads-tidy
    ask: ~/Downloads has too many files; tidy it, then say how many you removed
    out: flow.tidied

agents:
  owner:                         # one person fills both loops
    kind: person
    description: frees space and tidies downloads, when they choose to
