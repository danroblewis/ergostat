# The codebase (05 §1, the product): the stock of code against the features it serves. Growth with features is
# fine; inflation is not (07 §1, CV8). Once a factory day the consolidation switch (LP10) compares code per feature
# with its expected cost and, with hysteresis and a week's dwell, puts the factory into consolidation (08 §2): the
# door tightens to fixes and removals, removals are briefed, and the workers' recipes are revised so they stop
# inflating code. Under the harness nothing inside does this: the owner prunes, late (RM3).
defaults:
  system: codebase

parameters:
  lines-per-item:
    value: 200
    unit: lines/items
    description: lines a landed item adds, as the workers write them now
    estimate: true
  features-per-item:
    value: 0.6
    unit: features/items
    description: features a landed item delivers (the owner's directions all do; proposals as they are worth)
    estimate: true
  expected-cost:
    value: 200
    unit: lines/features
    description: the lines a feature is expected to cost (the capacity analysis of past features, identified by L5)

stocks:
  code-lines:
    unit: lines
    description: the code on the mainline
    sensor:
      run: python3 world/read.py code
      every: 10s
  features:
    unit: features
    cumulative: true                  # features delivered so far
    description: the features the code serves
    sensor:
      run: python3 world/read.py features
      every: 10s
  consolidating:
    unit: "1"
    description: the factory's operating state - 1 in consolidation, 0 in normal (08 §2); a mode keeps its value until switched
    sensor:
      run: python3 world/read.py mode
      every: 10s

auxiliaries:
  code-per-feature:
    unit: "1"
    description: CV8 - code per feature against its expected cost; 1 is as expected
    driven-by: [+stock.code-lines, -stock.features]
    equation: ZIDZ(stock.code-lines, stock.features * expected-cost)
    sensor:
      run: python3 world/read.py cv8
      every: 10s

flows:
  lines-added:
    to: code-lines
    description: lines landed with accepted work - a coflow of acceptance
    driven-by:
      - cause: +flow.accepted
        instant: true
    equation: lines-per-item * flow.accepted
    sensor:
      changes: rises
      over: 10m
      every: 10s
  lines-removed:
    from: code-lines
    description: removals landed in consolidation, and the owner's pruning
    driven-by: [+stock.code-lines, +stock.consolidating]
    sensor:
      changes: falls
      over: 10m
      every: 10s
  features-delivered:
    to: features
    driven-by:
      - cause: +flow.accepted
        instant: true
    equation: features-per-item * flow.accepted
    sensor:
      changes: rises
      over: 10m
      every: 10s
  mode-switched:
    to: consolidating
    two-way: true                     # into consolidation (+1), and back to normal (-1)
    description: the operating state switched by LP10

goals:
  code-per-feature-as-expected:
    auxiliary: code-per-feature
    hold: "<= 1.3"
    description: LP10 - code per feature within 1.3 of its expected cost; consolidation entered above it, left at 1.1, a week's dwell in each

blocks:
  consolidation-switch:
    type: program
    description: LP10 - a compare with hysteresis (enter at 1.3, leave at 1.1) and a dwell, decided through review (here the review always agrees); in consolidation it briefs removals and revises the recipes
    run: python3 bin/coord.py consolidation
    in: [goal.code-per-feature-as-expected, +auxiliary.code-per-feature]
    every: 12m                        # a factory day
    out: flow.mode-switched
