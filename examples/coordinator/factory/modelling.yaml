# Modelling (L5's identification and modelling, 10 §1): the model of the factory improved as a loop of its own,
# ergostat's built-in one (SPEC §12e, the template `modelling`), as the-job and image-squeeze use it. The model's fit
# to the record is a stock (its replay's scaled error); a goal holds it; while it is off the improver proposes changes
# with their evidence; ergostat's judge replays each on the record that comes after it and passes it only when it is
# better beyond the record's noise; a passed value is written at once (class 1, pre-approved), a change to the structure waits
# for the owner (10 §3). The improver is a free stand-in (bin/improver.py): it proposes what ergostat's own
# calibration declined. What it makes: docs/ADDING.md (modelling).
uses:
  modelling:
    use: modelling
    with:
      fit: 0.05                               # the replay's scaled error at most 0.05
      prompt: prompts/improver.md
      run: python3 bin/improver.py            # a stand-in: free
      sessions: true                          # each run of the improver (the stand-in's) a session item
      hold-out: 4m                            # each change judged on four minutes of record after it was made ...
      windows: [1, 2, 4]                      # ... shown whole, in halves and in quarters
      threshold: 2%                           # passed when better by 2%, beyond the record's noise
      accept:
        parameter: auto                       # a value passed is written at once (class 1); the structure waits for the owner
