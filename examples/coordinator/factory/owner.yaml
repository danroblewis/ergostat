# The owner (05 §1, outside the plant in four roles): at the desk or away (d2), a source of directions and
# corrections, and the one who answers holds and questions. Two budgets on the owner's attention (07 LP7): at most
# three blockers open (S5) and four interruptions a day (S1). Asks beyond them wait, batched, for the handover
# report, which is sent on the owner's return (an event, not a clock); in it the owner also confirms the decisions
# the extractor proposed meanwhile (RM8's batch queue, here drained).
defaults:
  system: owner

stocks:
  owner-queue:
    unit: items
    description: holds and questions awaiting the owner (S5's stock, CV6)
    sensor:
      run: python3 world/read.py queue
      every: 5s
  decisions-waiting:
    unit: decisions
    description: decisions the extractor proposed from the owner's messages, awaiting confirmation (used at once in briefs, marked uncertain)
    sensor:
      run: python3 world/read.py decisions
      every: 10s

auxiliaries:
  owner-present:
    unit: "1"
    exogenous: true                   # d2, measured: 1 while the owner has acted in the last two hours
    description: the owner at the desk (1) or away (0)
    sensor:
      run: python3 world/read.py present
      every: 5s

flows:
  asked:
    to: owner-queue
    description: hold points and questions put to the owner (u7, u9) - within S5, interrupting within S1
    sensor:
      changes: rises
      over: 10m
      every: 5s
  answered:
    from: owner-queue
    description: the owner's answers, fast at the desk, none while away (or batched until the handover report)
    driven-by: [+stock.owner-queue, +auxiliary.owner-present]   # minutes at the desk (RM8: 1.8 to 4.1), none away
    sensor:
      changes: falls
      over: 10m
      every: 5s
  decisions-proposed:
    to: decisions-waiting
    description: decisions the extractor proposes from what the owner says (about one in four messages)
    driven-by: [+auxiliary.owner-present]
    sensor:
      changes: rises
      over: 10m
      every: 10s
  decisions-confirmed:
    from: decisions-waiting
    description: confirmed by the owner in the handover report

goals:
  blockers-within-budget:
    stock: owner-queue
    hold: "<= 3"
    description: S5 - at most three holds and questions open on the owner
  decisions-drained:
    stock: decisions-waiting
    hold: "<= 20"
    description: CV6 - what waits for the owner stays bounded and drains at the rate the owner answers

blocks:
  attention:
    type: program
    description: LP7 - a token bucket on interruptions (S1), the rest batched; the handover report on the owner's return, in which the owner answers what was batched and confirms the proposed decisions
    goal: decisions-drained
    run: python3 bin/coord.py attention
    in: [+auxiliary.owner-present]
    every: 2s
    out: flow.decisions-confirmed
  the-owner:
    type: external
    agent: owner
    description: the owner answering what waits (simulated)
    in: [+stock.owner-queue, +auxiliary.owner-present]
    out: flow.answered
