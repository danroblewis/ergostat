# The Coordinator of a software factory, as docs/proposals/coordinator/ (00 to 11) designs it, in ergostat's YAML.
# docs/proposals/coordinator/12-model.md walks it, maps each part to the architecture, and gives the tests.
#
# The plant (05 §1) is four systems: the work, flowing through a leased work queue to a pool of AI-agent workers
# capped by the owner (work.yaml); the rework cycle the acceptance check and later discovery act on (quality.yaml);
# the codebase, its code per feature and the consolidation mode (codebase.yaml); and the owner, at the desk or away,
# whose attention is held under two budgets (owner.yaml). The observer (06) is the context sector (context.yaml).
# Modelling, the adaptive loop (10), is ergostat's own (modelling.yaml).
#
# Each loop of 07 is a block in the system it holds: LP1 acceptance and LP2 its outer loop (quality); LP3 the
# dispatcher, LP5 the watchdog, LP6 admission (work); LP7 attention (owner); LP9 the externaliser (context); LP10
# the consolidation switch (codebase). Their laws are world/policy.py, run by bin/coord.py LOOP.
#
# The world is simulated and free (world/: plant.py is the plant, sim.py its clock): a factory hour every
# COORD_HOUR seconds (30: a factory day every 12 minutes), so durations below are written in ergostat's own time,
# with the factory's beside them. COORD_POLICY=harness runs the same blocks with the harness's policy as it was
# (the controllers "off"); the default is the designed one.
name: coordinator
include:
  - factory/*.yaml
systems:
  plant:
    description: what the Coordinator controls (05 §1) - the work, the workers, the codebase, the owner
    show: [stock.ready-work, stock.runs-in-flight, stock.undiscovered-rework, stock.owner-queue]
  work:
    within: plant
    description: the leased work queue - proposed, admitted, leased to a worker, expired, dead-lettered (07 §6)
    show: [stock.ready-work, stock.runs-in-flight, stock.dead-letter, auxiliary.oldest-silence]
  quality:
    within: plant
    description: the rework cycle and the quality cascade, LP1 inside LP2 (07)
    show: [stock.reported-done, stock.undiscovered-rework, auxiliary.escaped-rework, auxiliary.unread-test-runs]
  codebase:
    within: plant
    description: the code stock against the features it serves, and the consolidation mode (07 LP10)
    show: [stock.code-lines, auxiliary.code-per-feature, stock.consolidating]
  owner:
    within: plant
    description: the owner's attention - holds and questions open (S5), decisions waiting (CV6)
    show: [stock.owner-queue, stock.decisions-waiting, auxiliary.owner-present]
  observer:
    description: the Coordinator's estimate of the plant (06) - its working and durable context
    show: [stock.working-context, stock.durable-knowledge, stock.unrecorded-corrections]
  modelling:
    description: the model of all this, improved as a loop of its own (L5, 10)
    show: [stock.model-error, stock.pending-changes, stock.accepted-changes]

agents:
  ai-agents:
    kind: ai
    external: true
    at-once: 6
    description: the worker pool, AI-agent sessions in their own harnesses, simulated (world/plant.py); the owner caps it at six
  owner:
    kind: person
    external: true
    description: the owner, simulated (world/plant.py) - at the desk or away, answers, gives directions, corrects, prunes
  harness:
    external: true
    description: each AI session's harness - it cuts a session's window when it is nearly full (H5)

loops:
  rework-cycle:
    through: [flow.reopened, stock.undiscovered-rework]
    description: R1 - landed work found wrong returns to the work to do
  quality-cascade:
    goal: escaped-rework-low
    description: LP2 - escaped rework sets the review depth's allowance
  ideas-breed-work:
    through: [flow.proposed, stock.proposed-work]
    description: R5 - landed work proposes more
