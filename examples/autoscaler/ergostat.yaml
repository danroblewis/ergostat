# One deployment held at a CPU target by a horizontal pod autoscaler that ergostat does not run: it only reads what
# the cluster exposes (cluster.py: replicas, utilisation, CPU in use, scaling events), identifies the autoscaler's
# law from that record, and judges the loop it closes.
name: autoscaler

agents:
  kubernetes:
    kind: program
    external: true
    description: the cluster's horizontal pod autoscaler (simulated in cluster.py); ergostat never runs or sets it

stocks:
  replicas:
    unit: pods
    description: the deployment's replicas, as the cluster reports them (what the autoscaler sets)
    sensor: {run: python3 cluster.py replicas, every: 5s, description: the deployment's spec replicas}
  load:
    unit: cores
    description: CPU in use by the deployment, summed over its pods (the work, in cores)
    sensor: {run: python3 cluster.py load, every: 5s, description: the containers' CPU in use}

auxiliaries:
  utilisation:
    unit: cores/pods
    description: CPU used per ready pod; each requests one core, so this is CPU over requested - the autoscaler's metric
    sensor: {run: python3 cluster.py utilisation, every: 5s, description: "CPU over requested (the HPA's metric)"}
    equation: ZIDZ(stock.load, stock.replicas)
    driven-by: [+stock.load, -stock.replicas]     # how the loop closes: more pods, less CPU each

flows:
  scale:
    to: replicas
    two-way: true
    description: pods added or removed by the autoscaler
  demand:
    to: load
    two-way: true
    description: the requests' CPU, rising and falling with the traffic (a disturbance nothing here controls)

goals:
  cpu-at-target:
    auxiliary: utilisation
    hold: "<= 0.6"
    tolerance: 0.06                     # the autoscaler's own: no scaling within 10% of its target
    description: the autoscaler's target - CPU at 60% of what the pods request, leaving headroom for a burst

blocks:
  web-hpa:
    type: external
    agent: kubernetes
    description: >-
      the HPA on web (target 60% CPU, 2 to 20 pods, sync 5s, scale-down stabilised over 100s; the documented rule is
      desired = ceil(replicas x utilisation / target)); ergostat identifies what it actually does from the record
    in: auxiliary.utilisation           # what it reads: its target is its own, written in the goal it serves
    out: flow.scale
    identify: {input: auxiliary.utilisation, output: stock.replicas}

uses:
  modelling:
    use: modelling                    # the model improved as a loop of its own: what check finds is its work (SPEC §12e)
  rescales:
    use: collect
    with:
      command: python3 cluster.py events
      kind: rescale
      cursor-field: seq
      fields: [time, replicas, reason, message]
      poll: 10s
