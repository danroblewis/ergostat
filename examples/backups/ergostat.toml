# Nightly backups, then copies sent off site. One simulated hour passes every two seconds.
name = "backups"

[[system]]
name = "backups"
description = "the database's backups and their off-site copies"

[[stock]]
name = "hours-since-backup"
unit = "h"
systems = ["backups"]
description = "how old the newest backup is"

[[disturbance]]
name = "time-passing"
into = "hours-since-backup"
rate = 1800       # known, not estimated: one simulated hour every two seconds
description = "every hour the newest backup is an hour older"

[[flow]]
name = "backed-up"
from = "hours-since-backup"
description = "a new backup resets the age"

[[stock]]
name = "copies-not-offsite"
unit = "backups"
systems = ["backups"]
description = "backups taken but not yet copied off site"

[[flow]]
name = "new-backups"
to = "copies-not-offsite"

[[flow]]
name = "sent-offsite"
from = "copies-not-offsite"

[[sensor]]
name = "backup-age"
measures = "hours-since-backup"
agent = "age-check"

[[controller]]
name = "backup-fresh"
holds = "hours-since-backup"
setpoint = "<= 24"
tolerance = 2
reads = ["backup-age"]
drives = ["run-backup"]
agent = "backup-policy"
description = "a backup no older than a day"

[[valve]]
name = "run-backup"
flow = "backed-up"
agent = "backup-job"

[[valve]]
name = "record-backup"
flow = "new-backups"
agent = "backup-job"
description = "each backup taken is one more to copy"

[[sensor]]
name = "offsite-lag"
measures = "copies-not-offsite"
agent = "offsite-sync"

[[controller]]
name = "offsite-current"
holds = "copies-not-offsite"
setpoint = "<= 1"
reads = ["offsite-lag"]
drives = ["copy-offsite"]
agent = "offsite-sync"

[[valve]]
name = "copy-offsite"
flow = "sent-offsite"
agent = "offsite-sync"

[[agent]]
name = "age-check"
kind = "program"
command = "python3 age_check.py"
every = "2s"
description = "reads the newest backup's timestamp"

[[agent]]
name = "backup-policy"
kind = "rule"
command = "python3 policy.py"
on = ["loop.off@backup-fresh"]
description = "if the backup is too old, ask for one"

[[agent]]
name = "backup-job"
kind = "program"
command = "python3 backup.py"
on = ["backup.requested"]
description = "takes the backup"

[[agent]]
name = "offsite-sync"
kind = "program"
command = "python3 offsite.py"
every = "7s"
description = "copies one backup off site per run"
