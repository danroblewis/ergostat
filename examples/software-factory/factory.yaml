# The factory's work, as items: each ticket, pull request and release is folded from its events.
# Its parts are in factory/: intake (tickets filed into the backlog) and delivery (developed,
# reviewed, deployed), two systems within the factory.

items:
  ticket:
    id: ticket/*
    states: [open, doing, review, merged, live, dropped]
    on:
      ticket.started: doing
      ticket.submitted: review
      ticket.rejected: open                # back to the backlog, with the reviewer's note
      ticket.merged: merged
      ticket.deployed: live
      ticket.dropped: dropped
    show: [type, op, title, priority]
  pr:
    id: pr/*
    states: [review, merged, rejected, deployed]
    on:
      pr.merged: merged
      pr.rejected: rejected
      pr.deployed: deployed
    show: [ticket, author, tests, diff]
  release:
    id: release/*
    show: [commit, tickets]

# A shared dashboard (SPEC §4f): added by the Supervisor, never written by hand. GET /api/dashboard/week.
dashboards:
  week:
    title: The factory, this week
    description: where tickets wait, and whether the backlog clears
    window: 7d
    panels:
      - {panel: goals, size: full}
      - {panel: states, kind: ticket, size: l, note: Where tickets wait}
      - {panel: cycle-time, kind: ticket, size: s}
      - {panel: chart, title: Backlog and review, refs: [stock.backlog, stock.in-review], replay: true, size: m}
      - {panel: items, kind: ticket, state: review, size: m}
      - {panel: scope, goal: reviews-done, size: m}
