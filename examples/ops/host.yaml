# The host's disk, kept under 80% by a cleaner ergostat runs while it is over.
defaults:
  system: host

stocks:
  disk-used:
    unit: "%"
    sensor:
      run: python3 usage.py
      every: 3s

flows:
  logs-written:                  # set by the worker pool (jobs.yaml): a disturbance to this loop
    to: disk-used
  cleaned:
    from: disk-used

goals:
  disk-under-80:
    stock: disk-used
    hold: "<= 80"
    tolerance: 2                 # off past 82%

blocks:
  delete-old-files:
    type: program
    goal: disk-under-80          # runs while the goal is off ...
    until: "<= 65"               # ... until the disk is back to 65%
    run: python3 clean.py        # frees 5% per run
    out: flow.cleaned
