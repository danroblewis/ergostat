# The job queue: the autoscaler sizes the worker pool from the backlog.
defaults:
  system: jobs

stocks:
  jobs-waiting:
    unit: jobs
    description: "the queue's backlog: the pub/sub subscription's unacknowledged messages"
    sensor:
      run: python3 depth.py
      every: 2s

flows:
  jobs-arriving:
    to: jobs-waiting
    description: requests from users, in bursts
  jobs-done:
    from: jobs-waiting

goals:
  queue-short:
    stock: jobs-waiting
    hold: "<= 20"
    tolerance: 5                 # off past 25 jobs

blocks:
  autoscaler:                    # not on/off: how many workers, one per 5 jobs waiting, 1 to 8
    type: expr
    in:
      backlog: stock.jobs-waiting
    expr: min(8, max(1, ceil(backlog / 5)))
    out: block.worker-pool

  worker-pool:
    type: program
    run: python3 pool.py         # reads command.amount: the workers to run
    in: block.autoscaler
    out: [flow.jobs-done, flow.logs-written]    # its logs fill the host's disk

  users:                         # a simulation of the users: it acts on its own
    type: program
    run: python3 users.py
    every: 2s
    out: flow.jobs-arriving
