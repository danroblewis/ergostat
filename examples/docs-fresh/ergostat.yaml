# The docs kept in step with the code. Developers merge changes, which make pages stale;
# a cheap decision picks which pages to rewrite; an AI session (simulated) rewrites them.
name: docs-fresh
defaults:
  system: docs

stocks:
  stale-pages:
    unit: pages
    description: pages older than the code they describe
    sensor:
      run: python3 scan.py stale          # compares each page's date with the files it documents
      every: 3s

flows:
  code-changes:                           # every merged change can make a page stale
    to: stale-pages
    sensor:
      run: python3 scan.py churn          # merged changes per hour
      every: 12s
  pages-refreshed:
    from: stale-pages

goals:
  docs-current:
    stock: stale-pages
    hold: "<= 3"
    description: few enough stale pages that readers rarely meet one

blocks:
  developers:                             # the load: they merge whenever they like
    type: program
    run: python3 sim.py merge
    every: 6s
    out: flow.code-changes

  page-picker:                            # how many pages, and which first
    type: program
    agent: picker
    run: python3 pick.py
    every: 5s
    in: [goal.docs-current.error, flow.code-changes]   # the churn is feedforward
    out: block.doc-writer

  doc-writer:
    type: ai
    prompt: Rewrite the page you are given so it matches the code it documents, and open a pull request.
    run: python3 writer.py                # a stand-in for the Claude Code session
    mode: advise                          # each rewrite waits for a person: ergostat block doc-writer --approve
    max: 2                                # one session rewrites at most two pages
    out: flow.pages-refreshed

agents:
  picker:
    kind: decision                        # a short model call, a rung below the writer (simulated here)
