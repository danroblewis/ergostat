# Step 12, close: merged -> done. The issue to Done (steps/close.py); ergostat cleans its workspace then.
defaults:
  system: shipping

flows:
  close:
    from: merged
    to: done
    driven-by: [+stock.merged]
    equation: stock.merged / close-time
    sensor:
      items: ticket
      entering: done
      over: 10m

parameters:
  close-time:
    value: 10s
    estimate: true
    description: how long closing takes

goals:
  merged-closed:
    stock: merged
    hold: "<= 0"
    description: every merged ticket is Done in Jira

blocks:
  close:
    type: program
    goal: merged-closed
    daemon: steps                     # each run handed to the steps' daemon (ergostat.yaml)
    takes: {kind: ticket, at: merged, to: [done, stopped]}
    pool: 3
    actions: [jira-transition, jira-comment]
    out: flow.close
