# Step 8, sail: approved -> sailed. The SAIL label (steps/sail.py).
defaults:
  system: review

stocks:
  sailed:
    unit: tickets
    description: labelled SAIL; CI watched
    sensor:
      projection: ticket
      state: sailed
      every: 3s

flows:
  sail:
    from: approved
    to: sailed
    driven-by: [+stock.approved]
    equation: stock.approved / sail-time
    sensor:
      projection: ticket
      entering: sailed
      over: 10m

parameters:
  sail-time:
    value: 10s
    estimate: true
    description: how long labelling takes

goals:
  approved-sailed:
    stock: approved
    hold: "<= 0"
    description: every approved pull request is labelled SAIL

blocks:
  sail:
    type: program
    goal: approved-sailed
    daemon: steps                     # each run handed to the steps' daemon (ergostat.yaml)
    takes: {projection: ticket, at: approved, to: [sailed, stopped]}
    pool: 3
    actions: [pr-label]
    out: flow.sail
