# Step 2, locate: picked -> located. Which repository the issue names (steps/locate.py).
defaults:
  system: intake

stocks:
  located:
    unit: tickets
    description: its repository found and fetched; not worked yet
    sensor:
      projection: ticket
      state: located
      every: 3s

flows:
  locate:
    from: picked
    to: located
    driven-by: [+stock.picked]
    equation: stock.picked / locate-time
    sensor:
      projection: ticket
      entering: located
      over: 10m

parameters:
  locate-time:
    value: 5s
    estimate: true
    description: how long finding the repository takes

goals:
  picked-located:
    stock: picked
    hold: "<= 0"
    description: every ticket picked up has its repository

blocks:
  locate:
    type: program
    goal: picked-located
    daemon: steps                     # each run handed to the steps' daemon (ergostat.yaml)
    takes: {projection: ticket, at: picked, to: [located, stopped]}
    pool: 3
    out: flow.locate
