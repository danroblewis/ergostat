# Step 2, locate: picked -> located. Which repository the issue names (steps/locate.py).
defaults:
  system: intake

stocks:
  located:
    unit: tickets
    description: the repository found; no workspace yet
    sensor:
      items: ticket
      state: located
      every: 3s

flows:
  locate:
    from: picked
    to: located
    driven-by: [+stock.picked]
    equation: stock.picked / locate-time
    sensor:
      items: ticket
      entering: located
      over: 10m

parameters:
  locate-time:
    value: 5s
    estimate: true
    description: how long finding the repository takes

goals:
  picked-located:
    stock: picked
    hold: "<= 0"
    description: every ticket picked up has its repository

blocks:
  locate:
    type: program
    goal: picked-located
    run: python3 bin/step.py locate --from picked
    max: 1
    every: 3s
    out: flow.locate
