# Step 3, branch: located -> branched. A git worktree and a branch (steps/branch.py).
defaults:
  system: intake

stocks:
  branched:
    unit: tickets
    description: a workspace and a branch; the work not started
    sensor:
      items: ticket
      state: branched
      every: 3s

flows:
  branch:
    from: located
    to: branched
    driven-by: [+stock.located]
    equation: stock.located / branch-time
    sensor:
      items: ticket
      entering: branched
      over: 10m

parameters:
  branch-time:
    value: 10s
    estimate: true
    description: how long a ticket waits for a workspace

goals:
  located-branched:
    stock: located
    hold: "<= 0"
    description: every ticket located has a workspace

blocks:
  branch:
    type: program
    goal: located-branched
    run: python3 bin/step.py branch --from located
    max: 1
    every: 3s
    out: flow.branch
