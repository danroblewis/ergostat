# Step 13, close: merged -> done. The issue to Done, the workspace given back (steps/close.py).
defaults:
  system: shipping

flows:
  close:
    from: merged
    to: done
    driven-by: [+stock.merged]
    equation: stock.merged / close-time
    sensor:
      items: ticket
      entering: done
      over: 10m

parameters:
  close-time:
    value: 10s
    estimate: true
    description: how long closing takes

goals:
  merged-closed:
    stock: merged
    hold: "<= 0"
    description: every merged ticket is Done in Jira

blocks:
  close:
    type: program
    goal: merged-closed
    run: python3 bin/step.py close --from merged
    max: 1
    every: 3s
    out: flow.close
