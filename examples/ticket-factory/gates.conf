# The gate on every outward act (bin/act.py). auto: done at once; approve: done once the owner approves
# it (bin/act.py list, bin/act.py approve ID); deny: never done. The second column is the gate here, the
# third offline (against the fakes, where nothing real is touched). To promote a gate on one laptop, write
# the line again in gates.local.conf (ignored by git): `github.label auto`. An action not listed asks first.
#
# action                 gate       offline
jira.transition          approve    auto       # move the issue: In Progress, In Review, Done
jira.comment             approve    auto       # a comment on the issue: the pull request's link
github.push              approve    auto       # push the workspace's branch (never by the AI agent)
github.open-pr           approve    auto
github.request-review    approve    auto       # ask the REVIEWERS for a review
github.comment           approve    auto       # ask for review, re-ping, answer a review, report a CI fix
github.label             approve    auto       # the SAIL label, on approval
github.rerun             approve    auto       # run a failed CI job again
github.merge             approve    approve    # merge, once CI is green
