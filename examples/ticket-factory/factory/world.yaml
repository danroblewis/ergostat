# The people outside the factory, played by a program (bin/teammate.py): the reviewer, who looks at each
# pull request after TEAMMATE_AFTER, asks for one change, and approves once it is answered; and, offline
# only, the owner, approving what waits. At work, TEAMMATE=no: the reviewers are people, and this does
# nothing. They are drawn in the review system, beside the review step that waits for them.
defaults:
  system: review

auxiliaries:
  team-reviewing:
    unit: tickets
    description: pull requests the teammate is looking at now
    exogenous: true

blocks:
  teammate:
    type: program
    daemon: {run: python3 bin/teammate.py serve, concurrency: 1, heartbeat: 30s}   # its own: a look every 5s, no process each
    every: 5s
    out: auxiliary.team-reviewing
