# Arrivals: the Jira issues labelled for the factory, as the watcher sees them (bin/watch.py, a sensor's daemon:
# it reads Jira and records each new issue as a ticket, and never acts).
defaults:
  system: intake

stocks:
  new:
    unit: tickets
    description: found in Jira (To Do, labelled), not picked up yet
    sensor:
      items: ticket
      state: new
      every: 3s

flows:
  arrivals:
    to: new
    description: issues labelled for the factory, as they appear in Jira
    sensor:
      daemon:                        # its own: the one sensor that reads Jira, so Jira down takes nothing else with it
        run: python3 bin/watch.py serve
        restart: {max: 5, within: 10m, backoff: [2s, 5m]}   # rides out a short outage (it says why each reading)
      every: 10s
      averages: 10m
