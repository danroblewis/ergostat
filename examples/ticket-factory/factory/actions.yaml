# Every outward act the factory makes, each a gated action (SPEC 12k): a command template, and its gate.
#   approve   held until the owner approves it (`ergostat actions`, then `ergostat actions ID --approve`, or
#             Approve on the action's page); the step gives its ticket back meanwhile, and finds the action,
#             run, when it asks again
#   auto      run at once        deny      never run
# The steps ask with `$ERGOSTAT_CMD act NAME --arg K=V` (bin/gated.py); ergostat runs the command, in the
# step's workspace or (in: .) this folder, with ergostat's environment: the sign-ins are used here, not by the
# steps' own code. To stop being asked for one, promote it: `gate: auto` (ergostat actions says when a class
# has been approved five times and never denied). Reading Jira and GitHub is not gated.
#
# Jira writes are refused by bin/jira.py on an issue without JIRA_LABEL, and GitHub writes on any repository
# but GITHUB_REPO, whatever the gate.
actions:
  jira-transition:
    run: python3 bin/jira.py transition {key} {status}
    in: .
    gate: approve
    args: {key: the issue, status: "the status it moves to (the transition is looked up)"}
    description: Move a Jira issue to a status
  jira-comment:
    run: python3 bin/jira.py comment {key} {text}
    in: .
    gate: approve
    args: {key: the issue, text: the comment}
    description: Comment on a Jira issue
  git-push:
    run: git push -q --force-with-lease origin HEAD:refs/heads/{branch} && git rev-parse HEAD
    gate: approve
    description: Push the ticket's workspace branch to the repository
  open-pr:
    run: python3 bin/github.py open-pr {repo} {branch} {title} {body} {base}
    in: .
    gate: approve
    args: {repo: the repository, title: the pull request's title, body: its description, base: the branch it merges into}
    description: Open a pull request for the ticket's branch (or find the one open)
  request-review:
    run: python3 bin/github.py request-review {repo} {pr} {reviewers}
    in: .
    gate: approve
    args: {repo: the repository, pr: the pull request, reviewers: "GitHub logins, comma-separated"}
    description: Ask reviewers for a review
  pr-comment:
    run: python3 bin/github.py comment {repo} {pr} {body}
    in: .
    gate: approve
    args: {repo: the repository, pr: the pull request, body: the comment}
    description: Comment on a pull request (ask for review, re-ping, answer a review, say what CI fixed)
  pr-label:
    run: python3 bin/github.py label {repo} {pr} {label}
    in: .
    gate: approve
    args: {repo: the repository, pr: the pull request, label: the label}
    description: Label a pull request (SAIL, on approval)
  ci-rerun:
    run: python3 bin/github.py rerun {repo} {run_id}
    in: .
    gate: approve
    args: {repo: the repository, run_id: the failed CI run}
    description: Run a failed CI run again
  pr-merge:
    run: python3 bin/github.py merge {repo} {pr} {method}
    in: .
    gate: approve
    args: {repo: the repository, pr: the pull request, method: "squash, merge or rebase"}
    description: Merge a pull request once CI is green
