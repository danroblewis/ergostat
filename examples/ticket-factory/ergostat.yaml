# The ticket factory: a software engineer's ticket workflow, end to end, against real services: a Jira
# issue picked up, worked by an AI agent in a git worktree, a pull request opened, reviewed, labelled,
# checked by CI, merged, and the issue closed; with a daily summary and an OKR (README.md).
#
# The workflow is one item kind, `ticket` (ticket.yaml): its states are the step list, and each step is a
# file in steps/ (its stock, flow, goal and block, which takes the tickets in its state under a lease) with a
# script beside it. The work is done in a workspace from the pool below. Every outward act (Jira, GitHub) is
# a gated action (factory/actions.yaml), asked for by the steps and run by ergostat as its gate says.
# Settings: factory.conf (./setup writes it); without one it runs offline, against fakes.
name: ticket-factory
include:
  - ticket.yaml
  - factory/*.yaml
  - steps/*.yaml
  - local/*.yaml
systems:
  factory:
    description: a Jira issue in, a merged pull request and a Done issue out
  intake:
    within: factory
    description: picked up, its repository found, a workspace and a branch
  making:
    within: factory
    description: the change made, and its pull request opened
  review:
    within: factory
    description: asked, re-pinged, answered, approved, labelled SAIL
  shipping:
    within: factory
    description: CI watched and fixed, merged, the issue Done
  oversight:
    description: the owner's approvals, stopped tickets, what it costs, the daily summary and the OKR

# A git worktree per ticket, of the repository's clone (run/repo, made and fetched by the locate step), on its
# own branch; kept while the ticket goes round review and CI, and cleaned when it is done (messages: done).
workspaces:
  code:
    repo: run/repo
    size: 3
    branch: "ergostat/{id}-{slug}"
    base: origin/main

# What GitHub's and Jira's webhooks push (README, "Pushed, not polled"): news of a ticket, so a step that waits on a
# reviewer or on CI looks again at once. POST /api/hooks/github and /api/hooks/jira, with the token in the state
# directory (intake.token) as the webhook's secret, or ?token= in its URL.
intake:
  hooks:
    github:
      event:
        from: "header:X-GitHub-Event"
        map: {pull_request_review: ticket.news, pull_request_review_comment: ticket.news, issue_comment: ticket.news}
      item: "ticket/{pull_request.head.ref~^ergostat/([A-Z][A-Z0-9]*-[0-9]+)}"
      id: "{header:X-GitHub-Delivery}"
      data: {news: action}
    github-ci:
      event: {from: "header:X-GitHub-Event", map: {check_suite: ticket.news}}
      item: "ticket/{check_suite.head_branch~^ergostat/([A-Z][A-Z0-9]*-[0-9]+)}"
      id: "{header:X-GitHub-Delivery}"
      data: {news: check_suite.conclusion}
    jira:
      event: {from: webhookEvent, map: {"jira:issue_updated": ticket.news}}
      item: "ticket/{issue.key}"
      id: "jira-{issue.id}-{timestamp}"
      data: {news: webhookEvent}

messages:
  done: {ticket: [done]}             # the ticket is finished here (its workspace cleaned); stopped keeps it, for a retry

agents:
  owner:
    kind: person
    description: approves the gated actions, and unsticks stopped tickets
  ai:
    kind: ai
    model: haiku
    at-once: 1
    description: Claude Code on haiku (AI=claude), or the free stand-in (AI=standin); never pushes or calls gh
