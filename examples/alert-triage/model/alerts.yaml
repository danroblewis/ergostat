# The alert, one chain of stocks from the pager to closed: new -> triaged -> investigating -> summarising, out to
# closed or dismissed, and through escalated, from which the on-call sends some back to triaged (the rework loop).
defaults:
  system: alerts

items:
  alert:
    id: alert/*
    description: a page from the pager, from firing to closed
    states: [new, triaged, investigating, summarising, escalated, closed, dismissed]
    on:
      alert.fired: new
      alert.triaged: triaged
      alert.dismissed: dismissed
      alert.facets-opened: investigating
      alert.investigated: summarising
      alert.summarised: closed
      alert.escalated: escalated
      alert.handled: closed
      alert.reopened: triaged
    show: [service, severity, summary]
    fold:
      rounds: sum

parameters:
  triage-time:
    value: 2s
    estimate: true
    description: how long triage takes an alert, once taken
  noise-share:
    value: 0.2
    unit: share
    range: [0, 1]
    estimate: true
    description: the share of alerts triage dismisses as noise
  fan-out-time:
    value: 2s
    estimate: true
    description: how long opening an alert's facets takes
  summarise-time:
    value: 2s
    estimate: true
    description: how long the summary takes
  escalate-share:
    value: 0.4
    unit: share
    range: [0, 1]
    estimate: true
    description: the share of summaries that need the on-call
  answer-time:
    value: 8s
    estimate: true
    description: how long the on-call takes to answer an escalation (a person's delay; minutes at work)
  reopen-share:
    value: 0.3
    unit: share
    range: [0, 1]
    estimate: true
    description: the share of escalations the on-call sends back for more investigation

stocks:
  new-alerts:
    unit: alerts
    description: fired, not triaged yet
    sensor: {items: alert, state: new, every: 2s}
  alerts-triaged:
    unit: alerts
    description: worth a look, their facets not opened yet
    sensor: {items: alert, state: triaged, every: 2s}
  alerts-investigating:
    unit: alerts
    description: their facets open; waiting for the last one to finish (the join)
    sensor: {items: alert, state: investigating, every: 2s}
  alerts-summarising:
    unit: alerts
    description: every facet done, the summary not written yet
    sensor: {items: alert, state: summarising, every: 2s}
  alerts-escalated:
    unit: alerts
    description: summarised and handed to the on-call engineer, not answered yet
    sensor: {items: alert, state: escalated, every: 2s}

auxiliaries:
  oldest-new-alert:
    unit: hours
    description: how long the oldest untriaged alert has waited
    driven-by: [+stock.new-alerts]
    sensor: {items: alert, state: new, measure: oldest, every: 2s}

flows:
  alerts-fired:
    to: new-alerts
    description: alerts from the pager, as the collector reads them
    sensor:
      run: python3 bin/watch.py
      every: 2s
      averages: 10m
      description: the pager collector                # (40 characters at most: the Blocks view titles the collector with it)
  alerts-triaged:
    from: new-alerts
    to: alerts-triaged
    description: triaged as worth a look
    driven-by: [+stock.new-alerts]
    equation: (1 - noise-share) * stock.new-alerts / triage-time
    sensor: {items: alert, entering: triaged, where: {via: triage}, over: 10m}
  alerts-dismissed:
    from: new-alerts
    description: triaged as noise
    driven-by: [+stock.new-alerts]
    equation: noise-share * stock.new-alerts / triage-time
    sensor: {items: alert, entering: dismissed, over: 10m}
  facets-opened-for:
    from: alerts-triaged
    to: alerts-investigating
    description: alerts whose facets were opened (the fan-out)
    driven-by: [+stock.alerts-triaged]
    equation: stock.alerts-triaged / fan-out-time
    sensor: {items: alert, entering: investigating, over: 10m}
  alerts-investigated:
    from: alerts-investigating
    to: alerts-summarising
    description: alerts whose last facet finished (the join) - one for every three facets done
    driven-by:
      - cause: +flow.facets-done
        instant: true                 # the join moves the alert as its last facet finishes
    equation: flow.facets-done / facets-per-alert
    sensor: {items: alert, entering: summarising, over: 10m}
  alerts-summarised:
    from: alerts-summarising
    description: summarised and closed with no one woken
    driven-by: [+stock.alerts-summarising]
    equation: (1 - escalate-share) * stock.alerts-summarising / summarise-time
    sensor: {items: alert, entering: closed, where: {via: summary}, over: 10m}
  alerts-escalated:
    from: alerts-summarising
    to: alerts-escalated
    description: summarised and handed to the on-call
    driven-by: [+stock.alerts-summarising]
    equation: escalate-share * stock.alerts-summarising / summarise-time
    sensor: {items: alert, entering: escalated, over: 10m}
  escalations-handled:
    from: alerts-escalated
    description: escalations the on-call handled and closed
    driven-by: [+stock.alerts-escalated]
    equation: (1 - reopen-share) * stock.alerts-escalated / answer-time
    sensor: {items: alert, entering: closed, where: {via: on-call}, over: 10m}
  alerts-reopened:
    from: alerts-escalated
    to: alerts-triaged
    description: escalations the on-call sent back for more investigation (rework)
    driven-by: [+stock.alerts-escalated]
    equation: reopen-share * stock.alerts-escalated / answer-time
    sensor: {items: alert, entering: triaged, where: {via: reopened}, over: 10m}

goals:                                # an item step's goal: nothing waits, so its block works each item as it comes
  new-alerts-triaged:
    stock: new-alerts
    hold: "<= 0"
    tolerance: 0                      # no hysteresis: a tolerance here would let alerts pile up before triage starts
    description: every alert triaged as it fires
  facets-opened:
    stock: alerts-triaged
    hold: "<= 0"
    tolerance: 0
    description: every alert worth a look has its facets open
  investigations-joined:
    stock: alerts-investigating
    hold: "<= 3"
    tolerance: 1
    description: at most three alerts wait on their facets at once (the investigators keep up with the fan-out)
  summaries-written:
    stock: alerts-summarising
    hold: "<= 0"
    tolerance: 0
    description: no investigated alert waits for its summary
  escalations-answered:
    stock: alerts-escalated
    hold: "<= 0"
    tolerance: 0
    owner: on-call
    description: no escalation waits for the on-call (they are asked while one does)

blocks:
  triage:
    type: ai
    agent: claude
    description: reads the alert and its service's recent history; dismisses noise, passes the rest on
    goal: new-alerts-triaged
    prompt: prompts/triage.md
    run: python3 bin/step.py triage      # the stand-in; leave run: out to give the prompt to claude -p
    takes: {kind: alert, at: new, to: [triaged, dismissed]}
    pool: 2
    out: [flow.alerts-triaged, flow.alerts-dismissed]
  fan-out:
    type: program
    description: opens one facet item per line of inquiry (logs, deploys, metrics), each citing its alert
    goal: facets-opened
    run: python3 bin/step.py fan-out
    takes: {kind: alert, at: triaged, to: [investigating]}
    pool: 2
    out: [flow.facets-opened-for, flow.facets-opened]
  summarise:
    type: ai
    agent: claude
    description: writes the alert's summary from its facets' findings; closes it, or escalates it to the on-call
    goal: summaries-written
    prompt: prompts/summarise.md
    run: python3 bin/step.py summarise   # the stand-in
    takes: {kind: alert, at: summarising, to: [closed, escalated]}
    pool: 2
    out: [flow.alerts-summarised, flow.alerts-escalated]
  on-call:
    type: person
    agent: on-call
    description: the on-call engineer answers each escalation in the pager - handled, or back for more
    ask: "Answer the escalated alerts in the pager: handle each, or send it back for more investigation"
    goal: escalations-answered
    out: [flow.escalations-handled, flow.alerts-reopened]
