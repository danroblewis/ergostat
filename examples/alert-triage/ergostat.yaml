# Alert triage: each alert from the pager is triaged, investigated along three lines at once (logs, deploys,
# metrics: a facet item each), summarised once every facet is done, and closed, or escalated to the on-call
# engineer, who handles it or sends it back for more. The reference model for docs/MODELLING-WELL.md: every part
# named for what it is, with its unit and a description; every flow an equation; one goal per loop, with its
# setpoint and tolerance; the AI and person steps marked; the fan-out and the join recorded as caused (causedby),
# so the Process view draws them. Everything is a stand-in (bin/step.py, bin/watch.py): no AI is called.
name: alert-triage
include:
  - model/*.yaml
systems:
  alerts:
    description: the alert's way from the pager to closed - triage, the fan-out, the summary, the on-call
    show: [stock.new-alerts, stock.alerts-investigating, stock.alerts-escalated]
  investigation:
    description: the facets each alert is investigated along, one item each, worked in parallel and joined
    show: [stock.open-facets]
agents:
  claude:
    kind: ai
    at-once: 4
    description: the AI agents that triage, investigate and summarise (stand-ins here, bin/step.py)
  on-call:
    kind: person
    description: the on-call engineer, who answers escalated alerts in the pager
