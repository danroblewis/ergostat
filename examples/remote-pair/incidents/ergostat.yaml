# The remote: an incident desk, run by its own ergostat (the on-call team's). Incidents arrive as files in
# queue/; a responder works them off while more than 6 are open. Another ergostat (../support) reads this one's
# model, readings and events through its remote API, and never runs any of it.
name: incidents

items:
  incident:
    id: incident/*
    states: [open, resolved]
    on:
      incident.opened: open
      incident.resolved: resolved
    system: response

systems:
  triage:
    description: incidents arriving and waiting
  response:
    description: incidents worked to resolved

stocks:
  open:
    unit: incidents
    system: triage
    description: incidents open, waiting for a responder
    sensor:
      run: mkdir -p queue; ls queue | wc -l
      every: 3s

flows:
  opened:
    to: open
    system: triage
  resolved:
    from: open
    system: response

goals:
  few-open:
    stock: open
    hold: "<= 6"
    tolerance: 2
    system: response

agents:
  on-call:
    kind: person
    description: whoever holds the pager (here, a script stands in)

blocks:
  pager:                         # stands in for the world paging the team: 0 to 3 incidents every 3s
    type: program
    system: triage
    every: 3s
    run: >-
      mkdir -p queue; n=$(( $(date +%s) % 4 )); i=0;
      while [ $i -lt $n ]; do f=$(mktemp queue/inc.XXXXXX); echo "{\"event\": \"incident.opened\", \"item\": \"incident/${f#queue/}\"}"; i=$((i+1)); done;
      echo "{\"moved\": $n}"
    out: flow.opened
  responder:                     # works the queue down while few-open is off, two at a time
    type: program
    system: response
    goal: few-open
    until: "<= 4"
    run: >-
      ls queue | head -2 > .batch;
      for f in $(cat .batch); do rm -f "queue/$f"; echo "{\"event\": \"incident.resolved\", \"item\": \"incident/$f\"}"; done;
      echo "{\"moved\": $(wc -l < .batch | tr -d ' ')}"
    out: flow.resolved

uses:
  modelling:
    use: modelling                    # the model improved as a loop of its own: what check finds is its work (SPEC §12e)
