# The remote: an incident desk, run by its own ergostat (the on-call team's). Incidents arrive as files in
# queue/; a responder works them off while more than 6 are open. Another ergostat (../support) reads this one's
# model, readings and events through its remote API, and never runs any of it.
name: incidents

systems:
  triage:
    description: incidents arriving and waiting
  response:
    description: incidents worked to resolved

stocks:
  open:
    unit: incidents
    system: triage
    description: incidents open, waiting for a responder
    sensor:
      run: mkdir -p queue; ls queue | wc -l
      every: 3s

flows:
  opened:
    to: open
    system: triage
  resolved:
    from: open
    system: response

goals:
  few-open:
    stock: open
    hold: "<= 6"
    tolerance: 2
    system: response

agents:
  on-call:
    kind: person
    description: whoever holds the pager (here, a script stands in)

blocks:
  pager:                         # stands in for the world paging the team: 0 to 3 incidents every 3s
    type: program
    system: triage
    every: 3s
    run: mkdir -p queue; n=$(( $(date +%s) % 4 )); i=0; while [ $i -lt $n ]; do mktemp queue/inc.XXXXXX > /dev/null; i=$((i+1)); done; echo $n
    out: flow.opened
  responder:                     # works the queue down while few-open is off, two at a time
    type: program
    system: response
    goal: few-open
    until: "<= 4"
    run: ls queue | head -2 > .batch; (cd queue && xargs rm -f < ../.batch); wc -l < .batch
    out: flow.resolved
