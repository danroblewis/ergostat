# The modelling loop as the-job wired it by hand before `use: modelling` (ergostat 7d74a9f): the template must
# expand to exactly this (tests/test_modelling_template.py).
defaults:
  system: modelling

projections:
  session:                                   # each run of the improver: a Claude Code session, or the stand-in's
    query: key.startswith('session/')
    fields:
      state:
        values: [open, done, failed, lost]
    events:
      session-ran:
        when: type == 'session.ran'
        '...': data
        state: set('done')
      session-failed:
        when: type == 'session.failed'
        '...': data
        state: set('failed')
      session-lost:
        when: type == 'session.lost'
        '...': data
        state: set('lost')
      other:
        when: true
        '...': data
    show: [role, model, cost_usd, turns, seconds]

stocks:
  model-error:
    unit: "1"
    description: the scaled error of the model's replay on the record (the Fit page's total; lower is better)
    sensor:
      builtin: ergostat.model.fit
      every: 1m
  pending-changes:
    unit: changes
    description: changes to the model made and checked, waiting for the judge
    sensor:
      projection: ergostat.model-change
      state: checked
      every: 10s
  changes-testing:
    unit: changes
    description: changes being replayed on the record that comes after them
    sensor:
      projection: ergostat.model-change
      state: testing
      every: 10s
  passed-changes:
    unit: changes
    description: passed by the judge, waiting to be written (by the owner, for a change to the structure)
    sensor:
      projection: ergostat.model-change
      state: passed
      every: 10s
  accepted-changes:
    unit: changes
    description: changes accepted and written into the model
    cumulative: true                          # every change written so far
    sensor:
      projection: ergostat.model-change
      state: accepted
      every: 10s

flows:
  model-drift:                                # the record moving on, and the week changing under the model: nothing in the model drives it
    to: model-error
    two-way: true
    description: whatever moved the error that the changes written do not account for, rises and falls alike
    sensor:
      changes: rest
      over: 10m
      every: 1m
  model-mended:
    from: model-error
    description: what the changes written took off the error, each as Accept measured it (its fit before minus after)
    driven-by:                                # a change written lowers the error at once; the more error, the more there is to mend
      - +stock.model-error
      - {cause: +flow.changes-accepted, instant: true}
    sensor:
      projection: ergostat.model-change
      entering: accepted
      sum: fit_gained
      over: 10m
  changes-made:
    to: pending-changes
    sensor:
      projection: ergostat.model-change
      entering: checked
      over: 10m
  changes-superseded:                         # made against a version of the model since changed
    from: pending-changes
    driven-by: +stock.pending-changes
    sensor:
      projection: ergostat.model-change
      entering: superseded
      over: 10m
  tests-started:
    from: pending-changes
    to: changes-testing
    driven-by: +stock.pending-changes
    sensor:
      projection: ergostat.model-change
      entering: testing
      over: 10m
  changes-passed:
    from: changes-testing
    to: passed-changes
    driven-by: +stock.changes-testing
    sensor:
      projection: ergostat.model-change
      entering: passed
      over: 10m
  changes-failed:
    from: changes-testing
    driven-by: +stock.changes-testing
    sensor:
      projection: ergostat.model-change
      entering: failed
      over: 10m
  changes-accepted:
    from: passed-changes
    to: accepted-changes
    driven-by: +stock.passed-changes
    sensor:
      projection: ergostat.model-change
      entering: accepted
      over: 10m

goals:
  model-fits:
    stock: model-error
    hold: "<= 0.05"
    description: the model follows the record (its replay's scaled error at most 0.05)

blocks:
  improver:
    type: ai
    goal: model-fits
    prompt: prompts/improver.md
    run: python3 bin/improver.py              # JOB_AI=claude: a Claude Code session with ergostat's tools; otherwise a stand-in
    every: 3m
    timeout: 15m
    out: flow.changes-made
  judge:
    type: judge                               # ergostat's judge (SPEC §12e): each change replayed on the record after it
    every: 30s
    hold-out: 4m                              # judged on four minutes of record after it was made ...
    windows: [1, 2, 4]                        # ... whole, in halves and in quarters
    threshold: 2%                             # passed when better by 2% in every one
    accept:
      parameter: auto                         # a value passed is written at once; the structure waits for me
    in:
      waiting: +stock.pending-changes
      testing: +stock.changes-testing
    out:
      testing: flow.tests-started
      passed: flow.changes-passed
      failed: flow.changes-failed
      accepted: flow.changes-accepted
