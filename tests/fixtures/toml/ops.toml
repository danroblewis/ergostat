# A small platform: one host's disk, the database's backups, a job queue, and their overlaps.
name = "ops"

[[system]]
name = "host"
description = "the machine everything runs on"

[[system]]
name = "backups"
description = "the database's backups and their off-site copies"

[[system]]
name = "jobs"
description = "the background job queue and its worker pool"

# ---- the host's disk (also filled by the job workers' logs)

[[stock]]
name = "disk-used"
unit = "%"
systems = ["host", "jobs"]

[[disturbance]]
name = "logs-written"
into = "disk-used"

[[flow]]
name = "cleaned"
from = "disk-used"

[[sensor]]
name = "disk-usage"
measures = "disk-used"
agent = "disk-cleaner"

[[controller]]
name = "disk-under-80"
holds = "disk-used"
setpoint = "<= 80"
tolerance = 2
reads = ["disk-usage"]
drives = ["delete-old-files"]
agent = "disk-cleaner"

[[valve]]
name = "delete-old-files"
flow = "cleaned"
agent = "disk-cleaner"

# ---- the job queue

[[stock]]
name = "jobs-waiting"
unit = "jobs"
systems = ["jobs"]
description = "the queue's backlog: the pub/sub subscription's unacknowledged messages"

[[disturbance]]
name = "jobs-arriving"
into = "jobs-waiting"
description = "requests from users, in bursts"

[[flow]]
name = "jobs-done"
from = "jobs-waiting"

[[sensor]]
name = "queue-depth"
measures = "jobs-waiting"
agent = "worker-pool"

[[controller]]
name = "queue-short"
holds = "jobs-waiting"
setpoint = "<= 20"
tolerance = 5
reads = ["queue-depth"]
drives = ["process-jobs"]
agent = "autoscaler"
description = "opens the pool wider (more workers) when the backlog grows"

[[valve]]
name = "process-jobs"
flow = "jobs-done"
agent = "worker-pool"
description = "the worker pool: how far it is open is how many workers run"

# ---- backups

[[stock]]
name = "hours-since-backup"
unit = "h"
systems = ["backups"]

[[disturbance]]
name = "time-passing"
into = "hours-since-backup"
rate = 1800       # known, not estimated: one simulated hour every two seconds

[[flow]]
name = "backed-up"
from = "hours-since-backup"

[[stock]]
name = "copies-not-offsite"
unit = "backups"
systems = ["backups"]

[[flow]]
name = "new-backups"
to = "copies-not-offsite"

[[flow]]
name = "sent-offsite"
from = "copies-not-offsite"

[[sensor]]
name = "backup-age"
measures = "hours-since-backup"
agent = "age-check"

[[controller]]
name = "backup-fresh"
holds = "hours-since-backup"
setpoint = "<= 24"
tolerance = 2
reads = ["backup-age"]
drives = ["run-backup"]
agent = "backup-policy"

[[valve]]
name = "run-backup"
flow = "backed-up"
agent = "backup-job"

[[valve]]
name = "record-backup"
flow = "new-backups"
agent = "backup-job"

[[sensor]]
name = "offsite-lag"
measures = "copies-not-offsite"
agent = "offsite-sync"

[[controller]]
name = "offsite-current"
holds = "copies-not-offsite"
setpoint = "<= 1"
tolerance = 1
reads = ["offsite-lag"]
drives = ["copy-offsite"]
agent = "offsite-sync"

[[valve]]
name = "copy-offsite"
flow = "sent-offsite"
agent = "offsite-sync"

# ---- agents

[[agent]]
name = "disk-cleaner"
kind = "program"
command = "python3 clean.py"
every = "3s"

[[agent]]
name = "worker-pool"
kind = "program"
command = "python3 pool.py"
every = "2s"

[[agent]]
name = "autoscaler"
kind = "rule"
command = "python3 scaler.py"
every = "4s"

[[agent]]
name = "age-check"
kind = "program"
command = "python3 age_check.py"
every = "2s"

[[agent]]
name = "backup-policy"
kind = "rule"
command = "python3 policy.py"
on = ["loop.off@backup-fresh"]

[[agent]]
name = "backup-job"
kind = "program"
command = "python3 backup.py"
on = ["backup.requested"]

[[agent]]
name = "offsite-sync"
kind = "program"
command = "python3 offsite.py"
every = "7s"

[[agent]]
name = "on-call"
kind = "person"
description = "gets paged when a loop stays off; fills no role yet"
