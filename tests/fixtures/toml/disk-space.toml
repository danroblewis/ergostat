# A host's disk, held under 80% by one program that measures, decides and cleans.
name = "disk-space"

[[system]]
name = "host"
description = "one machine's disk"

[[stock]]
name = "disk-used"
unit = "%"
systems = ["host"]
description = "how full the data disk is"

[[disturbance]]
name = "logs-written"
into = "disk-used"
description = "what the services write; nothing here controls it"

[[flow]]
name = "cleaned"
from = "disk-used"
description = "old files removed"

[[sensor]]
name = "disk-usage"
measures = "disk-used"
agent = "disk-cleaner"

[[controller]]
name = "disk-under-80"
holds = "disk-used"
setpoint = "<= 80"
tolerance = 2
reads = ["disk-usage"]
drives = ["delete-old-files"]
agent = "disk-cleaner"
description = "keep room for the services to write"

[[valve]]
name = "delete-old-files"
flow = "cleaned"
agent = "disk-cleaner"

[[agent]]
name = "disk-cleaner"
kind = "program"
command = "python3 clean.py"
every = "3s"
description = "measures the disk and deletes the oldest files when it is over"
