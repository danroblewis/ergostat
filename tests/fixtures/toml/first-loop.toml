name = "first-loop"

[[stock]]
name = "inbox"
unit = "files"

[[disturbance]]
name = "arrivals"
into = "inbox"
agent = "dropper"

[[flow]]
name = "processed"
from = "inbox"

[[sensor]]
name = "count-inbox"
measures = "inbox"
agent = "counter"

[[controller]]
name = "inbox-small"
holds = "inbox"
setpoint = "<= 20"
tolerance = 5
reads = ["count-inbox"]
drives = ["process"]
agent = "worker"

[[valve]]
name = "process"
flow = "processed"
agent = "worker"

[[agent]]
name = "counter"
command = "mkdir -p inbox; ls inbox | wc -l"
every = "5s"

[[agent]]
name = "worker"
command = "ls inbox | head -5 > .batch; (cd inbox && xargs rm -f < ../.batch); wc -l < .batch"
every = "10s"

[[agent]]
name = "dropper"
command = "mkdir -p inbox; for i in 1 2 3; do mktemp inbox/job.XXXXXX > /dev/null; done"
every = "5s"
