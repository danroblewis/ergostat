# This Mac, measured for real and changed by nobody: the programs only read. The loops are held by
# a person (the owner), whose valves are manual: ergostat measures and draws, and never acts here.
name = "this-mac"

[[system]]
name = "machine"
description = "this computer"

[[stock]]
name = "disk-used"
unit = "%"
systems = ["machine"]
description = "the startup disk, as df reports it"

[[disturbance]]
name = "files-written"
into = "disk-used"
description = "everything that writes to the disk"

[[flow]]
name = "space-freed"
from = "disk-used"

[[stock]]
name = "downloads"
unit = "files"
systems = ["machine"]
description = "files in ~/Downloads"

[[disturbance]]
name = "downloaded"
into = "downloads"

[[flow]]
name = "tidied"
from = "downloads"

[[stock]]
name = "load"
unit = "runnable"
systems = ["machine"]
description = "the one-minute load average"

[[sensor]]
name = "df"
measures = "disk-used"
agent = "meter"

[[sensor]]
name = "downloads-count"
measures = "downloads"
agent = "meter"

[[sensor]]
name = "uptime"
measures = "load"
agent = "meter"

[[controller]]
name = "disk-has-room"
holds = "disk-used"
setpoint = "<= 90"
reads = ["df"]
drives = ["free-space"]
agent = "owner"

[[valve]]
name = "free-space"
flow = "space-freed"
mode = "manual"
agent = "owner"

[[controller]]
name = "downloads-tidy"
holds = "downloads"
setpoint = "<= 500"
reads = ["downloads-count"]
drives = ["tidy-downloads"]
agent = "owner"

[[valve]]
name = "tidy-downloads"
flow = "tidied"
mode = "manual"
agent = "owner"

[[agent]]
name = "meter"
kind = "program"
command = "bin/meter.sh"
every = "30s"
description = "reads df, ~/Downloads and uptime; changes nothing"

[[agent]]
name = "owner"
kind = "person"
description = "frees space and tidies downloads, when they choose to"
