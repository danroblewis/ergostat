template: re-ping
description: Asking again until answered, up to a count; then a person takes it over.
reading: |
  System dynamics: a stock of questions unanswered, filled as they are asked and drained as answers arrive (the
  source reports them), or as they are given up on, into a second stock a person clears. The pings sent are a
  running total (a cumulative stock), and the answers follow them (an influence, dashed: the other side answers
  because it was reminded).
  Control: an on-off controller on the age of the oldest unanswered question, with its setpoint at one period
  (`every`); while it is off, the pinger reminds each question whose last reminder is a period old. The count
  limit (`limit`) is saturation with an escalation ladder: past it the actuator stops acting on that question and
  hands it to the next rung, a person (`take-over`), held by a second goal: nothing given up waits.
example: |
  uses:
    asked-of-others:
      use: re-ping
      with:
        every: 1d
        limit: 3
        command: ./bin/my-open-asks.sh        # the questions I asked and am waiting on; an answered one has "event": "answered"
        ping: ./bin/remind.sh                 # writes the reminder as a draft for me to send
params:
  projection:
    type: name
    default: ${name}
    description: the projection; its ids are PROJECTION/<id>; its events PROJECTION.arrived, PROJECTION.pinged, PROJECTION.answered, PROJECTION.gave-up
  every:
    type: duration
    default: 1d
    description: how long between reminders (and before the first)
  limit:
    type: integer
    default: 3
    description: how many reminders before giving up and handing it to a person
  command:
    type: command
    stand-in: a made-up feed of questions, each answered after a while
    description: 'the source, a command printing records as JSON, each with an id; a record with "event": "answered" says that one was answered'
  url:
    type: url
    stand-in: a made-up feed of questions, each answered after a while
    description: the source, an HTTP endpoint answering with the records
  headers:
    type: strings
    description: 'HTTP headers for url, each "Name: value"'
  id-field:
    default: id
    description: the field of a record that names it
  poll:
    type: duration
    default: 1m
    description: how often the source is read
  stand-in-rate:
    type: number
    default: 60
    description: the stand-in feed's questions per hour
  stand-in-answer-after:
    type: duration
    default: 2m
    description: about how long the stand-in's questions take to be answered
  ping:
    type: command
    stand-in: a pretend reminder, nothing sent
    description: the command that sends one reminder, given the item on standard input and $PING_N; exit 0 when sent
  take-over:
    default: Questions went unanswered after every reminder. Take each over yourself, then say so.
    description: what a person is asked once a question is given up on; false for nobody
projections:
  ${projection}:
    id: ${projection}/*
    description: something asked of someone else, waiting for their answer
    states: [waiting, answered, given-up]
    on:
      ${projection}.answered: answered
      ${projection}.gave-up: given-up
    fold:
      pings: sum
    show: [title, from, pings]
stocks:
  unanswered:
    unit: questions
    description: asked, not answered yet (reminded or not)
    sensor:
      projection: ${projection}
      state: waiting
      every: 10s
  given-up:
    unit: questions
    description: reminded the most times, still unanswered, for a person to take over
    sensor:
      projection: ${projection}
      state: given-up
      every: 10s
  pings-sent:
    unit: pings
    cumulative: true
    description: every reminder sent, a running total
auxiliaries:
  oldest:
    unit: h
    description: how long the oldest unanswered question has waited, in hours
    driven-by: [+stock.unanswered]
    sensor:
      projection: ${projection}
      state: waiting
      measure: oldest
      every: 10s
flows:
  asked:
    to: unanswered
    description: questions asked, as the collector sees them
    sensor:
      run: ${lib} collect --name ${name} --projection ${projection} ${command:arg} ${url:arg} ${headers:arg} --id-field ${id-field:quote} --stand-in ${stand-in-rate} --answer-after ${stand-in-answer-after:seconds} --window 600
      every: ${poll}
      averages: 10m
  answered:
    from: unanswered
    description: questions the other side answered
    driven-by: [+stock.unanswered]
    sensor:
      projection: ${projection}
      entering: answered
      over: 10m
  giving-up:
    from: unanswered
    to: given-up
    description: questions given up on after the last reminder
  pinging:
    to: pings-sent
    description: reminders sent
  taken-over:
    if: ${take-over}
    from: given-up
    description: questions a person took over
goals:
  reminded:
    auxiliary: oldest
    hold: "<= ${every:hours}"
    description: no question waits longer than a period without a reminder
  none-given-up:
    if: ${take-over}
    stock: given-up
    hold: "<= 0"
    description: every question given up on is taken over by a person
blocks:
  pinger:
    type: program
    goal: reminded
    run: ${lib} ping --projection ${projection} --state waiting --every ${every:seconds} --limit ${limit} --run ${ping:quote} --pinged-flow flow.pinging --gave-up-flow flow.giving-up
    every: 30s
    out: [flow.pinging, flow.giving-up]
  take-over:
    if: ${take-over}
    type: person
    goal: none-given-up
    ask: ${take-over}
    out: flow.taken-over
