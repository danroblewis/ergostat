template: modelling
once: true
description: The model improved as a loop of its own (SPEC §12e) - its fit a stock held by a goal, everything check finds held as requests, tiers that answer them (the fixer, a program of mechanical fixes, then an AI agent when asked), an improver for the fit, and ergostat's judge that tests each change and writes what the policy allows.
reading: |
  System dynamics: the model's error is a stock (model-error, read by ergostat's built-in measure
  ergostat.model.fit, the Fit page's total), drained as changes are written (model-mended) and moved either way by
  everything else (model-drift). Each flow is measured as what it claims: model-mended sums what each change written
  took off the error (its fit_gained, the fit before minus after as Accept measured it), so a fall with no change
  written never shows in it; model-drift is the residual, the error's net change less model-mended, two-way: the
  record moving on, the world drifting from the model, and a better fit that no change explains. It is one flow, not
  drift beside an "unexplained improvement", because nothing measures the two apart. The changes to the model are items of
  ergostat's built-in kind ergostat.model-change, whoever made them (the improver's propose lines and ergostat's own
  finders alike), counted by state as an aging chain: made and checked (pending-changes), under test
  (changes-testing), passed (passed-changes), written (accepted-changes, a running total); a change made against a
  version of the model since changed leaves as superseded, one the judge fails leaves as failed.
  What check finds (its findings, a kind's chain, the craft notes, the coherence mismatches once there is record) is
  work for it too: each a request (ergostat.model-request), raised by a collector (requests-raised), counted while it
  is not answered (unanswered-requests) and answered when check no longer finds it. The tiers answer them, the
  cheapest first: the rule tier (fixer, a program: the chain's rewiring, units carried along a flow, a first-order
  outflow, an event type named the kind's way) and, when asked (ai: true), the AI tier (modeller, an AI agent given
  each request with the model near it and the modelling guides). Both propose ordinary changes; the judge decides.
  Control: two balancing loops that close the long way. The goal model-fits holds model-error at or under `fit`;
  while it is off the improver runs (an AI agent reading the model as a senior modeller would, a program, or a
  person) and proposes changes with their evidence; the judge (a built-in block, at most one a model) replays each
  beside the model as it is on the record that comes after it, in several windows, passes it only when it is better
  in every one, and writes what `accept` allows (nothing by default: the owner accepts in the review queue on the
  Fit page). What is written lowers the error, which the measure then sees. The goal requests-handled holds the
  unanswered requests at 0: while it is off the tiers run, their changes are judged, and what is written answers them.
  It is used once a model, and its parts keep the names written here (model-error, model-fits, improver, fixer,
  modeller, judge),
  in a system named for the use (modelling, by convention).
example: |
  uses:
    modelling:
      use: modelling
      with:
        fit: 0.05                     # the model's replay may be off by a scaled error of at most 0.05
        ai: true                      # the AI tier answers what the rule tier cannot (haiku by default; it costs)
        accept:
          parameter: auto             # a value the judge passes is written at once
          description: auto           # so is a description, a unit and an equation; the structure waits for the owner
          unit: auto
          equation: auto
params:
  rung:
    type: rung
    default: ai
    description: who improves the model (ai, program or person); a person is asked, and proposes with ergostat improve
  prompt:
    type: path
    default: ${folder}/improver.md
    description: the improver's prompt, when rung is ai (a file, or the text); ergostat's own by default, which reviews any model
  run:
    type: command
    default: ${lib} standin improver
    stand-in: an improver that proposes nothing of its own, and asks ergostat's own finders to look again
    description: 'the improver''s command: for ai, a wrapper given the prompt on standard input (empty, "", gives it to claude -p); for program, the program, which prints propose lines'
  ask:
    default: The model has drifted from the record. Review it and propose changes with their evidence (ergostat improve; the Fit page's review queue).
    description: what a person is asked, when rung is person
  model:
    description: the model an ai improver's session uses, when run is empty (else the agent's, or claude's default)
  every:
    type: duration
    default: 3m
    description: the least time between the improver's runs while the model's fit is off its goal
  timeout:
    type: duration
    default: 15m
    description: how long one run of the improver may take
  sessions:
    type: bool
    default: false
    description: keep each run of the improver as an item of kind session (session/*, its role, model, cost, turns and time), for an improver that reports session.ran, session.failed and session.lost
  rules:
    type: bool
    default: true
    description: the rule tier, a program that answers the requests a mechanical change answers safely and certainly
  rules-every:
    type: duration
    default: 1m
    description: the least time between the rule tier's runs while requests wait
  ai:
    type: bool
    default: false
    description: the AI tier, an AI agent (claude -p) given the requests the rule tier cannot answer, with the model near each and the modelling guides; off by default, so a fresh model costs nothing
  ai-model:
    default: haiku
    description: the model the AI tier's session uses
  ai-every:
    type: duration
    default: 10m
    description: the least time between the AI tier's runs while requests wait for it
  ai-most:
    type: number
    default: 8
    description: the requests given to one AI call
  redesign:
    type: any
    default: {when: auto, model: haiku, budget: 0.5, rounds: 3}
    description: 'the redesigner, with ai: true (SPEC §12e, Redesign): one change set of many edits for a whole system, judged by a scorecard; when (auto: when the model is clearly wrong, on its first run, or when the owner asks; ask: only when asked, by ergostat improve --redesign or the Model page; off), model (haiku), budget (dollars a run, 0.5), rounds (on its scratch copy, 3). Never written without the owner unless accept: {redesign: auto}'
  redesign-every:
    type: duration
    default: 10m
    description: the least time between the redesigner's runs while requests wait (each run does nothing unless the model is clearly wrong or the owner asked)
  requests-every:
    type: duration
    default: 2m
    description: how often check is read again for requests (each a finding, a craft note, or a coherence mismatch)
  fit:
    type: number
    default: 0.05
    description: the most scaled error the model's replay may have and still fit (the goal model-fits)
  fit-every:
    type: duration
    default: 1m
    description: how often the model's fit is measured
  count-every:
    type: duration
    default: 10s
    description: how often the changes are counted by state
  over:
    type: duration
    default: 10m
    description: the window the flows of changes, and the error's rises and falls, are measured over
  judge-every:
    type: duration
    default: 30s
    description: how often the judge passes over the changes waiting
  hold-out:
    type: duration
    description: 'how much record after a change it is judged on (the judge''s own default: 10m)'
  windows:
    type: any
    description: 'how that record is split: 1 whole, 2 halves, 4 quarters (the judge''s own default: [1, 2, 4])'
  threshold:
    description: 'the least fall in scaled error that counts as better, like 2% (the judge''s own default)'
  warm-up:
    type: duration
    description: 'the longest before each window its replay starts (the judge''s own default: 6h)'
  accept:
    type: any
    description: 'who writes a change the judge passed: owner or auto, or a map of kind (parameter, equation, structure, description, unit, rename, redesign) to either (the judge''s own default: owner for every kind; a change that rewires a chain or removes a part always waits for the owner; a redesign is written by the judge only when named, redesign: auto, never by accept: auto)'
items:
  session:
    if: ${sessions}
    id: session/*
    states: [open, done, failed, lost]
    on:
      session.ran: done
      session.failed: failed
      session.lost: lost
    show: [role, model, cost_usd, turns, seconds]
stocks:
  model-error:
    unit: "1"
    description: the scaled error of the model's replay on the record (the Fit page's total; lower is better)
    sensor:
      builtin: ergostat.model.fit
      every: ${fit-every}
  pending-changes:
    unit: changes
    description: changes to the model made and checked, waiting for the judge
    sensor:
      items: ergostat.model-change
      state: checked
      every: ${count-every}
  changes-testing:
    unit: changes
    description: changes being replayed on the record that comes after them
    sensor:
      items: ergostat.model-change
      state: testing
      every: ${count-every}
  passed-changes:
    unit: changes
    description: passed by the judge, waiting to be written (by the owner, for a change to the structure)
    sensor:
      items: ergostat.model-change
      state: passed
      every: ${count-every}
  unanswered-requests:
    unit: requests
    description: what check finds that no change has answered yet (open, with a change waiting, or held for the owner or the AI tier)
    sensor:
      items: ergostat.model-request
      state: [open, proposed, held]
      every: ${count-every}
  answered-requests:
    unit: requests
    description: requests answered, check no longer finding them
    cumulative: true
    sensor:
      items: ergostat.model-request
      state: answered
      every: ${count-every}
  accepted-changes:
    unit: changes
    description: changes accepted and written into the model
    cumulative: true
    sensor:
      items: ergostat.model-change
      state: accepted
      every: ${count-every}
flows:
  model-drift:                        # the record moving on, and the world changing under the model: nothing in the model drives it
    to: model-error
    two-way: true
    description: whatever moved the error that the changes written do not account for, rises and falls alike
    sensor:
      changes: rest
      over: ${over}
      every: ${fit-every}
  model-mended:
    from: model-error
    description: what the changes written took off the error, each as Accept measured it (its fit before minus after)
    driven-by:                        # a change written lowers the error at once; the more error, the more there is to mend
      - +stock.model-error
      - {cause: +flow.changes-accepted, instant: true}
    sensor:
      items: ergostat.model-change
      entering: accepted
      sum: fit_gained
      over: ${over}
  changes-made:
    to: pending-changes
    description: changes made by the improver and ergostat's own finders (each checked at once, or refused)
    sensor:
      items: ergostat.model-change
      entering: made
      where: {made_by: [improver, improver-by-hand, ergostat, owner]}
      over: ${over}
  changes-made-by-fixer:
    if: ${rules}
    to: pending-changes
    description: changes the rule tier made for the requests (each checked at once, or refused)
    driven-by: +stock.unanswered-requests
    sensor:
      items: ergostat.model-change
      entering: made
      where: {made_by: fixer}
      over: ${over}
  changes-made-by-redesigner:
    if: ${ai}
    unless: ${redesign.when|auto} == off
    to: pending-changes
    description: change sets the redesigner made, each many edits judged together (or refused)
    driven-by: +stock.unanswered-requests
    sensor:
      items: ergostat.model-change
      entering: made
      where: {made_by: redesigner}
      over: ${over}
  changes-made-by-modeller:
    if: ${ai}
    to: pending-changes
    description: changes the AI tier made for the requests (each checked at once, or refused)
    driven-by: +stock.unanswered-requests
    sensor:
      items: ergostat.model-change
      entering: made
      where: {made_by: modeller}
      over: ${over}
  requests-raised:
    to: unanswered-requests
    description: what check finds, raised as requests (and those found again)
    sensor:
      run: ${lib} modelling requests --window ${over:seconds}
      every: ${requests-every}
      description: check, read for requests
  requests-answered:
    from: unanswered-requests
    to: answered-requests
    description: requests check no longer finds, most often as a change is written
    driven-by:
      - +stock.unanswered-requests
      - {cause: +flow.changes-accepted, instant: true}
    sensor:
      items: ergostat.model-request
      entering: answered
      over: ${over}
  changes-superseded:                 # made against a version of the model since changed
    from: pending-changes
    driven-by: +stock.pending-changes
    sensor:
      items: ergostat.model-change
      entering: superseded
      over: ${over}
  tests-started:
    from: pending-changes
    to: changes-testing
    driven-by: +stock.pending-changes
    sensor:
      items: ergostat.model-change
      entering: testing
      over: ${over}
  changes-passed:
    from: changes-testing
    to: passed-changes
    driven-by: +stock.changes-testing
    sensor:
      items: ergostat.model-change
      entering: passed
      over: ${over}
  changes-failed:
    from: changes-testing
    driven-by: +stock.changes-testing
    sensor:
      items: ergostat.model-change
      entering: failed
      over: ${over}
  changes-accepted:
    from: passed-changes
    to: accepted-changes
    driven-by: +stock.passed-changes
    sensor:
      items: ergostat.model-change
      entering: accepted
      over: ${over}
goals:
  requests-handled:
    stock: unanswered-requests
    hold: "<= 0"
    tolerance: 0
    description: everything check finds answered (no request left unanswered)
  model-fits:
    stock: model-error
    hold: "<= ${fit}"
    description: the model follows the record (its replay's scaled error at most ${fit})
blocks:
  improver:
    if: ${rung} != person
    type: ${rung}
    goal: model-fits
    prompt:
      if: ${rung} == ai
      value: ${prompt}
    run:
      if: ${run}
      value: ${run}
    model: ${model}
    every: ${every}
    timeout: ${timeout}
    out: flow.changes-made
  improver-by-hand:
    if: ${rung} == person
    type: person
    goal: model-fits
    ask: ${ask}
    out: flow.changes-made
  fixer:
    if: ${rules}
    type: program
    description: the rule tier, answering the requests a mechanical change answers safely and certainly
    goal: requests-handled
    run: ${lib} modelling rules
    every: ${rules-every}
    timeout: ${timeout}
    in: +stock.unanswered-requests
    out: flow.changes-made-by-fixer
  modeller:
    if: ${ai}
    type: ai
    description: the AI tier, answering the requests the rule tier cannot, with the model near each and the modelling guides
    goal: requests-handled
    prompt: ${folder}/modeller.md
    run: ${lib} modelling ai --model ${ai-model} --most ${ai-most}
    model: ${ai-model}
    every: ${ai-every}
    timeout: ${timeout}
    in: +stock.unanswered-requests
    out: flow.changes-made-by-modeller
  redesigner:
    if: ${ai}
    unless: ${redesign.when|auto} == off
    type: ai
    description: the redesigner, proposing one change set for a whole system when the model is clearly wrong or the owner asks
    goal: requests-handled
    prompt: ${folder}/redesigner.md
    run: ${lib} modelling redesign --when ${redesign.when|auto} --model ${redesign.model|haiku} --budget ${redesign.budget|0.5} --rounds ${redesign.rounds|3}
    model: ${redesign.model|haiku}
    every: ${redesign-every}
    timeout: ${timeout}
    in: +stock.unanswered-requests
    out: flow.changes-made-by-redesigner
  judge:
    type: judge                       # ergostat's judge (SPEC §12e): each change replayed on the record after it
    every: ${judge-every}
    hold-out: ${hold-out}
    windows: ${windows}
    threshold: ${threshold}
    warm-up: ${warm-up}
    accept: ${accept}
    in:
      waiting: +stock.pending-changes
      testing: +stock.changes-testing
    out:
      testing: flow.tests-started
      passed: flow.changes-passed
      failed: flow.changes-failed
      accepted: flow.changes-accepted
