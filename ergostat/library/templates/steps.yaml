template: steps
description: A projection worked through a list of steps in order, each step a block that takes the items at its state, one run per item, each leased; an item that fails every try is a dead letter, set aside for a person.
reading: |
  System dynamics: an aging chain (Sterman ch. 12) with a work-in-progress stage at every step: a stock of the
  items waiting at the step, drained by the step taking them into a stock of the items it is working on, drained in
  turn into the next step's queue (the last into a running total of items done). An item given back flows from the
  work at a step to its queue again (rework); one that fails every try leaves the chain for a stock set aside.
  Control: one balancing loop a step, each an on-off controller holding its queue at 0 whose actuator is that
  step's block. The block takes the items at its state: ergostat leases each to a run of its own (SPEC §9.5), at
  most `pool` at once; the run moves its item on (the lease's ack) or gives it back (a nack, its attempt counted).
  A run that goes silent past its lease's TTL loses the item, and it is taken again. After `tries` attempts at one
  step the item is a dead letter, and a person is asked (`unstick`): they fix the cause and give it another go
  (`ergostat lease ITEM --redrive`). A step is a program (`run:`) or an AI agent (`prompt:`), which may work in a
  workspace of its own per item (`workspace`) and ask for gated actions (`actions`). The list is extendable: add a
  step to `steps` and its stocks, flows, goal and block follow.
example: |
  uses:
    tickets:
      use: steps
      with:
        command: ./bin/new-tickets.sh       # the tickets of the type to work on, as JSON records with an id
        pool: 2                             # at most two of each step at once
        steps:
          - name: triage
            run: ./bin/triage.sh            # a program step: the item on standard input; exit 0 when done
          - name: reproduce
            run: ./bin/reproduce.sh
          - name: draft-fix                 # nothing to run: a stand-in that does nothing
params:
  projection:
    type: name
    default: ${name}
    description: the projection; ids PROJECTION/<id>; each step moves it with PROJECTION.<step>-done
  steps:
    type: list
    required: true
    description: 'the steps in order, each a name (lowercase, not done) or a map: {name, run} a program step, run its command, given the item on standard input (none: a stand-in that does nothing); {name, prompt} an AI agent step, prompt its prompt (a file or the text), which ends its work by saying {"event": "PROJECTION.<step>-done"} (or gives the item back, {"nack": "why"}), with model, tools (Claude Code''s tools it may use) and actions (the names of actions it may ask for) when wanted'
  command:
    type: command
    stand-in: a made-up feed
    description: where the items come from, a command printing records as JSON, each with an id
  url:
    type: url
    stand-in: a made-up feed
    description: where the items come from, an HTTP endpoint answering with records
  headers:
    type: strings
    description: 'HTTP headers for url, each "Name: value"'
  id-field:
    default: id
    description: the field of a record that names it
  poll:
    type: duration
    default: 1m
    description: how often the source is read
  stand-in-rate:
    type: number
    default: 60
    description: the stand-in feed's items per hour
  pool:
    type: integer
    default: 2
    description: the most items one step works on at once (a run, and a lease, each)
  tries:
    type: integer
    default: 3
    description: how many attempts a step makes on an item (a failure, or a run gone silent) before it is a dead letter
  timeout:
    type: duration
    default: 5m
    description: how long a program step's command may run on one item
  ai-timeout:
    type: duration
    default: 30m
    description: how long an AI agent step's session may run on one item
  ttl:
    type: duration
    description: how long a program step's run may go silent before its lease expires (else the program tier's, 5m, or the timeout when longer)
  ai-ttl:
    type: duration
    description: how long an AI agent step's run may go silent before its lease expires (else the AI tier's, 40m)
  workspace:
    type: map
    description: 'a pool of workspaces the AI agent steps work in, one per item, kept across its steps and attempts and cleaned once it is done (SPEC §12k): repo (required), size, branch, base, pool'
  actions:
    type: list
    description: 'the gated actions the AI agent steps may ask for (SPEC §12k), each {name, run, gate, args, class, description, wait, timeout, in}; a step names those it may use under actions:'
  unstick:
    default: Items were set aside after a step failed on them every try. Look at each, fix its cause, then give it another go (ergostat lease ITEM --redrive), or finish it yourself.
    description: what a person is asked about the dead letters; false for nobody
projections:
  ${projection}:
    match:
      key: ${projection}/*
    description: an item worked through the steps
    states:
      - each: steps
        value: ${it.name}
      - done
    events:
      each:
        each: steps
        key: ${projection}.${it.name}-done
        value: {state: "set('${it.next}')"}
    otherwise: rest
    show: [title, error, failed_at]
workspaces:
  workspace:
    if: ${workspace}
    value: ${workspace}
actions:
  ${it.name}:
    each: actions
    run: ${it.run}
    gate: ${it.gate}
    args: ${it.args}
    class: ${it.class}
    description: ${it.description}
    wait: ${it.wait}
    timeout: ${it.timeout}
    in: ${it.in}
stocks:
  ${it.name}:
    each: steps
    unit: items
    description: items waiting at step ${it.name}
    sensor:
      projection: ${projection}
      state: ${it.name}
      every: 10s
  ${it.name}-working:
    each: steps
    unit: items
    description: items step ${it.name} is working on, each leased to a run
    sensor:
      projection: ${projection}
      state: leased
      where:
        lease.back: ${it.name}
      every: 10s
  done:
    unit: items
    cumulative: true
    description: items through every step
    sensor:
      projection: ${projection}
      state: done
      every: 30s
  stuck:
    unit: items
    description: dead letters, set aside after a step failed on them every try
    sensor:
      projection: ${projection}
      state: dead
      every: 10s
flows:
  arriving:
    to: ${steps.first}
    description: items arriving, as the collector sees them
    sensor:
      run: ${lib} collect --name ${name} --projection ${projection} ${command:arg} ${url:arg} ${headers:arg} --id-field ${id-field:quote} --stand-in ${stand-in-rate} --window 600
      every: ${poll}
      averages: 10m
  ${it.name}-taken:
    each: steps
    from: ${it.name}
    to: ${it.name}-working
    description: items step ${it.name} took, each leased to a run
    sensor:
      projection: ${projection}
      entering: leased
      where:
        lease.back: ${it.name}
      over: 10m
  ${it.name}-done:
    each: steps
    from: ${it.name}-working
    to: ${it.next}
    description: items through step ${it.name}
    sensor:
      projection: ${projection}
      entering: ${it.next}
      over: 10m
  ${it.name}-retried:
    each: steps
    from: ${it.name}-working
    to: ${it.name}
    description: items step ${it.name} gave back, or lost to a silent run, to be taken again
    sensor:
      projection: ${projection}
      entering: ${it.name}
      where:
        lease.back: ${it.name}
      over: 10m
  ${it.name}-stuck:
    each: steps
    from: ${it.name}-working
    to: stuck
    description: items set aside at step ${it.name}, after every try
    sensor:
      projection: ${projection}
      entering: dead
      where:
        lease.back: ${it.name}
      over: 10m
  unstuck:
    if: ${unstick}
    from: stuck
    description: dead letters a person gave another go (back to their step) or finished
    sensor:
      projection: ${projection}
      leaving: dead
      over: 10m
goals:
  ${it.name}-clear:
    each: steps
    stock: ${it.name}
    hold: "<= 0"
    description: nothing waits at step ${it.name}
  none-stuck:
    if: ${unstick}
    stock: stuck
    hold: "<= 0"
    description: nothing stays set aside
blocks:
  ${it.name}:
    each: steps
    type:
      if: ${it.prompt}
      value: ai
      else: program
    goal: ${it.name}-clear
    takes:
      projection: ${projection}
      at: ${it.name}
      to: ${it.next}
    pool: ${pool}
    lease:
      ttl:
        if: ${it.prompt}
        value: ${ai-ttl}
        else: ${ttl}
      attempts: ${tries}
    run:
      unless: ${it.prompt}
      value: ${lib} each --projection ${projection} --state ${it.name} --done ${it.name}-done --run ${it.run:quote} --timeout ${timeout:seconds} --flow flow.${it.name}-done
    timeout:
      if: ${it.prompt}
      value: ${ai-timeout}
      else: ${timeout}
    prompt: ${it.prompt}
    model: ${it.model}
    tools: ${it.tools}
    actions: ${it.actions}
    workspace:
      if: ${it.prompt}
      value:
        if: ${workspace}
        value: workspace
    out: ["flow.${it.name}-taken", "flow.${it.name}-done"]
  unstick:
    if: ${unstick}
    type: person
    goal: none-stuck
    ask: ${unstick}
    out: flow.unstuck
