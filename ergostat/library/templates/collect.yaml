template: collect
description: The event collector. Polls a command or an HTTP endpoint and records each new record as an event about an item, de-duplicated and from a cursor; with mirror, each entry of an outside log once, under an id citing its position.
reading: |
  Control: an instrument, not a controller. It is the sensor on an arrival flow: it measures what came in (the
  new items per hour, over ten minutes) and records each record it saw as an event, so the items fold from them
  and other sensors count them. It never acts on what it reads.
  System dynamics: the inflow of whatever the source holds, into a stock: its own running total of items seen
  (`collected`), or a stock of yours (`into`), so that another template (or your own parts) drains it. A record
  that names an event (`event-field`) moves its item to the state the projection's `on` gives it.
example: |
  uses:
    deploys:
      use: collect
      with:
        url: https://ci.example.internal/api/deploys?since={cursor}
        headers: ["Authorization: Bearer $CI_TOKEN"]
        cursor-field: finished_at
        fields: [service, version, finished_at, status]
        poll: 5m
params:
  projection:
    type: name
    default: ${name}
    description: the projection; ids PROJECTION/<the record's id>, events PROJECTION.<event>
  command:
    type: command
    stand-in: a made-up feed
    description: a command printing the records as JSON (an array, an object holding one, or one per line); the cursor is in $ERGOSTAT_CURSOR
  url:
    type: url
    stand-in: a made-up feed
    description: an HTTP endpoint answering with the records as JSON; {cursor} in it is replaced
  headers:
    type: strings
    description: 'HTTP headers, each "Name: value"; $VARIABLES are read from the environment (keep secrets there)'
  id-field:
    default: id
    description: the field of a record that names it
  event:
    default: arrived
    description: the event a new record is (PROJECTION.arrived)
  event-field:
    default: event
    description: a record's field that names its event instead (answered, closed), when it has one
  cursor-field:
    description: a field that only grows (a time, a sequence); only records past the greatest seen are taken
  mirror:
    type: bool
    default: false
    description: "mirror an outside log: each entry recorded once, under the id cite:<this sensor>:<type>:<its cursor-field>, the cursor confirmed against the record and recovered from it; needs cursor-field, takes no changes"
  position:
    default: int
    description: "with mirror, how positions order: int (whole numbers) or text (ordered as text, so zero-padded, fixed-width times)"
  path:
    description: where the list of records is in the answer (data.items), when it is not the answer itself
  fields:
    type: strings
    description: the fields of a record to keep on the item (default every one)
  changes:
    type: bool
    default: false
    description: record a record seen again with different fields, as PROJECTION.changed
  poll:
    type: duration
    default: 1m
    description: how often the source is read
  stand-in-rate:
    type: number
    default: 120
    description: the stand-in feed's records per hour
  states:
    type: list
    default: [new]
    description: the projection's states; a new item starts in the first
  on:
    type: map
    description: "which events move an item to which state (PROJECTION.closed: closed), as the projection's on:"
  into:
    type: name
    description: a stock of yours (its whole name) the arrivals flow into, instead of the running total collected
  declare-projection:
    type: bool
    default: true
    description: false when the projection is declared elsewhere (by your parts, or another template)
projections:
  ${projection}:
    if: ${declare-projection}
    id: ${projection}/*
    description: what the collector ${name} saw
    states: ${states}
    on: ${on}
stocks:
  collected:
    unless: ${into}
    unit: items
    cumulative: true
    description: every item the collector has seen, a running total
    sensor:
      projection: ${projection}
      every: 30s
flows:
  arriving:
    to: ${into|collected}
    description: new items, as the collector sees them (per hour, over ten minutes)
    sensor:
      run: ${lib} collect --name ${name} --projection ${projection} ${command:arg} ${url:arg} ${headers:arg} --id-field ${id-field:quote} --event ${event:quote} --event-field ${event-field:quote} ${cursor-field:arg} ${path:arg} ${fields:arg} ${changes:arg} ${mirror:arg} --position ${position:quote} --stand-in ${stand-in-rate} --window 600
      every: ${poll}
      averages: 10m
