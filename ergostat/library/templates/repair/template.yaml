template: repair
once: true
description: A program that fails is triaged, fixed by an AI in a disposable clone, tested in the sandbox and proposed as a gated change with its impact report, answered by a person or, with approver ai, program or rule, by an AI, the owner's program or a rule behind a guard in code.
reading: |
  System dynamics: an aging chain of failures (the built-in projection ergostat.failure, one item a signature), filled as
  programs fail (failures-found) and drained through a fix, its test and its approval; a fix that fails its test flows
  back (rework), one denied leaves (fixes-dismissed). An applied fix is judged by the runs of its block begun after
  it: verify runs that finished well verify it (fixes-verified; not a claim the failure is fixed), one that failed
  regresses it (fixes-regressed) and revert-fix is asked for; an approved revert drains it (fixes-reverted).
  Control: no-open-failures holds the open failures at 0 through the fixer (an AI, haiku by default, no tools: a clone
  of its own, the fix tested in the sandbox, apply-fix asked for with its impact report); fixes-answered holds the
  fixes waiting at 0 through their approver: the person (the ladder's first rung), or with approver: ai the second,
  an AI (the same model, no tools) asked only about a fix a guard in code reads as computing with plain values and
  printing (approver: program asks the owner's command instead, rule approves once the block's last 10 answered
  fixes were approved, ran and none regressed; with promote: true a block moves down a rung once its last 10 fixes
  answered at its rung went well, and back to approver on a regressed fix or a denial); whatever the guard or the
  approver does not approve stays held for the person. repair-settle judges the applied fixes, and asks the person for each regressed one's revert; fixes-hold,
  which it reads, holds the fixes regressed over the last 14 days at 0 (a window: a denied revert leaves a failure
  regressed for good).
  It is used once a model, and its parts keep the names written here.
example: |
  uses:
    repair:
      use: repair
      with:
        daily: 2                      # dollars a day, at most, for every AI call of the loop
params:
  model: {default: haiku, description: "the fixer's model"}
  budget: {type: number, default: 0.25, description: "the most one AI call may cost, in dollars (claude --max-budget-usd)"}
  daily: {type: number, default: 2, description: "the most the loop's AI calls may cost in a day, in dollars: past it, none starts"}
  approver: {default: person, choices: [person, ai, program, rule], description: "who answers apply-fix: the person; or, behind the guard of SPEC §12r, ai, program (the approve-with command) or rule (the block's last 10 answered fixes approved, run and none regressed); what they do not approve stays held for the person"}
  approve-with: {type: command, required: "${approver} == program", description: "with approver program: the project's command that answers a fix, given {program, diff, test} on stdin, approving only by exiting 0 with {\"approve\": true} (no secrets, at most 60s)"}
  promote: {type: bool, default: false, description: "move a block's fixes down the ladder from approver (person, ai, program only with approve-with, rule) one rung each time its last 10 fixes answered at the rung (at the person's, by the owner, never an agent through the MCP), by seq, were approved and ran; a regressed or reverted fix of the block, or a denial, sends it back to approver (worked out from the record each time, never stored)"}
  approve: {default: approve, choices: [approve, deny], description: "the gate on apply-fix (auto is not offered: approval is the ladder's)"}
  test: {type: command, description: "the project's tests, run in the sandbox for a program that is not read-only"}
  timeout: {type: duration, default: 5m, description: how long one AI call, or one test, may take}
  tries: {type: integer, default: 3, description: how many fixes are tried for one failure before it is a dead letter}
  verify: {type: integer, default: 3, description: "how many runs of the failing block, begun after a fix, must finish well before it counts as verified (1 to 50)"}
  count-every: {type: duration, default: 10s, description: how often the failures are counted by state}
actions:
  apply-fix:
    run: ${python} -m ergostat.repair apply
    gate: ${approve}
    in: .
    description: "Approving merges this code into your repository; it then runs with your rights, outside the sandbox (the diff is on the failure's page)"
  revert-fix:
    run: ${python} -m ergostat.repair revert
    gate: ${approve}
    in: .
    timeout: 5m
    description: "Approving reverts the applied fix in your repository with one new commit (git revert): the program goes back to what it was before the fix"
stocks:
  open-failures: {unit: failures, description: failures waiting for a fix, sensor: {projection: ergostat.failure, state: open, every: "${count-every}"}}
  fixing: {unit: failures, description: failures the fixer holds, each in a clone of its own, sensor: {projection: ergostat.failure, state: leased, every: "${count-every}"}}
  awaiting-approval: {unit: failures, description: fixes that passed their test, waiting for their approver, sensor: {projection: ergostat.failure, state: awaiting-approval, every: "${count-every}"}}
  applied-fixes: {unit: failures, description: fixes applied and being verified by the runs after them, sensor: {projection: ergostat.failure, state: applied, every: "${count-every}"}}
  regressed-fixes: {unit: failures, description: applied fixes a run after them failed, waiting for their revert, sensor: {projection: ergostat.failure, state: regressed, every: "${count-every}"}}
auxiliaries:
  repair-spend:
    unit: USD
    driven-by: +flow.fixes-started
    description: what the loop's AI calls cost
    sensor: {builtin: ergostat.cost.usd@repair-fix, every: 1m}
  fixes-regressed-recent:
    unit: failures
    driven-by: +flow.fixes-regressed
    description: fixes regressed over the last 14 days (a denied revert leaves one regressed for good; this window passes)
    sensor: {projection: ergostat.failure, entering: regressed, over: 14d}
flows:
  failures-found: {to: open-failures, description: "programs failing in a way not open already (new, or again after a fix)", sensor: {projection: ergostat.failure, entering: open, over: 1h}}
  fixes-started: {from: open-failures, to: fixing, driven-by: +stock.open-failures, sensor: {projection: ergostat.failure, entering: leased, over: 1h}}
  fixes-proposed: {from: fixing, to: awaiting-approval, driven-by: +stock.fixing, sensor: {projection: ergostat.failure, entering: awaiting-approval, over: 1h}}
  fixes-failed: {from: fixing, to: open-failures, driven-by: +stock.fixing, description: a fix that failed its test, given back (rework), sensor: {projection: ergostat.failure, entering: open, where: {lease.back: open}, over: 1h}}
  fixes-applied: {from: awaiting-approval, to: applied-fixes, driven-by: +stock.awaiting-approval, sensor: {projection: ergostat.failure, entering: applied, over: 1h}}
  fixes-verified: {from: applied-fixes, driven-by: +stock.applied-fixes, description: "fixes whose block then ran well verify times (not a claim the failure is fixed)", sensor: {projection: ergostat.failure, entering: verified, over: 1h}}
  fixes-regressed: {from: applied-fixes, to: regressed-fixes, driven-by: +stock.applied-fixes, description: fixes whose block failed again after them, sensor: {projection: ergostat.failure, entering: regressed, over: 1h}}
  fixes-reverted: {from: regressed-fixes, driven-by: +stock.regressed-fixes, description: regressed fixes reverted once their revert was approved, sensor: {projection: ergostat.failure, entering: reverted, over: 1h}}
  fixes-dismissed: {from: awaiting-approval, driven-by: +stock.awaiting-approval, description: fixes their approver denied, sensor: {projection: ergostat.failure, entering: dismissed, over: 1h}}
goals:
  no-open-failures: {stock: open-failures, hold: "<= 0", description: every failure is being fixed}
  fixes-answered: {stock: awaiting-approval, hold: "<= 0", description: every fix tested is answered by its approver}
  fixes-hold: {auxiliary: fixes-regressed-recent, hold: "<= 0", tolerance: 0, on-stale: "off", description: no applied fix regressed in the last 14 days}
blocks:
  repair-fix:
    type: ai
    goal: no-open-failures
    takes: {projection: ergostat.failure, at: open, to: [awaiting-approval, dismissed]}
    lease: {attempts: "${tries}"}
    actions: [apply-fix]
    model: ${model}
    prompt: "ergostat's own fixer (python -m ergostat.repair fix, its prompt ergostat/repair/fixer.md; SPEC §12r)"
    run: ${python} -m ergostat.repair fix --model ${model} --budget ${budget} --daily ${daily} --timeout ${timeout:seconds} --approver ${approver} ${approve-with:arg} ${promote:arg} ${test:arg}
    timeout: ${timeout}
    out: [flow.fixes-started, flow.fixes-proposed, flow.fixes-failed]
  repair-settle:
    type: program
    goal: fixes-answered
    in: goal.fixes-hold              # served by the revert it asks for each regressed fix
    every: 30s
    run: ${python} -m ergostat.repair settle --verify ${verify}
    actions: [revert-fix]
    out: [flow.fixes-dismissed, flow.fixes-verified, flow.fixes-regressed]
