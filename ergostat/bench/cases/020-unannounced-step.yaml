# The truth of SD Lab's ladder case 020-unannounced-step, converted by scripts/bench_ladder.py: a step is three minutes,
# every number a parameter. Unannounced steps in an inflow
# Unannounced steps in an inflow
name: ladder-020
parameters:
  a-to-b-per-a:
    value: 10
    unit: 1/h
    estimate: true
  b-out-per-b:
    value: 4
    unit: 1/h
    estimate: true
stocks:
  a:
    unit: units
    sensor:
      manual: true
  b:
    unit: units
    sensor:
      manual: true
flows:
  a-in:
    to: a
    sensor:
      manual: true
  a-to-b:
    from: a
    to: b
    driven-by: [+stock.a]
    equation: a-to-b-per-a * stock.a
  b-out:
    from: b
    driven-by: [+stock.b]
    equation: b-out-per-b * stock.b
