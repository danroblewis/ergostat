# The truth of SD Lab's ladder case 063-delay3-supply-line, converted by scripts/bench_ladder.py: a step is three minutes,
# every number a parameter. A third-order delay (DELAY3) between two measured stocks
# A third-order delay (DELAY3) between two measured stocks
name: ladder-063
parameters:
  a-to-b-per-a:
    value: 2
    unit: 1/h
    estimate: true
  a-to-b-delay:
    value: 0.3
    unit: h
    estimate: true
  b-out-per-b:
    value: 1.6
    unit: 1/h
    estimate: true
stocks:
  a:
    unit: units
    sensor:
      manual: true
  b:
    unit: units
    sensor:
      manual: true
flows:
  a-in:
    to: a
    sensor:
      manual: true
  a-leaves:
    from: a
    driven-by: [+stock.a]
    equation: a-to-b-per-a * stock.a
  b-arrives:
    to: b
    driven-by: [+flow.a-leaves]
    equation: "DELAY3(flow.a-leaves, a-to-b-delay)"
  b-out:
    from: b
    driven-by: [+stock.b]
    equation: b-out-per-b * stock.b
